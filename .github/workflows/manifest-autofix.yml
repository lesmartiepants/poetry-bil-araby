name: Manifest Auto-Reconcile

# Self-maintaining feature coverage. On every push to main, a cheap deterministic
# check looks for manifest drift. Only when drift is found does it wake Claude to
# reconcile the manifest honestly (and add a gauntlet-verified test where it can),
# then opens a PR. Feature PRs are never blocked for adding a feature; the bot
# keeps the inventory current on its own. See docs/ci/manifest-autofix-instructions.md.

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'src/**'
      - 'e2e/**'
      - 'feature-manifest.json'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: manifest-autofix
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Cheap gate: if the manifest already matches the code, do nothing (no Claude, $0).
      - name: Detect drift
        id: drift
        run: |
          set +e
          node scripts/check-feature-manifest.mjs --json > drift.json 2>/dev/null
          # --needs-reconcile exits non-zero when the bot has anything to do:
          # an addition, a removal/rename (dead ref), OR an in-place update
          # (a feature's source changed since its last hash baseline).
          node scripts/check-feature-manifest.mjs --needs-reconcile > /dev/null 2>&1
          code=$?
          if [ "$code" = "0" ]; then
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
            echo "Manifest is in sync (no add/remove/update). Nothing to do."
          else
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
            echo "Reconcile needed — waking Claude."
            cat drift.json
          fi

      # Only runs when there is drift. Claude edits the manifest (+ verified test),
      # following the honest playbook. It must not push or open a PR itself.
      - name: Claude reconcile
        if: steps.drift.outputs.has_drift == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The feature manifest has drifted from the code (a push to main added or
            changed a feature). Reconcile it by following, step by step, the
            instructions in docs/ci/manifest-autofix-instructions.md.

            The drift report is in drift.json in the repo root. Honesty rule: never
            write coverage:"behavioral" without a gauntlet-verified test
            (node scripts/guard-gauntlet.mjs). Default new features to coverage:"none".
            Touch only feature-manifest.json, docs/APP-STATE.md, and new test files.
            Do NOT commit, push, or open a PR — leave your changes in the working tree.

      # Deterministic PR creation from whatever Claude changed.
      - name: Open reconcile PR
        if: steps.drift.outputs.has_drift == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/manifest-autofix
          base: main
          commit-message: 'chore(manifest): auto-reconcile feature coverage'
          title: 'chore(manifest): auto-reconcile feature coverage'
          labels: manifest-autofix
          delete-branch: true
          body: |
            Automated feature-manifest reconciliation after a push to `main`.

            A cheap drift check found the manifest out of sync with the code, and
            Claude reconciled it per `docs/ci/manifest-autofix-instructions.md`:
            new features added with **honest** coverage labels, and any behavioral
            test included was proven by the mutation gauntlet (passes clean, fails
            on break, not flaky).

            This PR touches only `feature-manifest.json`, `docs/APP-STATE.md`, and
            test files, so it is eligible for auto-merge (see Manifest Auto-Merge).
            If it touches anything else, auto-merge is skipped and a human should review.
