v style=\"font:600 15px 'Readex Pro'\">8 cards due<\/div><div style=\"font:400 13px 'Readex Pro';color:#B5C4C0\">Words and lines from earlier verses<\/div><\/div>\n<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B5C4C0\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"><\/path><\/svg>\n<\/div>\n<nav style=\"margin-top:auto;display:flex;justify-content:space-around;padding:8px 8px 26px;border-top:1px solid #1C3A3D\">\n<button class=\"tab\" style=\"color:#E7A33E\" aria-current=\"page\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\/circle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3\"><\/path><\/svg>Today<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4 5h7v15H4zM13 5h7v15h-7z\"><\/path><\/svg>Read<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><rect x=\"4\" y=\"6\" width=\"13\" height=\"14\" rx=\"2\"><\/rect><path d=\"M8 3h11v13\"><\/path><\/svg>Review<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\/circle><path d=\"M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6\"><\/path><\/svg>You<\/button>\n<\/nav>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:158px;top:398px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>1 · Today.<\/b> One verse, sized as a six-minute session, with what you will learn listed up front. Reviews due sit just below. Four tabs.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"padding:56px 16px 0 12px;display:flex;align-items:center;gap:6px\"><button aria-label=\"Back\" style=\"width:44px;height:44px;border:0;background:none;color:#F1E9DA;cursor:pointer\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button><div style=\"flex:1;font:600 15px 'Readex Pro'\">Read in layers<\/div><div style=\"font:500 12px 'Readex Pro';color:#B5C4C0\">Step 1 of 4<\/div><\/header>\n<div style=\"display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap\" role=\"group\" aria-label=\"Layers\">\n<button class=\"tg on\" aria-pressed=\"true\">Arabic<\/button><button class=\"tg on\" aria-pressed=\"true\">Sound it out<\/button><button class=\"tg on\" aria-pressed=\"true\">English<\/button><button class=\"tg\" aria-pressed=\"false\">Meter<\/button>\n<\/div>\n<div style=\"padding:26px 24px 0;display:flex;flex-direction:column;gap:8px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:30px;line-height:1.9;text-align:right\"><span class=\"u\">الخَيْلُ<\/span> <span class=\"u\">وَاللّيْلُ<\/span> <span class=\"u\">وَالبَيْداءُ<\/span> <span class=\"u\" style=\"text-decoration-color:#E7A33E;color:#F3BE6A\">تَعرِفُني<\/span><\/div>\n<div class=\"tr\">al-khaylu wa-l-laylu wa-l-baydāʾu taʿrifunī<\/div>\n<div class=\"en\">The horses, the night and the desert know me,<\/div>\n<div style=\"height:1px;background:#1C3A3D;margin:14px 0\"><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:30px;line-height:1.9;text-align:right\"><span class=\"u\">وَالسّيفُ<\/span> <span class=\"u\">وَالرّمحُ<\/span> <span class=\"u\">والقِرْطاسُ<\/span> <span class=\"u\">وَالقَلَمُ<\/span><\/div>\n<div class=\"tr\">wa-s-sayfu wa-r-rumḥu wa-l-qirṭāsu wa-l-qalamu<\/div>\n<div class=\"en\">and the sword, the spear, the paper and the pen.<\/div>\n<\/div>\n<div style=\"margin-top:auto;padding:0 20px 30px;display:flex;gap:10px\"><button class=\"sec\" style=\"flex:1\">Listen<\/button><button class=\"pri\" style=\"flex:1\">Next: roots<\/button><\/div>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:34px;top:206px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>2 · Layered reader.<\/b> Arabic, a sound-it-out line, English and meter are toggles, so learners take the stabilisers off as they improve. Dotted underlines mark tappable words.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"padding:56px 16px 0 12px;display:flex;align-items:center;gap:6px\"><button aria-label=\"Back\" style=\"width:44px;height:44px;border:0;background:none;color:#F1E9DA;cursor:pointer\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button><div style=\"flex:1;font:600 15px 'Readex Pro'\">Root explorer<\/div><div style=\"font:500 12px 'Readex Pro';color:#B5C4C0\">Step 2 of 4<\/div><\/header>\n<div style=\"margin-top:22px;text-align:center\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;color:#B5C4C0\">تَعرِفُني <span style=\"font-family:'Readex Pro';font-size:13px\">· they know me<\/span><\/div><\/div>\n<div style=\"margin:16px auto 0;width:128px;height:128px;border-radius:64px;border:2px solid #E7A33E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px\"><div class=\"ar\" lang=\"ar\" style=\"font-size:34px;letter-spacing:.2em;font-weight:700\">ع ر ف<\/div><div style=\"font:500 12px 'Readex Pro';color:#E7A33E\">to know<\/div><\/div>\n<div aria-hidden=\"true\" style=\"width:2px;height:22px;background:#2F5256;margin:0 auto\"><\/div>\n<ul style=\"list-style:none;margin:0 20px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n<li class=\"card\" style=\"padding:12px 14px;border-radius:16px\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;text-align:right\">مَعْرِفة<\/div><div style=\"font:400 12px 'Readex Pro';color:#B5C4C0;text-align:right\">maʿrifa · knowledge<\/div><\/li>\n<li class=\"card\" style=\"padding:12px 14px;border-radius:16px\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;text-align:right\">عارِف<\/div><div style=\"font:400 12px 'Readex Pro';color:#B5C4C0;text-align:right\">ʿārif · one who knows<\/div><\/li>\n<li class=\"card\" style=\"padding:12px 14px;border-radius:16px\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;text-align:right\">مَعْروف<\/div><div style=\"font:400 12px 'Readex Pro';color:#B5C4C0;text-align:right\">maʿrūf · known; a kindness<\/div><\/li>\n<li class=\"card\" style=\"padding:12px 14px;border-radius:16px\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;text-align:right\">تَعارُف<\/div><div style=\"font:400 12px 'Readex Pro';color:#B5C4C0;text-align:right\">taʿāruf · getting acquainted<\/div><\/li>\n<li class=\"card\" style=\"padding:12px 14px;border-radius:16px\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;text-align:right\">اِعْتِراف<\/div><div style=\"font:400 12px 'Readex Pro';color:#B5C4C0;text-align:right\">iʿtirāf · confession<\/div><\/li>\n<li class=\"card\" style=\"padding:12px 14px;border-radius:16px\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;text-align:right\">عَرَفَ<\/div><div style=\"font:400 12px 'Readex Pro';color:#B5C4C0;text-align:right\">ʿarafa · he knew<\/div><\/li>\n<\/ul>\n<div style=\"margin-top:auto;padding:0 20px 30px;display:flex;gap:10px\"><button class=\"sec\" style=\"flex:1\">Add root<\/button><button class=\"pri\" style=\"flex:1\">Next: recite<\/button><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>3 · Root explorer.<\/b> The tapped word opens its three-letter root and the family that grows from it. One root unlocks six words; that is how Arabic actually sticks.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"padding:56px 16px 0 12px;display:flex;align-items:center;gap:6px\"><button aria-label=\"Back\" style=\"width:44px;height:44px;border:0;background:none;color:#F1E9DA;cursor:pointer\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button><div style=\"flex:1;font:600 15px 'Readex Pro'\">Recite<\/div><div style=\"font:500 12px 'Readex Pro';color:#B5C4C0\">Step 3 of 4<\/div><\/header>\n<div style=\"padding:40px 24px 0;display:flex;flex-direction:column;gap:8px\">\n<div class=\"lbl\" style=\"text-align:right\">Say this line<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:31px;line-height:1.9;text-align:right\"><span style=\"color:#F1E9DA\">الخَيْلُ وَاللّيْلُ<\/span> <span style=\"color:#7E9692\">وَالبَيْداءُ تَعرِفُني<\/span><\/div>\n<div class=\"tr\">al-khaylu wa-l-laylu wa-l-baydāʾu taʿrifunī<\/div>\n<\/div>\n<div style=\"margin-top:46px;display:flex;flex-direction:column;align-items:center;gap:18px\">\n<div aria-hidden=\"true\" style=\"display:flex;align-items:center;gap:4px;height:56px\">\n<span style=\"width:4px;height:18px;background:#E7A33E;border-radius:2px\"><\/span><span style=\"width:4px;height:38px;background:#E7A33E;border-radius:2px\"><\/span><span style=\"width:4px;height:52px;background:#E7A33E;border-radius:2px\"><\/span><span style=\"width:4px;height:30px;background:#E7A33E;border-radius:2px\"><\/span><span style=\"width:4px;height:44px;background:#E7A33E;border-radius:2px\"><\/span><span style=\"width:4px;height:24px;background:#E7A33E;border-radius:2px\"><\/span><span style=\"width:4px;height:12px;background:#2F5256;border-radius:2px\"><\/span><span style=\"width:4px;height:12px;background:#2F5256;border-radius:2px\"><\/span><span style=\"width:4px;height:12px;background:#2F5256;border-radius:2px\"><\/span>\n<\/div>\n<button aria-label=\"Stop recording\" style=\"width:96px;height:96px;border-radius:48px;border:0;background:#E7A33E;color:#1B1407;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(231,163,62,.15);cursor:pointer\"><svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"><\/rect><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"><\/path><\/svg><\/button>\n<div style=\"font:500 14px 'Readex Pro';color:#B5C4C0\" role=\"status\">Listening… tap to finish<\/div>\n<\/div>\n<div style=\"margin-top:auto;padding:0 20px 30px\"><button class=\"sec\" style=\"width:100%\">Hear the model first<\/button><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>4 · Recite.<\/b> Read the line aloud. Words light up as they are recognised, so you can see where you are. Hearing the model first is always one tap away.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"padding:56px 16px 0 12px;display:flex;align-items:center;gap:6px\"><button aria-label=\"Back\" style=\"width:44px;height:44px;border:0;background:none;color:#F1E9DA;cursor:pointer\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button><div style=\"flex:1;font:600 15px 'Readex Pro'\">How it sounded<\/div><div style=\"font:500 12px 'Readex Pro';color:#B5C4C0\">Step 3 of 4<\/div><\/header>\n<div style=\"padding:30px 24px 0\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:30px;line-height:2;text-align:right\"><span style=\"border-bottom:3px solid #7FC8A9\">الخَيْلُ<\/span> <span style=\"border-bottom:3px solid #7FC8A9\">وَاللّيْلُ<\/span> <span style=\"border-bottom:3px dashed #E7A33E;color:#F3BE6A\">وَالبَيْداءُ<\/span> <span style=\"border-bottom:3px solid #7FC8A9\">تَعرِفُني<\/span><\/div>\n<\/div>\n<ul style=\"list-style:none;margin:22px 20px 0;padding:0;display:flex;flex-direction:column;gap:10px\">\n<li class=\"card\" style=\"padding:14px 16px;display:flex;gap:12px;align-items:flex-start\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7FC8A9\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><path d=\"m5 12 4 4 10-10\"><\/path><\/svg><div><div style=\"font:600 14px 'Readex Pro'\">3 of 4 words clear<\/div><div style=\"font:400 13px/1.45 'Readex Pro';color:#B5C4C0\">The doubled lām in wa-l-laylu came through well.<\/div><\/div><\/li>\n<li class=\"card\" style=\"padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border:1px solid #6B4E1E\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E7A33E\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex:none;margin-top:2px\"><path d=\"M12 8v5M12 16.5v.5\"><\/path><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><\/svg><div><div style=\"font:600 14px 'Readex Pro'\">Try again: <span class=\"ar\" lang=\"ar\" style=\"font-size:18px\">البَيْداءُ<\/span><\/div><div style=\"font:400 13px/1.45 'Readex Pro';color:#B5C4C0\">Hold the long ā in al-baydāʾ, then close with the glottal stop.<\/div><\/div><\/li>\n<\/ul>\n<div style=\"margin-top:auto;padding:0 20px 30px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;gap:10px\"><button class=\"sec\" style=\"flex:1\">Hear the word<\/button><button class=\"sec\" style=\"flex:1\">Try again<\/button><\/div><button class=\"pri\">Next: review<\/button><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>5 · Feedback.<\/b> Clear words get a solid line and a check; the one to work on gets a dashed line and a specific, sayable tip. Shape and icon carry the meaning, not just color.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"padding:56px 16px 0 12px;display:flex;align-items:center;gap:6px\"><button aria-label=\"Close\" style=\"width:44px;height:44px;border:0;background:none;color:#F1E9DA;cursor:pointer\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg><\/button><div style=\"flex:1;font:600 15px 'Readex Pro'\">Review<\/div><div style=\"font:500 12px 'Readex Pro';color:#B5C4C0\">3 of 8<\/div><\/header>\n<div style=\"margin:8px 24px 0;height:4px;border-radius:2px;background:#1C3A3D\"><div style=\"width:37%;height:4px;border-radius:2px;background:#E7A33E\"><\/div><\/div>\n<div class=\"card\" style=\"margin:30px 24px 0;height:380px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:1px solid #2F5256;position:relative\">\n<div class=\"lbl\">Word · from al-Mutanabbi<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:54px;font-weight:700\">القِرْطاسُ<\/div>\n<div style=\"height:1px;width:40px;background:#2F5256\"><\/div>\n<div style=\"font:500 20px 'Readex Pro'\">paper, parchment<\/div>\n<div style=\"font:400 13px 'Readex Pro';color:#B5C4C0\">al-qirṭās · root ق ر ط س<\/div>\n<button aria-label=\"Hear it\" style=\"position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:22px;border:1px solid #2F5256;background:none;color:#F1E9DA;display:flex;align-items:center;justify-content:center;cursor:pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 0 1 0 6\"><\/path><\/svg><\/button>\n<\/div>\n<div style=\"margin-top:auto;padding:0 20px 30px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px\">\n<button class=\"sec\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;gap:2px\"><span style=\"font:600 14px 'Readex Pro'\">Again<\/span><span style=\"font:400 11px 'Readex Pro';color:#B5C4C0\">1 min<\/span><\/button>\n<button class=\"sec\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;gap:2px\"><span style=\"font:600 14px 'Readex Pro'\">Good<\/span><span style=\"font:400 11px 'Readex Pro';color:#B5C4C0\">3 days<\/span><\/button>\n<button class=\"pri\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;gap:2px\"><span style=\"font:600 14px 'Readex Pro'\">Easy<\/span><span style=\"font:400 11px 'Readex Pro'\">9 days<\/span><\/button>\n<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>6 · Review.<\/b> Spaced-repetition cards built only from words and lines you met in poems, each one linked back to its verse. Intervals are shown before you tap.<\/figcaption>\n<\/figure>\n\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "v1"}, "V2Directions.dc.html": {"x": 0, "y": 0, "w": 2112, "h": 1040, "title": "v2 · Three directions and the recommendation", "page": "v2", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>v2: three directions<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Reem+Kufi:wght@500;700&amp;family=Jost:wght@400;500&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#D4B06A}a:hover{color:#F2D58E}\n.step{margin:0;width:360px;flex:none;display:flex;flex-direction:column;gap:16px}\n.ph{width:360px;height:780px;border-radius:44px;overflow:hidden;position:relative;box-sizing:border-box;background:#0B0A0F;border:1px solid #2A2730;display:flex;flex-direction:column;color:#F2EDE3;font-family:Inter,sans-serif}\n.cap{font:400 14px/1.5 Inter;color:#BDB5A6;margin:0}\n.cap b{color:#F2EDE3;font-weight:600}\n.ar{font-family:Amiri,serif;direction:rtl;text-align:right}\n.kufi{font-family:'Reem Kufi',sans-serif;direction:rtl}\n.caps{font:400 13px Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase}\n.en{font-family:'Cormorant Garamond',serif;font-style:italic;text-align:right;color:#D6CFC1}\n.ib{background:none;border:0;color:#F2EDE3;width:48px;height:48px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:24px;cursor:pointer}\n.lab{font:600 11px Inter;letter-spacing:.14em;color:#9C9588;text-transform:uppercase}\nth,td{text-align:left;vertical-align:top;padding:12px 10px;border-bottom:1px solid #2A2730;font:400 14px/1.45 Inter;color:#D6CFC1}\nth{font:600 11px Inter;letter-spacing:.12em;color:#9C9588;text-transform:uppercase}\n.tag{display:inline-block;font:600 10px Inter;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:#211E27;color:#D4B06A;margin-left:6px;vertical-align:middle}\n<\/style>\n<\/helmet>\n<div style=\"width:2112px;height:1040px;box-sizing:border-box;padding:64px;background:#08070B;display:flex;gap:64px;font-family:Inter,sans-serif\">\n\n<aside style=\"width:760px;flex:none;display:flex;flex-direction:column;gap:22px;color:#F2EDE3\">\n<div style=\"font:600 12px Inter;letter-spacing:.14em;color:#D4B06A\">PRINCIPAL REDESIGN · V2<\/div>\n<h1 style=\"margin:0;font:500 52px/1.05 'Cormorant Garamond',serif\">Three directions from the original screen. Recommend A.<\/h1>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px\">\n<div style=\"padding:16px;border-radius:16px;background:#17151C\"><div class=\"lab\">User goal<\/div><p style=\"margin:8px 0 0;font:400 14px/1.45 Inter;color:#D6CFC1\">Read and feel a poem in Arabic, and understand it at my level.<\/p><\/div>\n<div style=\"padding:16px;border-radius:16px;background:#17151C\"><div class=\"lab\">Business goal <span class=\"tag\">ASSUMED<\/span><\/div><p style=\"margin:8px 0 0;font:400 14px/1.45 Inter;color:#D6CFC1\">Day-7 retention and listen rate, ahead of any subscription.<\/p><\/div>\n<div style=\"padding:16px;border-radius:16px;background:#17151C\"><div class=\"lab\">Constraint<\/div><p style=\"margin:8px 0 0;font:400 14px/1.45 Inter;color:#D6CFC1\">Mobile web (PWA), RTL and LTR mixed, cleared text and audio rights.<\/p><\/div>\n<\/div>\n<table style=\"border-collapse:collapse;width:100%\">\n<thead><tr><th>Direction<\/th><th>Best for<\/th><th>Primary action<\/th><th>Main risk<\/th><th>Effort<\/th><\/tr><\/thead>\n<tbody>\n<tr><td style=\"color:#F2EDE3\"><b>A · Night Reader<\/b><span class=\"tag\">PICK<\/span><\/td><td>All three segments<\/td><td>Play, then tap a word<\/td><td>Feels familiar, less distinctive<\/td><td>Low<\/td><\/tr>\n<tr><td style=\"color:#F2EDE3\"><b>B · Recital<\/b><\/td><td>Native and heritage listeners<\/td><td>Listen, one couplet at a time<\/td><td>Weak for skimming and study<\/td><td>Medium<\/td><\/tr>\n<tr><td style=\"color:#F2EDE3\"><b>C · Study<\/b><\/td><td>Learners of Arabic<\/td><td>Read with layers on<\/td><td>Clutter; feels like homework to native readers<\/td><td>Medium<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div style=\"padding:18px 20px;border-radius:16px;border:1px solid #3A3328;background:#141218\">\n<div class=\"lab\" style=\"color:#D4B06A\">Why A<\/div>\n<ul style=\"margin:10px 0 0;padding-left:18px;font:400 15px/1.6 Inter;color:#D6CFC1\">\n<li>It keeps the brand equity of the original (night, gold, star lattice, Kufi title) and fixes all four Major audit issues. <span class=\"tag\">INFERENCE<\/span><\/li>\n<li>B's karaoke highlight and C's layers become features inside A (Listen mode, Layers chip), so nothing is lost. <span class=\"tag\">INFERENCE<\/span><\/li>\n<li>One reader serves all three levels if a first-run choice sets the default layers. <span class=\"tag\">HYPOTHESIS<\/span> Test: task success for word lookup at least 80% in each segment.<\/li>\n<\/ul>\n<\/div>\n<p style=\"margin:auto 0 0;font:400 13px/1.5 Inter;color:#9C9588\">Verse shown is al-Mutanabbi (10th c., public domain) with original translations, in place of the Darwish text, which is still under copyright.<\/p>\n<\/a t:1.7\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div class=\"en\" style=\"font-size:19px;line-height:1.35\">The horses, the night and the desert know me,<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7;margin-top:12px\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div class=\"en\" style=\"font-size:19px;line-height:1.35\">and the sword, the spear, the paper and the pen.<\/div>\n<\/div>\n<div style=\"margin-top:auto;padding:0 20px 28px;display:flex;align-items:center;gap:4px\">\n<button style=\"height:56px;padding:0 26px;border-radius:28px;border:0;background:#D4B06A;color:#141210;font:600 15px Inter;display:flex;align-items:center;gap:8px;cursor:pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M7 5v14l12-7z\"><\/path><\/svg>Listen<\/button>\n<div style=\"flex:1\"><\/div>\n<button class=\"ib\" aria-label=\"Save\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg><\/button>\n<button class=\"ib\" aria-label=\"Share\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 15V4M8 8l4-4 4 4M5 13v6h14v-6\"><\/path><\/svg><\/button>\n<button class=\"ib\" aria-label=\"Insights and more\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"12\" r=\"1.8\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"1.8\"><\/circle><circle cx=\"19\" cy=\"12\" r=\"1.8\"><\/circle><\/svg><\/button>\n<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>A · Night Reader (recommended).<\/b> The original screen, kept: lattice header, Kufi title, tracked caps, voweled verse, italic translation. Fixed: Listen is primary, actions sit in one row, the translation passes contrast (12.7:1), Layers adapts to level.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"justify-content:center\">\n<svg aria-hidden=\"true\" width=\"360\" height=\"320\" style=\"position:absolute;left:0;top:0;pointer-events:none;opacity:.6\"><defs><pattern id=\"st2\" width=\"44\" height=\"44\" patternUnits=\"userSpaceOnUse\"><path d=\"M22 6 L38 22 L22 38 L6 22Z M10.7 10.7H33.3V33.3H10.7Z\" fill=\"none\" stroke=\"#33406B\" stroke-width=\"1\"><\/path><\/pattern><linearGradient id=\"fd2\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".7\"><\/stop><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"><\/stop><\/linearGradient><mask id=\"mk2\"><rect width=\"360\" height=\"320\" fill=\"url(#fd2)\"><\/rect><\/mask><\/defs><rect width=\"360\" height=\"320\" fill=\"url(#st2)\" mask=\"url(#mk2)\"><\/rect><\/svg>\n<div style=\"position:absolute;top:56px;left:0;right:0;text-align:center\"><div class=\"kufi\" lang=\"ar\" style=\"font-size:20px;color:#D4B06A\">واحر قلباه<\/div><div class=\"caps\" style=\"font-size:11px;color:#BDB5A6;margin-top:4px\">Couplet 2 of [N]<\/div><\/div>\n<div style=\"padding:0 28px;text-align:center\">\n<div class=\"ar\" lang=\"ar\" style=\"text-align:center;font-size:38px;line-height:1.8\"><span>الخَيْلُ وَاللّيْلُ <\/span><span style=\"color:#D4B06A;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:12px\">وَالبَيْداءُ<\/span><span style=\"color:#9C9588\"> تَعرِفُني<\/span><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"text-align:center;font-size:38px;line-height:1.8;color:#9C9588\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<\/div>\n<div style=\"position:absolute;left:20px;right:20px;bottom:28px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"height:4px;border-radius:2px;background:#26232C\"><div style=\"width:34%;height:4px;border-radius:2px;background:#D4B06A\"><\/div><\/div>\n<div style=\"display:flex;align-items:center;justify-content:space-between\">\n<button class=\"ib\" aria-label=\"Previous couplet\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 5v14M18 6l-8 6 8 6z\"><\/path><\/svg><\/button>\n<button class=\"ib\" aria-label=\"Show translation\" style=\"font:600 13px Inter\">EN<\/button>\n<button aria-label=\"Pause\" style=\"width:68px;height:68px;border-radius:34px;border:0;background:#D4B06A;color:#141210;display:flex;align-items:center;justify-content:center;cursor:pointer\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><\/svg><\/button>\n<button class=\"ib\" aria-label=\"Playback speed\" style=\"font:600 13px Inter\">1×<\/button>\n<button class=\"ib\" aria-label=\"Next couplet\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M18 5v14M6 6l8 6-8 6z\"><\/path><\/svg><\/button>\n<\/div>\n<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>B · Recital.<\/b> Audio-first, one couplet on screen, word-by-word highlight. Unlike v1's Ink, every control is visible (no hidden gestures), at the cost of some atmosphere. Strong for listeners, weak for study.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"display:flex;align-items:center;gap:6px;padding:48px 14px 0 6px\"><button class=\"ib\" aria-label=\"Back\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button><div style=\"flex:1\"><div class=\"kufi\" lang=\"ar\" style=\"font-size:18px;color:#D4B06A;text-align:left\">واحر قلباه<\/div><\/div><div style=\"font:500 12px Inter;color:#BDB5A6\">Study<\/div><\/header>\n<div role=\"group\" aria-label=\"Layers\" style=\"display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap\">\n<button aria-pressed=\"true\" style=\"height:36px;padding:0 12px;border-radius:18px;border:0;background:#F2EDE3;color:#0B0A0F;font:500 12px Inter\">✓ Arabic<\/button>\n<button aria-pressed=\"true\" style=\"height:36px;padding:0 12px;border-radius:18px;border:0;background:#F2EDE3;color:#0B0A0F;font:500 12px Inter\">✓ Sound it out<\/button>\n<button aria-pressed=\"true\" style=\"height:36px;padding:0 12px;border-radius:18px;border:0;background:#F2EDE3;color:#0B0A0F;font:500 12px Inter\">✓ English<\/button>\n<button aria-pressed=\"false\" style=\"height:36px;padding:0 12px;border-radius:18px;border:1px solid #7A7380;background:none;color:#BDB5A6;font:500 12px Inter\">Meter<\/button>\n<\/div>\n<div style=\"padding:24px 24px 0;display:flex;flex-direction:column;gap:6px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.9\"><span style=\"text-decoration:underline dotted #7A7380;text-underline-offset:10px\">الخَيْلُ<\/span> <span style=\"text-decoration:underline dotted #7A7380;text-underline-offset:10px\">وَاللّيْلُ<\/span> <span style=\"text-decoration:underline dotted #7A7380;text-underline-offset:10px\">وَالبَيْداءُ<\/span> <span style=\"text-decoration:underline dotted #7A7380;text-underline-offset:10px\">تَعرِفُني<\/span><\/div>\n<div style=\"font:italic 400 14px Inter;color:#BDB5A6;text-align:right\">al-khaylu wa-l-laylu wa-l-baydāʾu taʿrifunī<\/div>\n<div class=\"en\" style=\"font-size:18px\">The horses, the night and the desert know me,<\/div>\n<\/div>\n<div style=\"margin:22px 20px 0;padding:16px;border-radius:18px;background:#17151C;display:flex;flex-direction:column;gap:8px\">\n<div class=\"lab\">New in this couplet<\/div>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end\"><span style=\"padding:6px 10px;border-radius:10px;background:#211E27;font:500 13px Inter\"><span class=\"ar\" lang=\"ar\" style=\"font-size:16px\">البَيْداء<\/span> desert<\/span><span style=\"padding:6px 10px;border-radius:10px;background:#211E27;font:500 13px Inter\"><span class=\"ar\" lang=\"ar\" style=\"font-size:16px\">القِرْطاس<\/span> paper<\/span><\/div>\n<\/div>\n<div style=\"margin-top:auto;padding:0 20px 28px;display:flex;gap:10px\"><button style=\"flex:1;height:52px;border-radius:26px;border:1px solid #7A7380;background:none;color:#F2EDE3;font:500 15px Inter\">Recite<\/button><button style=\"flex:1;height:52px;border-radius:26px;border:0;background:#D4B06A;color:#141210;font:600 15px Inter\">Next couplet<\/button><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>C · Study.<\/b> Layers on by default, a sound-it-out line, new words gathered under each couplet, recitation practice. Best learning value, but busy for fluent readers and the furthest from the original's mood.<\/figcaption>\n<\/figure>\n\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n"}, "V2Flow.dc.html": {"x": 0, "y": 1160, "w": 2952, "h": 1040, "title": "v2 · Recommended: Night Reader, full flow", "page": "v2", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>v2: Night Reader full flow<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Reem+Kufi:wght@500;700&amp;family=Jost:wght@400;500&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#D4B06A}a:hover{color:#F2D58E}\n.step{margin:0;width:360px;flex:none;display:flex;flex-direction:column;gap:16px}\n.ph{width:360px;height:780px;border-radius:44px;overflow:hidden;position:relative;box-sizing:border-box;background:#0B0A0F;border:1px solid #2A2730;display:flex;flex-direction:column;color:#F2EDE3;font-family:Inter,sa
