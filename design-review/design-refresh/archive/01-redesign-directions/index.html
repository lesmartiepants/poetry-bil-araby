<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Josefin+Sans:wght@300;400;600&family=Reem+Kufi:wght@500&display=swap">
<style>
:root{--bg:#0A0A0D;--panel:#111015;--line:#2A2722;--gold:#D4B36A;--ivory:#F2EEE6;--mute:#A8A296}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1A1A1E;color:var(--ivory);font-family:'Josefin Sans',system-ui,sans-serif}
header{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
header h1{margin:0;font:500 20px 'Cormorant Garamond',serif;white-space:nowrap}
header h1 span{font-family:'Reem Kufi',sans-serif;color:var(--gold);font-size:17px}
nav{display:flex;gap:6px;overflow-x:auto;flex:1}
nav button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:16px;height:32px;padding:0 14px;font:400 12px 'Josefin Sans';letter-spacing:.08em;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--gold);color:#17140D;border-color:var(--gold);font-weight:600}
.zoom{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--mute)}
.zoom button{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--gold);cursor:pointer;font-size:16px}
#vp{position:fixed;inset:56px 0 0 0;overflow:auto;cursor:grab}
#vp.drag{cursor:grabbing}
#world{position:relative;transform-origin:0 0}
.board{position:absolute;background:#0A0A0D;box-shadow:0 2px 14px rgba(0,0,0,.45);overflow:hidden;cursor:zoom-in}
.board iframe{border:0;width:100%;height:100%;pointer-events:none;display:block}
.blabel{position:absolute;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title1{position:absolute;font:500 44px 'Cormorant Garamond',serif;color:var(--ivory);white-space:nowrap}
.sticky{position:absolute;background:#26252B;color:#D9D4CA;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap}
#ov{position:fixed;inset:0;background:rgba(5,5,7,.92);display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#ov.on{display:flex}
#ov .t{font-size:14px;color:var(--mute);max-width:90vw;text-align:center}
#ov iframe{border:0;background:#0A0A0D;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#ov .x{position:absolute;top:14px;right:18px;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--gold);font-size:18px;cursor:pointer}
#ov .nv{position:absolute;top:50%;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--gold);font-size:20px;cursor:pointer}
</style>
</head>

<div id="vp"><div id="world"></div></div>
<div id="ov"><button class="x" id="ox">✕</button><button class="nv" id="op" style="left:18px">‹</button><button class="nv" id="on" style="right:18px">›</button><div class="t" id="ot"></div><iframe id="of"></iframe></div>

const DATA={"title": "Poetry بالعربي: 5 redesign directions", "pages": [{"id": "v1", "name": "v1 · Explorations"}, {"id": "v2", "name": "v2 · Principal redesign"}], "boards": {"Main.dc.html": {"x": 0, "y": 0, "w": 2952, "h": 1040, "title": "01 Verse · Fix it right", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>01 Verse: fix it right<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#D4B06A}a:hover{color:#E8CB8C}\n.step{margin:0;width:360px;flex:none;display:flex;flex-direction:column;gap:18px}\n.ph{width:360px;height:780px;border-radius:44px;overflow:hidden;position:relative;box-sizing:border-box;background:#0D0C10;border:1px solid #2A2730;display:flex;flex-direction:column;color:#F2EDE3;font-family:Inter,sans-serif}\n.cap{font:400 14px/1.5 Inter,sans-serif;color:#B9B2A5;margin:0}\n.cap b{color:#F2EDE3;font-weight:600}\n.ar{font-family:Amiri,serif;direction:rtl;text-align:right}\n.en{font-family:'Cormorant Garamond',serif;font-style:italic;text-align:right}\n.ib{background:none;border:0;color:#F2EDE3;width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:22px;cursor:pointer}\n.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px Inter,sans-serif;color:#9C9588;min-width:64px;min-height:48px;justify-content:center;cursor:pointer}\n.tap{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid #D4B06A;box-shadow:0 0 0 8px rgba(212,176,106,.18);pointer-events:none}\n.chip{border:1px solid #3A3640;border-radius:999px;padding:0 14px;height:36px;display:flex;align-items:center;font:500 13px Inter,sans-serif;color:#E4DED2;background:none}\n<\/style>\n<\/helmet>\n<div style=\"width:2952px;height:1040px;box-sizing:border-box;padding:64px;background:#08080A;display:flex;gap:64px;font-family:Inter,sans-serif\">\n\n<aside style=\"width:400px;flex:none;display:flex;flex-direction:column;gap:22px;color:#F2EDE3\">\n<div style=\"font:600 12px Inter;letter-spacing:.14em;color:#D4B06A\">DIRECTION 01 · THE UX FIX<\/div>\n<h1 style=\"margin:0;font:500 64px/1 'Cormorant Garamond',serif\">Verse<\/h1>\n<p style=\"margin:0;font:400 18px/1.5 Inter;color:#D9D2C5\">Keep the brand, fix the product. Same night-and-gold mood, but every control earns its place and the poem becomes the thing you touch.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px Inter;letter-spacing:.12em;color:#9C9588\">BUILT FROM<\/div><p style=\"margin:0;font:400 15px/1.5 Inter;color:#D9D2C5\">The UX critique: ten competing tap targets, actions mixed with destinations, Listen with no state, faded translations.<\/p><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px Inter;letter-spacing:.12em;color:#9C9588\">PRINCIPLES<\/div>\n<ul style=\"margin:0;padding-left:18px;font:400 15px/1.6 Inter;color:#D9D2C5\"><li>Tabs are places: Discover, Library, Saved, You.<\/li><li>One action row per poem. Play is primary.<\/li><li>Every word is tappable. Translations pass 4.5:1.<\/li><li>No floating buttons, no badges.<\/li><\/ul><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px Inter;letter-spacing:.12em;color:#9C9588\">FLOW<\/div>\n<ol style=\"margin:0;padding-left:20px;font:400 15px/1.6 Inter;color:#D9D2C5\"><li>Discover today's poem<\/li><li>Read with one action row<\/li><li>Listen as the text follows<\/li><li>Tap a word for its gloss<\/li><li>Save, then share a verse card<\/li><li>Find it again in Saved<\/li><\/ol><\/div>\n<div style=\"margin-top:auto;border-top:1px solid #2A2730;padding-top:18px;font:400 14px/1.5 Inter;color:#B9B2A5\"><b style=\"color:#F2EDE3\">Measure (hypothesis):<\/b> share of sessions that use Listen or tap a word, compared with today's Insights taps.<\/div>\n<\/aside>\n\n<div style=\"display:flex;gap:40px\">\n\n<!-- 1 Discover -->\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"display:flex;align-items:center;justify-content:space-between;padding:56px 20px 8px 24px\">\n<div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font:500 20px 'Cormorant Garamond',serif;color:#E4DED2\">poetry<\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:22px;font-weight:700;color:#D4B06A\">بالعربي<\/span><\/div>\n<button class=\"ib\" aria-label=\"Search\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"m20 20-3.5-3.5\"><\/path><\/svg><\/button>\n<\/header>\n<div style=\"padding:12px 24px 0;font:600 12px Inter;letter-spacing:.12em;color:#D4B06A\">TODAY'S POEM<\/div>\n<div style=\"margin:12px 20px 0;padding:24px 22px;border-radius:24px;background:#17151C;border:1px solid #2A2730;display:flex;flex-direction:column;gap:12px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:40px;line-height:1.3;font-weight:700;color:#F2EDE3\">واحَرَّ قَلباه<\/div>\n<div style=\"text-align:right;font:500 22px/1.2 'Cormorant Garamond',serif;color:#E4DED2\">O, the fire in my heart<\/div>\n<div style=\"text-align:right;font:500 13px Inter;color:#B9B2A5\">al-Mutanabbi · 10th century · al-Basīṭ<\/div>\n<div style=\"display:flex;gap:10px;margin-top:6px\">\n<button style=\"flex:1;height:48px;border-radius:24px;border:0;background:#D4B06A;color:#141210;font:600 15px Inter;cursor:pointer\">Read<\/button>\n<button aria-label=\"Listen\" style=\"width:48px;height:48px;border-radius:24px;border:1px solid #4A4550;background:none;color:#F2EDE3;display:flex;align-items:center;justify-content:center;cursor:pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M7 5v14l12-7z\"><\/path><\/svg><\/button>\n<\/div>\n<\/div>\n<div style=\"padding:24px 24px 10px;font:600 12px Inter;letter-spacing:.12em;color:#9C9588\">BY MOOD<\/div>\n<div style=\"display:flex;gap:8px;padding:0 20px;flex-wrap:wrap\"><button class=\"chip\">Longing<\/button><button class=\"chip\">Pride<\/button><button class=\"chip\">Exile<\/button><button class=\"chip\">Love<\/button><\/div>\n<div style=\"padding:22px 24px 10px;font:600 12px Inter;letter-spacing:.12em;color:#9C9588\">CONTINUE<\/div>\n<div style=\"margin:0 20px;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:#17151C\">\n<div style=\"width:4px;align-self:stretch;border-radius:2px;background:#2A2730;position:relative\"><div style=\"position:absolute;left:0;right:0;bottom:0;height:60%;background:#D4B06A;border-radius:2px\"><\/div><\/div>\n<div style=\"flex:1\"><div class=\"ar\" lang=\"ar\" style=\"font-size:20px\">قِفا نَبْكِ<\/div><div style=\"text-align:right;font:400 12px Inter;color:#B9B2A5\">Imruʾ al-Qays · 60% read<\/div><\/div>\n<\/div>\n<nav style=\"margin-top:auto;display:flex;justify-content:space-around;padding:8px 8px 26px;border-top:1px solid #221F27;background:#0D0C10\">\n<button class=\"tab\" style=\"color:#D4B06A\" aria-current=\"page\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"m15.5 8.5-2 5-5 2 2-5z\"><\/path><\/svg>Discover<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M5 4v16M10 4v16M15 4l4 16\"><\/path><\/svg>Library<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg>Saved<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\/circle><path d=\"M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6\"><\/path><\/svg>You<\/button>\n<\/nav>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:90px;top:330px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>1 · Discover.<\/b> One hero poem, mood chips, Continue. Four tabs, all destinations. Gold marks the active tab only. Tap Read.<\/figcaption>\n<\/figure>\n\n<!-- 2 Reader -->\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"display:flex;align-items:center;gap:8px;padding:52px 12px 8px\">\n<button class=\"ib\" aria-label=\"Back\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button>\n<div style=\"flex:1;text-align:center\"><div class=\"ar\" lang=\"ar\" style=\"text-align:center;font-size:18px;font-weight:700\">واحَرَّ قَلباه<\/div><div style=\"font:500 12px Inter;color:#B9B2A5\">al-Mutanabbi<\/div><\/div>\n<button class=\"ib\" aria-label=\"Text size\"><span style=\"font:600 15px Inter\">Aa<\/span><\/button>\n<\/header>\n<div style=\"margin:6px 24px 0;height:3px;border-radius:2px;background:#26232C\"><div style=\"width:22%;height:3px;border-radius:2px;background:#D4B06A\"><\/div><\/div>\n<div style=\"padding:34px 28px 0;display:flex;flex-direction:column;gap:10px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7\">أنَا الذي نَظَرَ الأعْمَى إلى أدَبي<\/div>\n<div class=\"en\" style=\"font-size:19px;line-height:1.35;color:#CFC8BA\">I am the one whose craft the blind have seen,<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7;margin-top:10px\">وَأسْمَعَتْ كَلِماتي مَنْ بهِ صَمَمُ<\/div>\n<div class=\"en\" style=\"font-size:19px;line-height:1.35;color:#CFC8BA\">whose words have reached even the deaf.<\/div>\n<div style=\"height:1px;background:#221F27;margin:18px 0 8px\"><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div class=\"en\" style=\"font-size:19px;line-height:1.35;color:#CFC8BA\">The horses, the night and the desert know me,<\/div>\n<\/div>\n<div style=\"margin-top:auto;padding:14px 20px 30px;display:flex;align-items:center;gap:6px;background:linear-gradient(transparent,#0D0C10 30%)\">\n<button aria-label=\"Play recitation\" style=\"width:60px;height:60px;border-radius:30px;border:0;background:#D4B06A;color:#141210;display:flex;align-items:center;justify-content:center;cursor:pointer\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M7 5v14l12-7z\"><\/path><\/svg><\/button>\n<div style=\"flex:1\"><\/div>\n<button class=\"ib\" aria-label=\"Save poem\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg><\/button>\n<button class=\"ib\" aria-label=\"Share\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 15V4M8 8l4-4 4 4M5 13v6h14v-6\"><\/path><\/svg><\/button>\n<button class=\"ib\" aria-label=\"More: insights, translation, meter\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"12\" r=\"1.8\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"1.8\"><\/circle><circle cx=\"19\" cy=\"12\" r=\"1.8\"><\/circle><\/svg><\/button>\n<\/div>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:28px;top:698px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>2 · Reader.<\/b> Progress bar, full-contrast translation, couplet rules. A single action row: Play primary, then Save, Share, More (Insights lives there). Tap Play.<\/figcaption>\n<\/figure>\n\n<!-- 3 Listening -->\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"display:flex;align-items:center;gap:8px;padding:52px 12px 8px\">\n<button class=\"ib\" aria-label=\"Back\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button>\n<div style=\"flex:1;text-align:center\"><div class=\"ar\" lang=\"ar\" style=\"text-align:center;font-size:18px;font-weight:700\">واحَرَّ قَلباه<\/div><div style=\"font:500 12px Inter;color:#B9B2A5\">Following the voice<\/div><\/div>\n<button class=\"ib\" aria-label=\"Text size\"><span style=\"font:600 15px Inter\">Aa<\/span><\/button>\n<\/header>\n<div style=\"margin:6px 24px 0;height:3px;border-radius:2px;background:#26232C\"><div style=\"width:30%;height:3px;border-radius:2px;background:#D4B06A\"><\/div><\/div>\n<div style=\"padding:34px 28px 0;display:flex;flex-direction:column;gap:10px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7;color:#8F887C\">أنَا الذي نَظَرَ الأعْمَى إلى أدَبي<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7;color:#8F887C\">وَأسْمَعَتْ كَلِماتي مَنْ بهِ صَمَمُ<\/div>\n<div style=\"margin:14px -14px 0;padding:14px;border-radius:18px;background:#17151C;border:1px solid #3A3328\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:31px;line-height:1.7\"><span style=\"color:#F2EDE3\">الخَيْلُ وَاللّيْلُ <\/span><span style=\"color:#E2BE76;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:10px\">وَالبَيْداءُ<\/span><span style=\"color:#8F887C\"> تَعرِفُني<\/span><\/div>\n<div class=\"en\" style=\"font-size:19px;line-height:1.35;color:#CFC8BA\">The horses, the night and the desert know me,<\/div>\n<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7;color:#8F887C;margin-top:10px\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<\/div>\n<div style=\"margin:auto 14px 26px;padding:14px 16px;border-radius:22px;background:#1C1A21;border:1px solid #2F2B35;display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<button aria-label=\"Pause\" style=\"width:44px;height:44px;border-radius:22px;border:0;background:#D4B06A;color:#141210;display:flex;align-items:center;justify-content:center;cursor:pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><\/svg><\/button>\n<div style=\"flex:1\"><div style=\"font:600 13px Inter\">Recitation<\/div><div style=\"font:400 12px Inter;color:#B9B2A5\">0:42 / [LENGTH]<\/div><\/div>\n<button style=\"height:44px;min-width:48px;border-radius:22px;border:1px solid #3A3640;background:none;color:#F2EDE3;font:600 13px Inter;cursor:pointer\">1×<\/button>\n<button class=\"ib\" aria-label=\"Repeat this line\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5\"><\/path><\/svg><\/button>\n<\/div>\n<div style=\"height:4px;border-radius:2px;background:#2F2B35\"><div style=\"width:30%;height:4px;border-radius:2px;background:#D4B06A\"><\/div><\/div>\n<\/div>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:150px;top:286px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>3 · Listening.<\/b> The line being recited lifts into a card; the current word is gold and underlined (not color alone). The mini-player stays with you across screens. Tap a word.<\/figcaption>\n<\/figure>\n\n<!-- 4 Word gloss -->\n<figure class=\"step\">\n<div class=\"ph\">\n<div style=\"padding:110px 28px 0;display:flex;flex-direction:column;gap:10px;opacity:.35\" aria-hidden=\"true\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<\/div>\n<section aria-label=\"Word detail\" style=\"position:absolute;left:0;right:0;bottom:0;padding:12px 24px 30px;border-radius:28px 28px 0 0;background:#1A181F;border-top:1px solid #34303A;display:flex;flex-direction:column;gap:14px\">\n<div style=\"width:40px;height:4px;border-radius:2px;background:#4A4550;align-self:center\"><\/div>\n<div style=\"display:flex;align-items:center;justify-content:space-between\">\n<button aria-label=\"Hear the word\" style=\"width:48px;height:48px;border-radius:24px;border:1px solid #4A4550;background:none;color:#F2EDE3;display:flex;align-items:center;justify-content:center;cursor:pointer\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11\"><\/path><\/svg><\/button>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:44px;font-weight:700;color:#E2BE76\">القِرْطاسُ<\/div>\n<\/div>\n<div style=\"text-align:right;font:500 15px Inter;color:#B9B2A5\">al-qirṭās · noun<\/div>\n<div style=\"text-align:right;font:500 24px 'Cormorant Garamond',serif\">paper, parchment<\/div>\n<div style=\"display:flex;gap:10px;justify-content:flex-end\">\n<div style=\"padding:8px 14px;border-radius:12px;background:#24212A;font:500 13px Inter;color:#E4DED2\">Root <span class=\"ar\" lang=\"ar\" style=\"font-size:17px;margin-left:6px\">ق ر ط س<\/span><\/div>\n<\/div>\n<p style=\"margin:0;text-align:right;font:400 14px/1.55 Inter;color:#CFC8BA\">Borrowed through Greek chártēs, the same ancestor as the English word chart. The poet lists it beside the sword: the pen as a weapon.<\/p>\n<div style=\"display:flex;gap:10px;margin-top:4px\">\n<button style=\"flex:1;height:48px;border-radius:24px;border:1px solid #4A4550;background:none;color:#F2EDE3;font:600 14px Inter;cursor:pointer\">Add to review<\/button>\n<button style=\"flex:1;height:48px;border-radius:24px;border:0;background:#D4B06A;color:#141210;font:600 14px Inter;cursor:pointer\">Save word<\/button>\n<\/div>\n<\/section>\n<\/div>\n<figcaption class=\"cap\"><b>4 · Word gloss.<\/b> Any word opens a half sheet: pronunciation, meaning, root, one line of context. The verse stays visible above, and audio keeps playing.<\/figcaption>\n<\/figure>\n\n<!-- 5 Share -->\n<figure class=\"step\">\n<div class=\"ph\">\n<div role=\"status\" style=\"margin:56px 20px 0;padding:12px 16px;border-radius:16px;background:#24212A;display:flex;align-items:center;gap:10px;font:500 14px Inter\">\n<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E2BE76\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4 10-10\"><\/path><\/svg>Saved to your collection<a href=\"#\" style=\"margin-left:auto;font-weight:600\">Undo<\/a><\/div>\n<section aria-label=\"Share\" style=\"position:absolute;left:0;right:0;bottom:0;padding:12px 24px 30px;border-radius:28px 28px 0 0;background:#1A181F;border-top:1px solid #34303A;display:flex;flex-direction:column;gap:16px\">\n<div style=\"width:40px;height:4px;border-radius:2px;background:#4A4550;align-self:center\"><\/div>\n<div style=\"font:600 16px Inter\">Share a verse<\/div>\n<div style=\"border-radius:22px;padding:30px 24px;background:#0D0C10;border:1px solid #3A3328;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center\">\n<div class=\"ar\" lang=\"ar\" style=\"text-align:center;font-size:24px;line-height:1.7;color:#F2EDE3\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<br>وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div style=\"width:32px;height:1px;background:#D4B06A\"><\/div>\n<div style=\"font:italic 400 16px/1.4 'Cormorant Garamond',serif;color:#CFC8BA\">The horses, the night and the desert know me, and the sword, the spear, the paper and the pen.<\/div>\n<div style=\"font:600 11px Inter;letter-spacing:.14em;color:#D4B06A\">AL-MUTANABBI · POETRY بالعربي<\/div>\n<\/div>\n<div style=\"display:flex;gap:8px\">\n<button class=\"chip\" style=\"flex:1;justify-content:center;height:44px;border-color:#D4B06A;color:#E2BE76\">Image<\/button>\n<button class=\"chip\" style=\"flex:1;justify-content:center;height:44px\">Link<\/button>\n<button class=\"chip\" style=\"flex:1;justify-content:center;height:44px\">Text<\/button>\n<\/div>\n<button style=\"height:52px;border-radius:26px;border:0;background:#D4B06A;color:#141210;font:600 15px Inter;cursor:pointer\">Share<\/button>\n<\/section>\n<\/div>\n<figcaption class=\"cap\"><b>5 · Save, then share.<\/b> Save confirms with an undoable toast. Share is an action on this poem: it renders the selected couplet as a card, as an image, link or text.<\/figcaption>\n<\/figure>\n\n<!-- 6 Saved -->\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"padding:60px 24px 12px\"><h2 style=\"margin:0;font:500 34px 'Cormorant Garamond',serif\">Saved<\/h2><\/header>\n<div role=\"tablist\" style=\"margin:0 20px;display:flex;padding:4px;border-radius:14px;background:#17151C\">\n<button role=\"tab\" aria-selected=\"false\" style=\"flex:1;height:40px;border:0;border-radius:10px;background:none;color:#B9B2A5;font:500 14px Inter\">Poems<\/button>\n<button role=\"tab\" aria-selected=\"true\" style=\"flex:1;height:40px;border:0;border-radius:10px;background:#2A2730;color:#F2EDE3;font:600 14px Inter\">Lines<\/button>\n<button role=\"tab\" aria-selected=\"false\" style=\"flex:1;height:40px;border:0;border-radius:10px;background:none;color:#B9B2A5;font:500 14px Inter\">Words<\/button>\n<\/div>\n<div style=\"padding:18px 20px 0;display:flex;flex-direction:column;gap:12px\">\n<div style=\"padding:16px;border-radius:18px;background:#17151C;border:1px solid #3A3328\"><div class=\"ar\" lang=\"ar\" style=\"font-size:21px;line-height:1.7\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div><div style=\"text-align:right;font:500 12px Inter;color:#B9B2A5;margin-top:4px\">al-Mutanabbi · saved just now<\/div><\/div>\n<div style=\"padding:16px;border-radius:18px;background:#17151C\"><div class=\"ar\" lang=\"ar\" style=\"font-size:21px;line-height:1.7\">قِفا نَبْكِ مِنْ ذِكْرى حَبيبٍ ومَنْزِلِ<\/div><div style=\"text-align:right;font:500 12px Inter;color:#B9B2A5;margin-top:4px\">Imruʾ al-Qays · 2 days ago<\/div><\/div>\n<div style=\"padding:16px;border-radius:18px;background:#17151C\"><div class=\"ar\" lang=\"ar\" style=\"font-size:21px;line-height:1.7\">أنَا الذي نَظَرَ الأعْمَى إلى أدَبي<\/div><div style=\"text-align:right;font:500 12px Inter;color:#B9B2A5;margin-top:4px\">al-Mutanabbi · last week<\/div><\/div>\n<\/div>\n<nav style=\"margin-top:auto;display:flex;justify-content:space-around;padding:8px 8px 26px;border-top:1px solid #221F27;background:#0D0C10\">\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"m15.5 8.5-2 5-5 2 2-5z\"><\/path><\/svg>Discover<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M5 4v16M10 4v16M15 4l4 16\"><\/path><\/svg>Library<\/button>\n<button class=\"tab\" style=\"color:#D4B06A\" aria-current=\"page\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg>Saved<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\/circle><path d=\"M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6\"><\/path><\/svg>You<\/button>\n<\/nav>\n<\/div>\n<figcaption class=\"cap\"><b>6 · Saved.<\/b> Poems, single lines and words in one place, so a learner builds a personal anthology. Gold is reserved for the active tab, not for a heart.<\/figcaption>\n<\/figure>\n\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "v1"}, "Ink.dc.html": {"x": 0, "y": 1160, "w": 2952, "h": 1040, "title": "02 Ink · One verse, one breath", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>02 Ink: one verse, one breath<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400&amp;family=Inter:wght@400;500;600&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#E0B860}a:hover{color:#F0CF85}\n.step{margin:0;width:360px;flex:none;display:flex;flex-direction:column;gap:18px}\n.ph{width:360px;height:780px;border-radius:44px;overflow:hidden;position:relative;box-sizing:border-box;background:#000;border:1px solid #222;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F5F1E8;font-family:Inter,sans-serif}\n.cap{font:400 14px/1.5 Inter,sans-serif;color:#ADA698;margin:0}\n.cap b{color:#F5F1E8;font-weight:600}\n.ar{font-family:Amiri,serif;direction:rtl;text-align:center}\n.thread{position:absolute;right:10px;top:60px;bottom:60px;width:2px;background:#1E1D1B;border-radius:1px}\n.fill{position:absolute;left:0;right:0;top:0;background:#E0B860;border-radius:1px;box-shadow:0 0 8px rgba(224,184,96,.6)}\n.dim{color:#8A847A}\n.tap{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid #E0B860;box-shadow:0 0 0 10px rgba(224,184,96,.15);pointer-events:none}\n.hint{position:absolute;bottom:40px;left:0;right:0;text-align:center;font:500 12px Inter;letter-spacing:.14em;color:#8A847A}\n<\/style>\n<\/helmet>\n<div style=\"width:2952px;height:1040px;box-sizing:border-box;padding:64px;background:#050505;display:flex;gap:64px;font-family:Inter,sans-serif\">\n\n<aside style=\"width:400px;flex:none;display:flex;flex-direction:column;gap:22px;color:#F5F1E8\">\n<div style=\"font:600 12px Inter;letter-spacing:.14em;color:#E0B860\">DIRECTION 02 · THE MOTION OBSESSIVE<\/div>\n<h1 style=\"margin:0;font:500 64px/1 'Cormorant Garamond',serif\">Ink<\/h1>\n<p style=\"margin:0;font:400 18px/1.5 Inter;color:#D6D0C4\">Zero chrome. One couplet fills the screen, the voice leads, and the words warm from grey to gold as they are spoken. The poem is the interface.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px Inter;letter-spacing:.12em;color:#8A847A\">BUILT FROM<\/div><p style=\"margin:0;font:400 15px/1.5 Inter;color:#D6D0C4\">The first designer's one-breath vision, plus the motion obsessive: \"a poem about a rose, and nothing moves?\"<\/p><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px Inter;letter-spacing:.12em;color:#8A847A\">PRINCIPLES<\/div>\n<ul style=\"margin:0;padding-left:18px;font:400 15px/1.6 Inter;color:#D6D0C4\"><li>No buttons until the poem ends.<\/li><li>Gestures only: hold, tap, swipe up.<\/li><li>A gold thread on the edge is the progress bar.<\/li><li>Motion follows the recitation, never decoration.<\/li><\/ul><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px Inter;letter-spacing:.12em;color:#8A847A\">FLOW<\/div>\n<ol style=\"margin:0;padding-left:20px;font:400 15px/1.6 Inter;color:#D6D0C4\"><li>Ink drop opens the poem<\/li><li>Voice lights each word<\/li><li>Hold to reveal the English<\/li><li>Tap a word: its root blooms<\/li><li>Swipe up to the next couplet<\/li><li>The poem gathers into one card<\/li><\/ol><\/div>\n<div style=\"margin-top:auto;border-top:1px solid #222;padding-top:18px;font:400 14px/1.5 Inter;color:#ADA698\"><b style=\"color:#F5F1E8\">Risk:<\/b> hidden gestures. A one-time coach mark on first launch, and Reduce Motion swaps animation for a static highlight.<\/div>\n<\/aside>\n\n<div style=\"display:flex;gap:40px\">\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div aria-hidden=\"true\" style=\"width:22px;height:22px;border-radius:50%;background:#E0B860;box-shadow:0 0 40px 10px rgba(224,184,96,.35)\"><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"margin-top:44px;font-size:30px;font-weight:700\">واحَرَّ قَلباه<\/div>\n<div style=\"margin-top:8px;font:italic 400 18px 'Cormorant Garamond',serif;color:#ADA698\">al-Mutanabbi<\/div>\n<button style=\"position:absolute;bottom:56px;left:50%;transform:translateX(-50%);height:48px;padding:0 24px;border-radius:24px;border:1px solid #333;background:none;color:#D6D0C4;font:500 13px Inter;letter-spacing:.08em;cursor:pointer\">TAP TO BEGIN · SOUND ON<\/button>\n<\/div>\n<figcaption class=\"cap\"><b>1 · Ink drop.<\/b> A single drop of gold, the title, the poet. Tap anywhere and the drop spreads into the first verse as the recitation starts.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div class=\"thread\" aria-hidden=\"true\"><div class=\"fill\" style=\"height:8%\"><\/div><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:40px;line-height:1.8;padding:0 30px\"><span>الخَيْلُ وَاللّيْلُ <\/span><span style=\"color:#E0B860;text-shadow:0 0 18px rgba(224,184,96,.45);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:14px\">وَالبَيْداءُ<\/span><span class=\"dim\"> تَعرِفُني<\/span><\/div>\n<div aria-hidden=\"true\" style=\"width:28px;height:1px;background:#333;margin:22px 0\"><\/div>\n<div class=\"ar dim\" lang=\"ar\" style=\"font-size:40px;line-height:1.8;padding:0 30px\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>2 · The voice leads.<\/b> One couplet per screen. Spoken words turn ivory, the current word glows gold, the rest wait in grey (still 5:1 on black). The thread on the right edge fills as the poem goes on.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div class=\"thread\" aria-hidden=\"true\"><div class=\"fill\" style=\"height:12%\"><\/div><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:36px;line-height:1.8;padding:0 30px;color:#C9C3B6\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div style=\"font:italic 400 21px/1.4 'Cormorant Garamond',serif;color:#F5F1E8;text-align:center;padding:4px 40px 0\">The horses, the night and the desert know me,<\/div>\n<div aria-hidden=\"true\" style=\"width:28px;height:1px;background:#333;margin:22px 0\"><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:36px;line-height:1.8;padding:0 30px;color:#C9C3B6\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div style=\"font:italic 400 21px/1.4 'Cormorant Garamond',serif;color:#F5F1E8;text-align:center;padding:4px 40px 0\">and the sword, the spear, the paper and the pen.<\/div>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:152px;top:630px\"><\/div>\n<div class=\"hint\" style=\"bottom:28px\">HOLDING<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>3 · Press and hold.<\/b> The English rises under each line like breath on glass, and fades when you let go. The Arabic stays the main text.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div class=\"thread\" aria-hidden=\"true\"><div class=\"fill\" style=\"height:14%\"><\/div><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:40px;line-height:1.8;padding:0 30px\"><span class=\"dim\">الخَيْلُ وَاللّيْلُ <\/span><span style=\"color:#E0B860\">وَالبَيْداءُ<\/span><span class=\"dim\"> تَعرِفُني<\/span><\/div>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px\">\n<div aria-hidden=\"true\" style=\"display:flex;gap:6px\"><span style=\"width:4px;height:4px;border-radius:2px;background:#E0B860\"><\/span><span style=\"width:4px;height:4px;border-radius:2px;background:#E0B860;opacity:.6\"><\/span><span style=\"width:4px;height:4px;border-radius:2px;background:#E0B860;opacity:.3\"><\/span><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:30px;letter-spacing:.3em;color:#F5F1E8\">ب ي د<\/div>\n<div style=\"font:500 13px Inter;letter-spacing:.14em;color:#ADA698\">ROOT · TO VANISH, TO PERISH<\/div>\n<div style=\"font:italic 400 20px/1.4 'Cormorant Garamond',serif;color:#F5F1E8;text-align:center;padding:0 44px\">al-baydāʾ: the desert, the place where things disappear<\/div>\n<\/div>\n<div aria-hidden=\"true\" style=\"width:28px;height:1px;background:#333;margin:22px 0\"><\/div>\n<div class=\"ar dim\" lang=\"ar\" style=\"font-size:40px;line-height:1.8;padding:0 30px;opacity:.6\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:150px;top:252px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>4 · Tap a word.<\/b> Its root blooms underneath it, in place. No sheet, no modal, nothing covers the verse. Tap again to fold it away.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"justify-content:flex-start\">\n<div class=\"thread\" aria-hidden=\"true\"><div class=\"fill\" style=\"height:40%\"><\/div><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"margin-top:60px;font-size:30px;line-height:1.8;padding:0 30px;color:#5E5A53;opacity:.6\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div style=\"flex:1\"><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:40px;line-height:1.8;padding:0 30px;color:#C9C3B6\">أنَا الذي نَظَرَ الأعْمَى إلى أدَبي<\/div>\n<div aria-hidden=\"true\" style=\"width:28px;height:1px;background:#333;margin:22px 0\"><\/div>\n<div class=\"ar dim\" lang=\"ar\" style=\"font-size:40px;line-height:1.8;padding:0 30px\">وَأسْمَعَتْ كَلِماتي مَنْ بهِ صَمَمُ<\/div>\n<div style=\"flex:1\"><\/div>\n<div class=\"hint\" style=\"position:static;padding-bottom:34px;display:flex;flex-direction:column;align-items:center;gap:6px\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8A847A\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m6 15 6-6 6 6\"><\/path><\/svg>SWIPE UP<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>5 · Swipe up.<\/b> The last couplet drifts off the top as the next one rises. The voice carries on through the change, and the thread keeps filling.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"padding:0 24px\">\n<div style=\"width:100%;box-sizing:border-box;border-radius:28px;padding:40px 26px;border:1px solid #3A3226;background:#0A0907;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center\">\n<div aria-hidden=\"true\" style=\"width:10px;height:10px;border-radius:50%;background:#E0B860;box-shadow:0 0 20px 4px rgba(224,184,96,.4)\"><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:25px;line-height:1.8\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<br>وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div style=\"font:italic 400 17px/1.4 'Cormorant Garamond',serif;color:#C9C3B6\">The horses, the night and the desert know me, and the sword, the spear, the paper and the pen.<\/div>\n<div style=\"font:600 11px Inter;letter-spacing:.16em;color:#E0B860\">AL-MUTANABBI<\/div>\n<\/div>\n<div style=\"width:100%;display:flex;flex-direction:column;gap:10px;margin-top:28px\">\n<button style=\"height:52px;border-radius:26px;border:0;background:#E0B860;color:#0A0907;font:600 15px Inter;cursor:pointer\">Share this card<\/button>\n<div style=\"display:flex;gap:10px\"><button style=\"flex:1;height:48px;border-radius:24px;border:1px solid #333;background:none;color:#F5F1E8;font:500 14px Inter;cursor:pointer\">Read again<\/button><button style=\"flex:1;height:48px;border-radius:24px;border:1px solid #333;background:none;color:#F5F1E8;font:500 14px Inter;cursor:pointer\">Next poem<\/button><\/div>\n<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>6 · The poem gathers.<\/b> At the last word every couplet folds into one card holding the couplet you lingered on longest. The first buttons in the whole flow appear here.<\/figcaption>\n<\/figure>\n\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "v1"}, "Folio.dc.html": {"x": 0, "y": 2320, "w": 2952, "h": 1040, "title": "03 Folio · Typography is the interface", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>03 Folio: typography is the interface<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#8A2B1F}a:hover{color:#5E1B12}\n.step{margin:0;width:360px;flex:none;display:flex;flex-direction:column;gap:18px}\n.ph{width:360px;height:780px;border-radius:44px;overflow:hidden;position:relative;box-sizing:border-box;background:#F3EFE6;border:1px solid #D8D0C0;display:flex;flex-direction:column;color:#1C1A16;font-family:'Markazi Text',serif}\n.cap{font:400 17px/1.4 'Markazi Text',serif;color:#4E483E;margin:0}\n.cap b{color:#1C1A16;font-weight:600}\n.ar{direction:rtl}\n.sc{font:500 13px 'Markazi Text',serif;letter-spacing:.18em;text-transform:uppercase;color:#5E574C}\n.rule{height:1px;background:#CFC6B6}\n.lnk{background:none;border:0;font:500 17px 'Markazi Text',serif;color:#1C1A16;min-height:44px;padding:0 6px;cursor:pointer}\n.tap{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid #8A2B1F;box-shadow:0 0 0 8px rgba(138,43,31,.12);pointer-events:none}\n.row{display:flex;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid #DDD5C6;background:none;border-top:0;border-left:0;border-right:0;width:100%;text-align:left;cursor:pointer;color:#1C1A16;font-family:'Markazi Text',serif}\n<\/style>\n<\/helmet>\n<div style=\"width:2952px;height:1040px;box-sizing:border-box;padding:64px;background:#E9E4D9;display:flex;gap:64px;font-family:'Markazi Text',serif\">\n\n<aside style=\"width:400px;flex:none;display:flex;flex-direction:column;gap:20px;color:#1C1A16\">\n<div class=\"sc\" style=\"color:#8A2B1F\">Direction 03 · The type purist<\/div>\n<h1 style=\"margin:0;font:500 72px/1 'Markazi Text',serif\">Folio<\/h1>\n<p style=\"margin:0;font:400 22px/1.4 'Markazi Text',serif;color:#3A352D\">One type family with true Arabic and Latin, set like a finely printed book. Spacing does the emotional work. Everything else is apology.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div class=\"sc\">Built from<\/div><p style=\"margin:0;font:400 19px/1.4 'Markazi Text',serif;color:#3A352D\">The type purist: four typographic voices in four lines. Plus the missing learner feature: meter.<\/p><\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div class=\"sc\">Principles<\/div>\n<ul style=\"margin:0;padding-left:18px;font:400 19px/1.45 'Markazi Text',serif;color:#3A352D\"><li>Markazi Text for everything, three sizes.<\/li><li>Hemistichs set as the classical stagger.<\/li><li>English as marginalia, never a peer.<\/li><li>Words, not icons, for navigation.<\/li><\/ul><\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><div class=\"sc\">Flow<\/div>\n<ol style=\"margin:0;padding-left:20px;font:400 19px/1.45 'Markazi Text',serif;color:#3A352D\"><li>Choose from the contents<\/li><li>Read the poem as a page<\/li><li>Reveal the meter<\/li><li>Write in the margin<\/li><li>Revisit your margins<\/li><li>Search by root or meter<\/li><\/ol><\/div>\n<div style=\"margin-top:auto;border-top:1px solid #CFC6B6;padding-top:16px;font:400 18px/1.4 'Markazi Text',serif;color:#4E483E\"><b style=\"color:#1C1A16\">Audience:<\/b> readers who already love the form. Trades discoverability for calm.<\/div>\n<\/aside>\n\n<div style=\"display:flex;gap:40px\">\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"padding:64px 28px 0\">\n<div class=\"sc\" style=\"text-align:center\">Poetry بالعربي<\/div>\n<h2 style=\"margin:22px 0 4px;font:500 44px/1 'Markazi Text',serif;text-align:center\">Contents<\/h2>\n<div class=\"rule\" style=\"width:40px;margin:14px auto 10px;background:#8A2B1F\"><\/div>\n<button class=\"row\"><span style=\"font:500 15px 'Markazi Text';color:#8A2B1F;width:18px\">i<\/span><span style=\"flex:1\"><span style=\"display:block;font-size:15px;color:#5E574C\">Imruʾ al-Qays · 6th c.<\/span><\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:26px;font-weight:600\">قِفا نَبْكِ<\/span><\/button>\n<button class=\"row\"><span style=\"font:500 15px 'Markazi Text';color:#8A2B1F;width:18px\">ii<\/span><span style=\"flex:1\"><span style=\"display:block;font-size:15px;color:#5E574C\">ʿAntara · 6th c.<\/span><\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:26px;font-weight:600\">هَلْ غادَرَ الشُّعَراءُ<\/span><\/button>\n<button class=\"row\" style=\"background:#EAE4D7\"><span style=\"font:500 15px 'Markazi Text';color:#8A2B1F;width:18px\">iii<\/span><span style=\"flex:1\"><span style=\"display:block;font-size:15px;color:#5E574C\">al-Mutanabbi · 10th c.<\/span><\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:26px;font-weight:600\">واحَرَّ قَلباه<\/span><\/button>\n<button class=\"row\"><span style=\"font:500 15px 'Markazi Text';color:#8A2B1F;width:18px\">iv<\/span><span style=\"flex:1\"><span style=\"display:block;font-size:15px;color:#5E574C\">Ibn Zaydūn · 11th c.<\/span><\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:26px;font-weight:600\">أَضْحى التَّنائي<\/span><\/button>\n<button class=\"row\"><span style=\"font:500 15px 'Markazi Text';color:#8A2B1F;width:18px\">v<\/span><span style=\"flex:1\"><span style=\"display:block;font-size:15px;color:#5E574C\">al-Maʿarrī · 11th c.<\/span><\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:26px;font-weight:600\">غَيْرُ مُجْدٍ<\/span><\/button>\n<nav style=\"margin-top:auto;display:flex;justify-content:center;gap:18px;padding-bottom:26px\"><button class=\"lnk\" style=\"text-decoration:underline;text-underline-offset:5px\">Contents<\/button><button class=\"lnk\">Margins<\/button><button class=\"lnk\">Search<\/button><\/nav>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:250px;top:332px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>1 · Contents.<\/b> A table of contents, not a feed. Roman numerals, poet and century, the title in Arabic. Navigation is three words at the foot of the page.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"padding:58px 26px 0\">\n<div style=\"display:flex;justify-content:space-between;align-items:center\"><button class=\"lnk\" style=\"font-size:16px;padding-left:0\">← Contents<\/button><span class=\"sc\" style=\"font-size:12px\">iii<\/span><\/div>\n<h2 class=\"ar\" lang=\"ar\" style=\"margin:18px 0 0;font:600 40px/1.2 'Markazi Text',serif;text-align:center\">واحَرَّ قَلباه<\/h2>\n<div style=\"text-align:center;font:italic 400 17px 'Markazi Text';color:#5E574C;margin-top:4px\">al-Mutanabbi<\/div>\n<div class=\"rule\" style=\"width:40px;margin:18px auto;background:#8A2B1F\"><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.55;text-align:right\">أنَا الذي نَظَرَ الأعْمَى إلى أدَبي<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.55;text-align:left\">وَأسْمَعَتْ كَلِماتي مَنْ بهِ صَمَمُ<\/div>\n<div style=\"font:italic 400 15px/1.35 'Markazi Text';color:#5E574C;margin:6px 0 0 40px\">I am the one whose craft the blind have seen, whose words have reached even the deaf.<\/div>\n<div style=\"text-align:center;color:#8A2B1F;margin:16px 0;font-size:14px\" aria-hidden=\"true\">◆<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.55;text-align:right\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.55;text-align:left\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div style=\"font:italic 400 15px/1.35 'Markazi Text';color:#5E574C;margin:6px 0 0 40px\">The horses, the night and the desert know me, and the sword, the spear, the paper and the pen.<\/div>\n<nav style=\"margin-top:auto;display:flex;justify-content:center;gap:18px;padding-bottom:26px\"><button class=\"lnk\">Listen<\/button><button class=\"lnk\" style=\"text-decoration:underline;text-underline-offset:5px;color:#8A2B1F\">Meter<\/button><button class=\"lnk\">English off<\/button><\/nav>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:159px;top:712px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>2 · The page.<\/b> Each couplet is set in the classical stagger: first half to the right, second half to the left. The English sits in the margin, in italic. Three word-buttons at the foot.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"padding:58px 26px 0\">\n<div style=\"display:flex;justify-content:space-between;align-items:center\"><button class=\"lnk\" style=\"font-size:16px;padding-left:0\">← Contents<\/button><span class=\"sc\" style=\"font-size:12px\">Meter shown<\/span><\/div>\n<div style=\"margin-top:26px;text-align:center\"><div class=\"ar\" lang=\"ar\" style=\"font:600 30px 'Markazi Text'\">البَسيط<\/div><div class=\"sc\" style=\"margin-top:2px;color:#8A2B1F\">al-Basīṭ · the outspread<\/div><\/div>\n<div class=\"rule\" style=\"margin:22px 0 18px\"><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.5;text-align:right\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div style=\"display:flex;direction:rtl;justify-content:space-between;font:500 18px 'Markazi Text';color:#8A2B1F;letter-spacing:.06em;margin-top:2px\" aria-label=\"Scansion: long long short long, long short long, long long short long, short short long\"><span>− − ◡ −<\/span><span>− ◡ −<\/span><span>− − ◡ −<\/span><span>◡ ◡ −<\/span><\/div>\n<div class=\"ar\" lang=\"ar\" style=\"display:flex;justify-content:space-between;font:400 16px 'Markazi Text';color:#5E574C;margin-top:4px\"><span>مُسْتَفْعِلُنْ<\/span><span>فاعِلُنْ<\/span><span>مُسْتَفْعِلُنْ<\/span><span>فَعِلُنْ<\/span><\/div>\n<div class=\"rule\" style=\"margin:20px 0\"><\/div>\n<p style=\"margin:0;font:400 18px/1.45 'Markazi Text';color:#3A352D\">Two long beats open each foot, then the line tightens at the end. Read aloud, the second half answers the first.<\/p>\n<p style=\"margin:14px 0 0;font:italic 400 16px/1.4 'Markazi Text';color:#5E574C\">Tap any foot to hear it tapped out alone.<\/p>\n<nav style=\"margin-top:auto;display:flex;justify-content:center;gap:18px;padding-bottom:26px\"><button class=\"lnk\">Listen<\/button><button class=\"lnk\" style=\"text-decoration:underline;text-underline-offset:5px;color:#8A2B1F\">Meter<\/button><button class=\"lnk\">English off<\/button><\/nav>\n<\/div>\n<figcaption class=\"cap\"><b>3 · Meter.<\/b> Scansion marks set under the line, with the foot names in Arabic beneath. The purist's luxury, and the feature learners cannot find anywhere else.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"padding:58px 26px 0\">\n<div style=\"display:flex;justify-content:space-between;align-items:center\"><button class=\"lnk\" style=\"font-size:16px;padding-left:0\">← Contents<\/button><span class=\"sc\" style=\"font-size:12px\">iii<\/span><\/div>\n<div style=\"margin-top:60px;display:flex;gap:14px\">\n<div style=\"width:2px;background:#8A2B1F;flex:none\" aria-hidden=\"true\"><\/div>\n<div style=\"flex:1\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.55;text-align:right\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.55;text-align:left\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<\/div>\n<\/div>\n<div style=\"margin-top:22px;padding:16px 18px;background:#EAE4D7;border-radius:4px\">\n<label for=\"note\" class=\"sc\" style=\"display:block;font-size:12px;color:#8A2B1F\">Your margin note<\/label>\n<textarea id=\"note\" rows=\"3\" style=\"margin-top:8px;width:100%;box-sizing:border-box;border:0;background:none;resize:none;font:italic 400 19px/1.35 'Markazi Text';color:#1C1A16;padding:0\">The pen comes last, after the sword. The list ends on the weapon he trusts most.<\/textarea>\n<\/div>\n<div style=\"display:flex;justify-content:flex-end;gap:10px;margin-top:14px\"><button class=\"lnk\" style=\"color:#5E574C\">Cancel<\/button><button class=\"lnk\" style=\"text-decoration:underline;text-underline-offset:5px;color:#8A2B1F\">Keep in margins<\/button><\/div>\n<div style=\"margin-top:auto;padding-bottom:30px;font:italic 400 15px 'Markazi Text';color:#5E574C;text-align:center\">Long-press any couplet to annotate it<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>4 · Write in the margin.<\/b> Long-press a couplet: an oxblood rule marks it and a note field opens below. No toolbar and no icons, just the page and your handwriting.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"padding:64px 28px 0\">\n<h2 style=\"margin:0;font:500 44px/1 'Markazi Text',serif;text-align:center\">Margins<\/h2>\n<div style=\"text-align:center;font:italic 400 16px 'Markazi Text';color:#5E574C;margin-top:6px\">Your lines and notes, in the order you kept them<\/div>\n<div class=\"rule\" style=\"width:40px;margin:16px auto 18px;background:#8A2B1F\"><\/div>\n<div style=\"display:flex;gap:12px;padding-bottom:18px;border-bottom:1px solid #DDD5C6\">\n<div style=\"width:2px;background:#8A2B1F;flex:none\" aria-hidden=\"true\"><\/div>\n<div style=\"flex:1\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;line-height:1.5\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div><div style=\"font:italic 400 16px/1.35 'Markazi Text';color:#3A352D;margin-top:6px\">The pen comes last, after the sword...<\/div><div class=\"sc\" style=\"font-size:11px;margin-top:6px\">al-Mutanabbi · iii<\/div><\/div>\n<\/div>\n<div style=\"display:flex;gap:12px;padding:18px 0;border-bottom:1px solid #DDD5C6\">\n<div style=\"width:2px;background:#8A2B1F;flex:none\" aria-hidden=\"true\"><\/div>\n<div style=\"flex:1\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;line-height:1.5\">قِفا نَبْكِ مِنْ ذِكْرى حَبيبٍ ومَنْزِلِ<\/div><div style=\"font:italic 400 16px/1.35 'Markazi Text';color:#3A352D;margin-top:6px\">Two companions, one grief. Who are they?<\/div><div class=\"sc\" style=\"font-size:11px;margin-top:6px\">Imruʾ al-Qays · i<\/div><\/div>\n<\/div>\n<nav style=\"margin-top:auto;display:flex;justify-content:center;gap:18px;padding-bottom:26px\"><button class=\"lnk\">Contents<\/button><button class=\"lnk\" style=\"text-decoration:underline;text-underline-offset:5px\">Margins<\/button><button class=\"lnk\">Search<\/button><\/nav>\n<\/div>\n<figcaption class=\"cap\"><b>5 · Margins.<\/b> Every annotated line, with its note, as a commonplace book. Export as a printed booklet later.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"padding:64px 28px 0\">\n<h2 style=\"margin:0;font:500 44px/1 'Markazi Text',serif;text-align:center\">Search<\/h2>\n<div style=\"margin-top:22px;border-bottom:1px solid #1C1A16;display:flex;align-items:center;gap:8px;padding-bottom:6px\">\n<label for=\"q\" class=\"sc\" style=\"font-size:11px\">Root<\/label>\n<input id=\"q\" value=\"ق ر ط س\" dir=\"rtl\" lang=\"ar\" style=\"flex:1;border:0;background:none;font:500 26px 'Markazi Text';color:#1C1A16;text-align:right;letter-spacing:.2em;min-height:44px\">\n<\/div>\n<div style=\"display:flex;gap:16px;margin-top:12px\"><button class=\"lnk\" style=\"padding-left:0;text-decoration:underline;text-underline-offset:5px;color:#8A2B1F\">Root<\/button><button class=\"lnk\">Word<\/button><button class=\"lnk\">Meter<\/button><button class=\"lnk\">Poet<\/button><\/div>\n<div class=\"sc\" style=\"font-size:12px;margin-top:18px\">In the collection<\/div>\n<div style=\"padding:14px 0;border-bottom:1px solid #DDD5C6\"><div class=\"ar\" lang=\"ar\" style=\"font-size:22px;line-height:1.5\">وَالسّيفُ وَالرّمحُ وال<span style=\"color:#8A2B1F;text-decoration:underline;text-underline-offset:6px\">قِرْطاسُ<\/span> وَالقَلَمُ<\/div><div class=\"sc\" style=\"font-size:11px;margin-top:4px\">al-Mutanabbi · iii<\/div><\/div>\n<p style=\"margin:16px 0 0;font:400 17px/1.4 'Markazi Text';color:#3A352D\"><span class=\"ar\" lang=\"ar\" style=\"font-size:20px\">قِرْطاس<\/span>, paper. Borrowed through Greek chártēs, cousin of the English word chart.<\/p>\n<nav style=\"margin-top:auto;display:flex;justify-content:center;gap:18px;padding-bottom:26px\"><button class=\"lnk\">Contents<\/button><button class=\"lnk\">Margins<\/button><button class=\"lnk\" style=\"text-decoration:underline;text-underline-offset:5px\">Search<\/button><\/nav>\n<\/div>\n<figcaption class=\"cap\"><b>6 · Search by root.<\/b> Search the way Arabic actually works: by three-letter root, by meter, by poet. Results show the matched word in context.<\/figcaption>\n<\/figure>\n\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "v1"}, "Gallery.dc.html": {"x": 0, "y": 3480, "w": 2952, "h": 1040, "title": "04 Gallery · One poem a day", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>04 Gallery: one poem a day<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#D4B57A}a:hover{color:#E8CD98}\n.step{margin:0;width:360px;flex:none;display:flex;flex-direction:column;gap:18px}\n.ph{width:360px;height:780px;border-radius:44px;overflow:hidden;position:relative;box-sizing:border-box;background:#16241F;border:1px solid #2C3D37;display:flex;flex-direction:column;color:#EEE8DC;font-family:Inter,sans-serif}\n.cap{font:400 14px/1.5 Inter,sans-serif;color:#B9C2BC;margin:0}\n.cap b{color:#EEE8DC;font-weight:600}\n.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl}\n.lbl{font:600 11px Inter;letter-spacing:.18em;text-transform:uppercase;color:#A9B3AC}\n.disp{font-family:'Cormorant Garamond',serif}\n.room{display:flex;align-items:center;justify-content:space-between;padding:56px 24px 0}\n.next{height:52px;border-radius:26px;border:1px solid #D4B57A;background:none;color:#EEE8DC;font:500 14px Inter;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin:0 24px 30px}\n.tap{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid #D4B57A;box-shadow:0 0 0 8px rgba(212,181,122,.16);pointer-events:none}\n.spot{position:absolute;left:50%;top:-120px;width:520px;height:520px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,240,210,.10),transparent);pointer-events:none}\n<\/style>\n<\/helmet>\n<div style=\"width:2952px;height:1040px;box-sizing:border-box;padding:64px;background:#0F1915;display:flex;gap:64px;font-family:Inter,sans-serif\">\n\n<aside style=\"width:400px;flex:none;display:flex;flex-direction:column;gap:22px;color:#EEE8DC\">\n<div style=\"font:600 12px Inter;letter-spacing:.14em;color:#D4B57A\">DIRECTION 04 · THE MUSEUM CURATOR<\/div>\n<h1 style=\"margin:0;font:500 64px/1 'Cormorant Garamond',serif\">Gallery<\/h1>\n<p style=\"margin:0;font:400 18px/1.5 Inter;color:#D3D9D4\">Each day, one poem as an exhibition in four rooms: context, poem, voice, exit. No feed, no badges, no infinite scroll. Scarcity is the luxury.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div class=\"lbl\">Built from<\/div><p style=\"margin:0;font:400 15px/1.5 Inter;color:#D3D9D4\">The curator: \"You're giving the poet a notification count.\" Plus the critique: context belongs before the poem, not hidden behind Insights.<\/p><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div class=\"lbl\">Principles<\/div>\n<ul style=\"margin:0;padding-left:18px;font:400 15px/1.6 Inter;color:#D3D9D4\"><li>One poem a day. The archive stays open.<\/li><li>Linear rooms with a single \"next\" door.<\/li><li>Wall-label typography: small caps, brass.<\/li><li>Sharing is the gift shop, at the exit.<\/li><\/ul><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div class=\"lbl\">Flow<\/div>\n<ol style=\"margin:0;padding-left:20px;font:400 15px/1.6 Inter;color:#D3D9D4\"><li>Entrance: today's exhibition<\/li><li>Room I: context wall<\/li><li>Room II: the poem<\/li><li>Room III: the listening room<\/li><li>Room IV: exit and gift shop<\/li><li>Closed until tomorrow, archive open<\/li><\/ol><\/div>\n<div style=\"margin-top:auto;border-top:1px solid #2C3D37;padding-top:18px;font:400 14px/1.5 Inter;color:#B9C2BC\"><b style=\"color:#EEE8DC\">Measure (hypothesis):<\/b> returning on consecutive days and finishing all four rooms, rather than time in app.<\/div>\n<\/aside>\n\n<div style=\"display:flex;gap:40px\">\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div class=\"spot\" aria-hidden=\"true\"><\/div>\n<div style=\"padding:64px 28px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px\">\n<div class=\"lbl\">Today's exhibition<\/div>\n<div style=\"font:500 13px Inter;color:#B9C2BC\">Wednesday 18 November<\/div>\n<\/div>\n<div style=\"margin:56px 28px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:46px;font-weight:600;line-height:1.4\">قِفا نَبْكِ<\/div>\n<div class=\"disp\" style=\"font-size:26px;font-style:italic;color:#E2DBCC\">Stop, let us weep<\/div>\n<div style=\"width:36px;height:1px;background:#D4B57A;margin:6px 0\"><\/div>\n<div class=\"lbl\" style=\"color:#D4B57A\">Imruʾ al-Qays · 6th century<\/div>\n<\/div>\n<div style=\"margin:54px 32px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center\">\n<div><div class=\"disp\" style=\"font-size:24px\">I<\/div><div style=\"font:500 11px Inter;color:#A9B3AC\">Context<\/div><\/div>\n<div><div class=\"disp\" style=\"font-size:24px\">II<\/div><div style=\"font:500 11px Inter;color:#A9B3AC\">Poem<\/div><\/div>\n<div><div class=\"disp\" style=\"font-size:24px\">III<\/div><div style=\"font:500 11px Inter;color:#A9B3AC\">Voice<\/div><\/div>\n<div><div class=\"disp\" style=\"font-size:24px\">IV<\/div><div style=\"font:500 11px Inter;color:#A9B3AC\">Exit<\/div><\/div>\n<\/div>\n<div style=\"flex:1\"><\/div>\n<button class=\"next\" style=\"background:#D4B57A;color:#16241F;border:0;font-weight:600\">Enter the exhibition<\/button>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:158px;top:702px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>1 · Entrance.<\/b> One poem, one date, four numbered rooms. A soft spotlight and a single door. Nothing else on offer today.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div class=\"room\"><span class=\"lbl\">Room I of IV<\/span><button aria-label=\"Leave exhibition\" style=\"width:44px;height:44px;border:0;background:none;color:#EEE8DC;cursor:pointer\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg><\/button><\/div>\n<svg viewBox=\"0 0 360 150\" width=\"360\" height=\"150\" aria-hidden=\"true\" style=\"margin-top:20px\"><path d=\"M0 120 C60 90 110 96 160 110 S260 80 360 100\" fill=\"none\" stroke=\"#D4B57A\" stroke-width=\"1.2\"><\/path><path d=\"M0 135 C80 112 140 124 200 130 S300 110 360 122\" fill=\"none\" stroke=\"#5E7A6E\" stroke-width=\"1\"><\/path><path d=\"M0 100 C50 80 120 70 180 88 S290 60 360 76\" fill=\"none\" stroke=\"#3E5A50\" stroke-width=\"1\"><\/path><\/svg>\n<div style=\"padding:10px 28px 0;display:flex;flex-direction:column;gap:12px\">\n<div class=\"disp\" style=\"font-size:32px;font-weight:600;line-height:1.1\">Imruʾ al-Qays<\/div>\n<div class=\"lbl\" style=\"color:#D4B57A\">Kinda, Arabia · died 6th century<\/div>\n<p style=\"margin:6px 0 0;font:400 15px/1.6 Inter;color:#D3D9D4\">A prince of the tribe of Kinda, remembered as the wandering king. He opens his ode the way the desert ode often opens: at an abandoned campsite, asking two companions to stop.<\/p>\n<p style=\"margin:0;font:400 15px/1.6 Inter;color:#D3D9D4\">By tradition, it was one of the poems hung at the Kaaba. Most scholars treat that story as legend.<\/p>\n<\/div>\n<div style=\"flex:1\"><\/div>\n<button class=\"next\">Room II · The poem <span aria-hidden=\"true\">→<\/span><\/button>\n<\/div>\n<figcaption class=\"cap\"><b>2 · Context wall.<\/b> A wall label you read standing up: who, where, when, and the one idea you need before the first line. Legend is labelled as legend.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div class=\"spot\" aria-hidden=\"true\" style=\"top:60px\"><\/div>\n<div class=\"room\"><span class=\"lbl\">Room II of IV<\/span><button aria-label=\"Leave exhibition\" style=\"width:44px;height:44px;border:0;background:none;color:#EEE8DC;cursor:pointer\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg><\/button><\/div>\n<div style=\"margin:60px 24px 0;padding:30px 22px;border:1px solid #3A4C45;display:flex;flex-direction:column;gap:10px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:25px;line-height:1.8;text-align:center\">قِفا نَبْكِ مِنْ ذِكْرى حَبيبٍ ومَنْزِلِ<br>بِسِقْطِ اللِّوى بَيْنَ الدَّخولِ فَحَوْمَلِ<\/div>\n<div style=\"width:28px;height:1px;background:#D4B57A;align-self:center;margin:6px 0\"><\/div>\n<div class=\"disp\" style=\"font-size:19px;font-style:italic;line-height:1.4;text-align:center;color:#E2DBCC\">Stop, both of you, and let us weep for a beloved and a home remembered, where the dunes end, between al-Dakhūl and Ḥawmal.<\/div>\n<\/div>\n<div style=\"margin:18px 24px 0;display:flex;justify-content:space-between;align-items:center\"><span class=\"lbl\">Plate 1 of [N]<\/span><span style=\"font:500 13px Inter;color:#B9C2BC\">Swipe for the next couplet<\/span><\/div>\n<div style=\"flex:1\"><\/div>\n<button class=\"next\">Room III · The voice <span aria-hidden=\"true\">→<\/span><\/button>\n<\/div>\n<figcaption class=\"cap\"><b>3 · The poem.<\/b> Each couplet framed like a plate on the wall, Arabic above, translation as the caption. Swipe sideways through plates; the door forward is always the same button.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div class=\"room\"><span class=\"lbl\">Room III of IV<\/span><button aria-label=\"Leave exhibition\" style=\"width:44px;height:44px;border:0;background:none;color:#EEE8DC;cursor:pointer\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg><\/button><\/div>\n<div style=\"margin-top:64px;display:flex;flex-direction:column;align-items:center;gap:24px\">\n<div class=\"lbl\">The listening room<\/div>\n<button aria-label=\"Play recitation\" style=\"width:132px;height:132px;border-radius:66px;border:1px solid #D4B57A;background:radial-gradient(circle,#22352E,#16241F);color:#D4B57A;display:flex;align-items:center;justify-content:center;cursor:pointer\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\"><\/path><\/svg><\/button>\n<div aria-hidden=\"true\" style=\"display:flex;align-items:center;gap:3px;height:48px\">\n<span style=\"width:3px;height:14px;background:#D4B57A;border-radius:2px\"><\/span><span style=\"width:3px;height:28px;background:#D4B57A;border-radius:2px\"><\/span><span style=\"width:3px;height:40px;background:#D4B57A;border-radius:2px\"><\/span><span style=\"width:3px;height:22px;background:#D4B57A;border-radius:2px\"><\/span><span style=\"width:3px;height:34px;background:#D4B57A;border-radius:2px\"><\/span><span style=\"width:3px;height:18px;background:#D4B57A;border-radius:2px\"><\/span><span style=\"width:3px;height:44px;background:#D4B57A;border-radius:2px\"><\/span><span style=\"width:3px;height:26px;background:#5E7A6E;border-radius:2px\"><\/span><span style=\"width:3px;height:36px;background:#5E7A6E;border-radius:2px\"><\/span><span style=\"width:3px;height:16px;background:#5E7A6E;border-radius:2px\"><\/span><span style=\"width:3px;height:30px;background:#5E7A6E;border-radius:2px\"><\/span><span style=\"width:3px;height:20px;background:#5E7A6E;border-radius:2px\"><\/span><span style=\"width:3px;height:38px;background:#5E7A6E;border-radius:2px\"><\/span><span style=\"width:3px;height:12px;background:#5E7A6E;border-radius:2px\"><\/span>\n<\/div>\n<div style=\"text-align:center\"><div class=\"disp\" style=\"font-size:22px\">Recited by [RECITER NAME]<\/div><div style=\"font:500 13px Inter;color:#B9C2BC;margin-top:4px\">[LENGTH] · headphones recommended<\/div><\/div>\n<\/div>\n<div style=\"margin:30px 28px 0;padding-top:18px;border-top:1px solid #2C3D37\"><div class=\"ar\" lang=\"ar\" style=\"font-size:20px;line-height:1.8;text-align:center;color:#EEE8DC\">قِفا نَبْكِ مِنْ ذِكْرى حَبيبٍ ومَنْزِلِ<\/div><\/div>\n<div style=\"flex:1\"><\/div>\n<button class=\"next\">Room IV · Exit <span aria-hidden=\"true\">→<\/span><\/button>\n<\/div>\n<figcaption class=\"cap\"><b>4 · Listening room.<\/b> A darkened room with one control. The current line sits quietly under the waveform. Recitation credits are part of the exhibit.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div class=\"room\"><span class=\"lbl\">Room IV · Exit<\/span><span><\/span><\/div>\n<div style=\"margin:30px 24px 0;text-align:center\"><div class=\"disp\" style=\"font-size:30px;font-weight:600\">The gift shop<\/div><div style=\"font:400 14px Inter;color:#B9C2BC;margin-top:4px\">Take a plate home with you<\/div><\/div>\n<div style=\"margin:22px 36px 0;padding:28px 20px;background:#EEE8DC;color:#16241F;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.4)\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:21px;line-height:1.8\">قِفا نَبْكِ مِنْ ذِكْرى حَبيبٍ ومَنْزِلِ<\/div>\n<div style=\"width:24px;height:1px;background:#8C6B33\"><\/div>\n<div class=\"disp\" style=\"font-size:16px;font-style:italic;line-height:1.35\">Stop, both of you, and let us weep for a beloved and a home remembered.<\/div>\n<div style=\"font:600 10px Inter;letter-spacing:.18em;color:#5C4A26\">IMRUʾ AL-QAYS · 18 NOV<\/div>\n<\/div>\n<div style=\"margin:26px 24px 0;display:flex;flex-direction:column;gap:10px\">\n<button style=\"height:52px;border-radius:26px;border:0;background:#D4B57A;color:#16241F;font:600 15px Inter;cursor:pointer\">Send as a card<\/button>\n<button style=\"height:52px;border-radius:26px;border:1px solid #3A4C45;background:none;color:#EEE8DC;font:500 15px Inter;cursor:pointer\">Keep in my collection<\/button>\n<\/div>\n<div style=\"flex:1\"><\/div>\n<a href=\"#\" style=\"text-align:center;font:500 14px Inter;padding-bottom:34px;min-height:44px\">Leave the exhibition<\/a>\n<\/div>\n<figcaption class=\"cap\"><b>5 · Exit through the gift shop.<\/b> Sharing lives here, at the end, as a printed plate dated to today. Keeping it adds it to your personal collection.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div style=\"padding:72px 28px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px\">\n<div class=\"lbl\">Closed for today<\/div>\n<div class=\"disp\" style=\"font-size:34px;font-weight:600;line-height:1.1\">The next exhibition opens at dawn<\/div>\n<div style=\"font:500 15px Inter;color:#D4B57A;margin-top:4px\">in 14 h 22 min<\/div>\n<button style=\"margin-top:10px;height:44px;padding:0 20px;border-radius:22px;border:1px solid #3A4C45;background:none;color:#EEE8DC;font:500 13px Inter;cursor:pointer\">Remind me<\/button>\n<\/div>\n<div style=\"margin:36px 24px 0\" class=\"lbl\">The archive<\/div>\n<div style=\"margin:10px 24px 0;display:flex;flex-direction:column\">\n<a href=\"#\" style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #2C3D37;color:#EEE8DC;text-decoration:none\"><span style=\"font:500 13px Inter;color:#A9B3AC\">Tue 17 Nov<\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:20px\">واحَرَّ قَلباه<\/span><\/a>\n<a href=\"#\" style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #2C3D37;color:#EEE8DC;text-decoration:none\"><span style=\"font:500 13px Inter;color:#A9B3AC\">Mon 16 Nov<\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:20px\">أَضْحى التَّنائي<\/span><\/a>\n<a href=\"#\" style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #2C3D37;color:#EEE8DC;text-decoration:none\"><span style=\"font:500 13px Inter;color:#A9B3AC\">Sun 15 Nov<\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:20px\">هَلْ غادَرَ الشُّعَراءُ<\/span><\/a>\n<\/div>\n<div style=\"flex:1\"><\/div>\n<div style=\"text-align:center;font:400 13px Inter;color:#A9B3AC;padding:0 32px 34px\">Past exhibitions stay open. Only today's is new.<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>6 · Closed until tomorrow.<\/b> A real ending: a countdown, an optional reminder, and an archive of past rooms. Missing a day costs nothing.<\/figcaption>\n<\/figure>\n\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "v1"}, "Majlis.dc.html": {"x": 0, "y": 4640, "w": 2952, "h": 1040, "title": "05 Majlis · The study companion", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>05 Majlis: the study companion<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Readex+Pro:wght@400;500;600&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#E7A33E}a:hover{color:#F3BE6A}\n.step{margin:0;width:360px;flex:none;display:flex;flex-direction:column;gap:18px}\n.ph{width:360px;height:780px;border-radius:44px;overflow:hidden;position:relative;box-sizing:border-box;background:#0E2426;border:1px solid #234245;display:flex;flex-direction:column;color:#F1E9DA;font-family:'Readex Pro',sans-serif}\n.cap{font:400 14px/1.5 'Readex Pro',sans-serif;color:#B5C4C0;margin:0}\n.cap b{color:#F1E9DA;font-weight:600}\n.ar{font-family:Amiri,serif;direction:rtl}\n.card{background:#163437;border-radius:22px}\n.lbl{font:600 11px 'Readex Pro';letter-spacing:.14em;text-transform:uppercase;color:#B5C4C0}\n.tr{font:400 14px/1.4 'Readex Pro';color:#B5C4C0;text-align:right;font-style:italic}\n.en{font:400 15px/1.4 'Readex Pro';color:#E4DCCD;text-align:right}\n.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px 'Readex Pro';color:#9FB1AD;min-width:64px;min-height:48px;justify-content:center;cursor:pointer}\n.tg{height:36px;padding:0 12px;border-radius:18px;border:1px solid #2F5256;background:none;color:#B5C4C0;font:500 12px 'Readex Pro';display:flex;align-items:center;gap:6px;cursor:pointer}\n.tg.on{background:#F1E9DA;color:#0E2426;border-color:#F1E9DA}\n.tap{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid #E7A33E;box-shadow:0 0 0 8px rgba(231,163,62,.18);pointer-events:none}\n.pri{height:52px;border-radius:26px;border:0;background:#E7A33E;color:#1B1407;font:600 15px 'Readex Pro';cursor:pointer}\n.sec{height:52px;border-radius:26px;border:1px solid #2F5256;background:none;color:#F1E9DA;font:500 15px 'Readex Pro';cursor:pointer}\n.u{text-decoration:underline dotted #6E8F8B;text-underline-offset:10px}\n<\/style>\n<\/helmet>\n<div style=\"width:2952px;height:1040px;box-sizing:border-box;padding:64px;background:#0A1C1E;display:flex;gap:64px;font-family:'Readex Pro',sans-serif\">\n\n<aside style=\"width:400px;flex:none;display:flex;flex-direction:column;gap:22px;color:#F1E9DA\">\n<div style=\"font:600 12px 'Readex Pro';letter-spacing:.14em;color:#E7A33E\">DIRECTION 05 · THE LEARNER<\/div>\n<h1 style=\"margin:0;font:500 60px/1 'Readex Pro'\">Majlis<\/h1>\n<p style=\"margin:0;font:400 18px/1.5 'Readex Pro';color:#D8D2C4\">A study circle in your pocket. One verse a day, read in layers, explored through roots, recited aloud and kept with spaced review. Poetry as the way into Arabic.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div class=\"lbl\">Built from<\/div><p style=\"margin:0;font:400 15px/1.5 'Readex Pro';color:#D8D2C4\">The critique's missing learner features: tap for meaning, transliteration, meter. Plus the tashkeel the current app already does well.<\/p><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div class=\"lbl\">Principles<\/div>\n<ul style=\"margin:0;padding-left:18px;font:400 15px/1.6 'Readex Pro';color:#D8D2C4\"><li>Layers you switch on and off, not modes.<\/li><li>Roots are the map of the language.<\/li><li>Speak it, then hear what to fix.<\/li><li>Feedback uses icons and words, not color alone.<\/li><\/ul><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div class=\"lbl\">Flow<\/div>\n<ol style=\"margin:0;padding-left:20px;font:400 15px/1.6 'Readex Pro';color:#D8D2C4\"><li>Today's verse and due reviews<\/li><li>Layered reader<\/li><li>Root explorer<\/li><li>Recite the line aloud<\/li><li>Pronunciation feedback<\/li><li>Spaced review cards<\/li><\/ol><\/div>\n<div style=\"margin-top:auto;border-top:1px solid #234245;padding-top:18px;font:400 14px/1.5 'Readex Pro';color:#B5C4C0\"><b style=\"color:#F1E9DA\">Open question:<\/b> speech scoring for classical Arabic needs testing with real reciters before it ships.<\/div>\n<\/aside>\n\n<div style=\"display:flex;gap:40px\">\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"padding:58px 24px 0;display:flex;align-items:center;justify-content:space-between\"><div><div class=\"lbl\">Wednesday<\/div><div style=\"font:600 26px 'Readex Pro';margin-top:4px\">Your majlis<\/div><\/div><div class=\"ar\" lang=\"ar\" style=\"font-size:26px;color:#E7A33E\">مَجْلِس<\/div><\/header>\n<div class=\"card\" style=\"margin:22px 20px 0;padding:22px;display:flex;flex-direction:column;gap:10px\">\n<div class=\"lbl\" style=\"color:#E7A33E\">Today's verse · 6 min<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:26px;line-height:1.7;text-align:right\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div class=\"en\">The horses, the night and the desert know me,<\/div>\n<div style=\"display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px\"><span style=\"padding:4px 10px;border-radius:10px;background:#1F4245;font:500 12px 'Readex Pro'\">4 new words<\/span><span style=\"padding:4px 10px;border-radius:10px;background:#1F4245;font:500 12px 'Readex Pro'\">1 root<\/span><span style=\"padding:4px 10px;border-radius:10px;background:#1F4245;font:500 12px 'Readex Pro'\">al-Basīṭ<\/span><\/div>\n<button class=\"pri\" style=\"margin-top:8px\">Start<\/button>\n<\/div>\n<div class=\"card\" style=\"margin:14px 20px 0;padding:18px 20px;display:flex;align-items:center;gap:14px\">\n<div style=\"width:44px;height:44px;border-radius:22px;background:#1F4245;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E7A33E\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"6\" width=\"13\" height=\"14\" rx=\"2\"><\/rect><path d=\"M8 3h11a1 1 0 0 1 1 1v12\"><\/path><\/svg><\/div>\n<div style=\"flex:1\"><di
