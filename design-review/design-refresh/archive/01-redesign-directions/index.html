;box-shadow:0 0 0 8px rgba(242,213,142,.16);pointer-events:none}\n<\/style>\n<\/helmet>\n<div style=\"width:2952px;height:1040px;box-sizing:border-box;padding:64px;background:#08070B;display:flex;gap:64px;font-family:Inter,sans-serif\">\n\n<aside style=\"width:400px;flex:none;display:flex;flex-direction:column;gap:20px;color:#F2EDE3\">\n<div style=\"font:600 12px Inter;letter-spacing:.14em;color:#D4B06A\">RECOMMENDED · DIRECTION A<\/div>\n<h1 style=\"margin:0;font:500 56px/1 'Cormorant Garamond',serif\">Night Reader<\/h1>\n<p style=\"margin:0;font:400 16px/1.5 Inter;color:#D6CFC1\">Happy path: find today's poem, listen, look up a word, ask about a line, save and share. Five taps from launch to a shared verse.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"lab\">Audit fixes in this flow<\/div>\n<ul style=\"margin:0;padding-left:18px;font:400 14px/1.55 Inter;color:#D6CFC1\">\n<li><b style=\"color:#F2EDE3\">Critical, trust:<\/b> every poem shows its source edition and an editor-verified mark. <span class=\"tag\">VALIDATED NEED<\/span><\/li>\n<li><b style=\"color:#F2EDE3\">Contrast:<\/b> translation #D6CFC1 at 12.7:1, inactive tabs 6.6:1 (WCAG 1.4.3). <span class=\"tag\">VALIDATED<\/span><\/li>\n<li><b style=\"color:#F2EDE3\">Tabs are places, actions live on the poem<\/b> (Apple HIG tab bars). <span class=\"tag\">VALIDATED<\/span><\/li>\n<li><b style=\"color:#F2EDE3\">Active tab:<\/b> filled pill and weight, not color alone (WCAG 1.4.1). <span class=\"tag\">VALIDATED<\/span><\/li>\n<li><b style=\"color:#F2EDE3\">Targets:<\/b> 48 px minimum, beyond WCAG 2.5.8's 24 px. <span class=\"tag\">VALIDATED<\/span><\/li>\n<\/ul>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"lab\">Unconventional bet<\/div>\n<p style=\"margin:0;font:400 14px/1.55 Inter;color:#D6CFC1\">\"Ask about this line\": an AI explanation shown under an editor's note, clearly labelled, with sources and a way to report errors. <span class=\"tag\">HYPOTHESIS<\/span> Success: at least 30% of readers who open Insights ask a question, with under 2% of answers reported as wrong.<\/p>\n<\/div>\n<div style=\"margin-top:auto;border-top:1px solid #2A2730;padding-top:16px;font:400 13px/1.5 Inter;color:#BDB5A6\"><b style=\"color:#F2EDE3\">Measure:<\/b> listen rate per session, word taps per poem, day-7 return, SEQ after \"look up a word\".<\/div>\n<\/aside>\n\n<div style=\"display:flex;gap:40px\">\n\n<!-- 1 Today -->\n<figure class=\"step\">\n<div class=\"ph\">\n<svg aria-hidden=\"true\" width=\"360\" height=\"360\" style=\"position:absolute;left:0;top:0;pointer-events:none\"><defs><pattern id=\"st\" width=\"44\" height=\"44\" patternUnits=\"userSpaceOnUse\"><path d=\"M22 6 L38 22 L22 38 L6 22Z M10.7 10.7H33.3V33.3H10.7Z\" fill=\"none\" stroke=\"#33406B\" stroke-width=\"1\"><\/path><\/pattern><linearGradient id=\"fd\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".85\"><\/stop><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"><\/stop><\/linearGradient><mask id=\"mk\"><rect width=\"360\" height=\"360\" fill=\"url(#fd)\"><\/rect><\/mask><\/defs><rect width=\"360\" height=\"360\" fill=\"url(#st)\" mask=\"url(#mk)\"><\/rect><\/svg>\n<header style=\"position:relative;display:flex;align-items:center;justify-content:space-between;padding:50px 12px 0 24px\">\n<div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font:500 22px 'Cormorant Garamond',serif;color:#D6CFC1\">poetry<\/span><span class=\"kufi\" lang=\"ar\" style=\"font-size:22px;font-weight:700;color:#D4B06A\">بالعربي<\/span><\/div>\n<button class=\"ib\" aria-label=\"Search\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"m20 20-3.5-3.5\"><\/path><\/svg><\/button>\n<\/header>\n<div style=\"position:relative;padding:40px 26px 0;text-align:right\">\n<div class=\"caps\" style=\"font-size:11px;color:#D4B06A\">Poem of the day · Wed 18 Nov<\/div>\n<div class=\"kufi\" lang=\"ar\" style=\"font-size:52px;font-weight:700;color:#D4B06A;line-height:1.2;margin-top:14px\">واحر قلباه<\/div>\n<div class=\"caps\" style=\"color:#F2EDE3;margin-top:10px\">O, the fire in my heart<\/div>\n<div style=\"margin-top:10px;font:500 15px Inter;color:#D4B06A\"><span class=\"ar\" lang=\"ar\" style=\"font-size:18px\">المتنبي<\/span> · al-Mutanabbi<\/div>\n<div style=\"margin-top:6px;font:400 13px Inter;color:#BDB5A6\">10th century · al-Basīṭ · [N] couplets · [MM] min<\/div>\n<\/div>\n<div style=\"position:relative;display:flex;gap:10px;padding:26px 24px 0;justify-content:flex-end\">\n<button class=\"sec\" style=\"height:52px;padding:0 22px\">Read<\/button>\n<button class=\"pri\" style=\"padding:0 24px;display:flex;align-items:center;gap:8px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M7 5v14l12-7z\"><\/path><\/svg>Listen<\/button>\n<\/div>\n<div style=\"padding:30px 24px 10px\" class=\"lab\">Continue<\/div>\n<div style=\"margin:0 20px;padding:14px 16px;border-radius:18px;background:#17151C;display:flex;align-items:center;gap:12px\">\n<svg width=\"36\" height=\"36\" viewBox=\"0 0 36 36\" aria-hidden=\"true\"><circle cx=\"18\" cy=\"18\" r=\"15\" fill=\"none\" stroke=\"#2A2730\" stroke-width=\"3\"><\/circle><circle cx=\"18\" cy=\"18\" r=\"15\" fill=\"none\" stroke=\"#D4B06A\" stroke-width=\"3\" stroke-dasharray=\"56 94\" transform=\"rotate(-90 18 18)\"><\/circle><\/svg>\n<div style=\"flex:1;text-align:right\"><div class=\"ar\" lang=\"ar\" style=\"font-size:20px\">قِفا نَبْكِ<\/div><div style=\"font:400 12px Inter;color:#BDB5A6\">Imruʾ al-Qays · 60% read<\/div><\/div>\n<\/div>\n<nav class=\"pill\" aria-label=\"Main\">\n<button class=\"tab on\" aria-current=\"page\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 0-5 0-8z\"><\/path><\/svg>Today<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M5 4v16M10 4v16M15 4l4 16\"><\/path><\/svg>Library<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg>Saved<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\/circle><path d=\"M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6\"><\/path><\/svg>You<\/button>\n<\/nav>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:180px;top:428px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>1 · Today.<\/b> The original's hero (lattice, Kufi gold title, tracked caps, bilingual byline) becomes the poem of the day. The flame from Discover now means Today. The pill bar stays but drops Share, the badge and the floating buttons.<\/figcaption>\n<\/figure>\n\n<!-- 2 Reader -->\n<figure class=\"step\">\n<div class=\"ph\">\n<svg aria-hidden=\"true\" width=\"360\" height=\"300\" style=\"position:absolute;left:0;top:0;pointer-events:none\"><defs><pattern id=\"st2\" width=\"44\" height=\"44\" patternUnits=\"userSpaceOnUse\"><path d=\"M22 6 L38 22 L22 38 L6 22Z M10.7 10.7H33.3V33.3H10.7Z\" fill=\"none\" stroke=\"#33406B\" stroke-width=\"1\"><\/path><\/pattern><linearGradient id=\"fd2\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".85\"><\/stop><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"><\/stop><\/linearGradient><mask id=\"mk2\"><rect width=\"360\" height=\"300\" fill=\"url(#fd2)\"><\/rect><\/mask><\/defs><rect width=\"360\" height=\"300\" fill=\"url(#st2)\" mask=\"url(#mk2)\"><\/rect><\/svg>\n<header style=\"position:relative;display:flex;align-items:center;justify-content:space-between;padding:48px 12px 0 6px\"><button class=\"ib\" aria-label=\"Back to Today\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button><button aria-haspopup=\"true\" style=\"height:40px;padding:0 14px;border-radius:20px;border:1px solid #7A7380;background:#0B0A0Fcc;color:#F2EDE3;font:500 13px Inter;cursor:pointer\">Layers · Arabic + English<\/button><\/header>\n<div style=\"position:relative;padding:6px 26px 0;text-align:right\">\n<div class=\"kufi\" lang=\"ar\" style=\"font-size:40px;font-weight:700;color:#D4B06A;line-height:1.2\">واحر قلباه<\/div>\n<div class=\"caps\" style=\"color:#F2EDE3;margin-top:8px\">O, the fire in my heart<\/div>\n<div style=\"margin-top:8px;font:500 15px Inter;color:#D4B06A\"><span class=\"ar\" lang=\"ar\" style=\"font-size:18px\">المتنبي<\/span> · al-Mutanabbi<\/div>\n<a href=\"#\" style=\"display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:500 12px Inter;color:#BDB5A6;text-decoration:none;min-height:24px\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8CC9A0\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4 10-10\"><\/path><\/svg>Editor verified · [SOURCE EDITION]<\/a>\n<\/div>\n<div style=\"position:relative;padding:22px 26px 0;display:flex;flex-direction:column;gap:6px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div class=\"en\" style=\"font-size:19px;line-height:1.35\">The horses, the night and the desert know me,<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7;margin-top:12px\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div class=\"en\" style=\"font-size:19px;line-height:1.35\">and the sword, the spear, the paper and the pen.<\/div>\n<\/div>\n<div style=\"margin-top:auto;padding:12px 20px 28px;display:flex;align-items:center;gap:4px;background:linear-gradient(transparent,#0B0A0F 35%)\">\n<button class=\"pri\" style=\"height:56px;padding:0 26px;display:flex;align-items:center;gap:8px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M7 5v14l12-7z\"><\/path><\/svg>Listen<\/button>\n<div style=\"flex:1\"><\/div>\n<button class=\"ib\" aria-label=\"Save poem\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg><\/button>\n<button class=\"ib\" aria-label=\"Share\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 15V4M8 8l4-4 4 4M5 13v6h14v-6\"><\/path><\/svg><\/button>\n<button class=\"ib\" aria-label=\"Insights and more\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"12\" r=\"1.8\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"1.8\"><\/circle><circle cx=\"19\" cy=\"12\" r=\"1.8\"><\/circle><\/svg><\/button>\n<\/div>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:44px;top:696px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>2 · Reader.<\/b> Same composition as the original, with one action row. Listen leads (labelled, not icon-only). The source line answers \"can I trust this vowelling?\". The tab bar hides while reading for focus.<\/figcaption>\n<\/figure>\n\n<!-- 3 Listening -->\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"display:flex;align-items:center;justify-content:space-between;padding:48px 12px 0 6px\"><button class=\"ib\" aria-label=\"Back to Today\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button><div class=\"kufi\" lang=\"ar\" style=\"font-size:18px;color:#D4B06A\">واحر قلباه<\/div><div style=\"width:48px\"><\/div><\/header>\n<div style=\"padding:20px 26px 0;display:flex;flex-direction:column;gap:6px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.7;color:#9C9588\">أنَا الذي نَظَرَ الأعْمَى إلى أدَبي<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.7;color:#9C9588\">وَأسْمَعَتْ كَلِماتي مَنْ بهِ صَمَمُ<\/div>\n<div aria-current=\"true\" style=\"margin:14px -14px 0;padding:14px;border-radius:18px;background:#17151C;border:1px solid #3A3328\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:30px;line-height:1.7\"><span>الخَيْلُ وَاللّيْلُ <\/span><span style=\"color:#D4B06A;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:10px\">وَالبَيْداءُ<\/span><span style=\"color:#9C9588\"> تَعرِفُني<\/span><\/div>\n<div class=\"en\" style=\"font-size:19px;line-height:1.35\">The horses, the night and the desert know me,<\/div>\n<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.7;color:#9C9588;margin-top:12px\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<\/div>\n<div style=\"margin:auto 14px 24px;padding:14px 16px;border-radius:26px;background:#17151C;border:1px solid #2A2730;display:flex;flex-direction:column;gap:12px\">\n<div style=\"height:4px;border-radius:2px;background:#2A2730\" role=\"progressbar\" aria-label=\"Recitation progress\" aria-valuenow=\"34\" aria-valuemin=\"0\" aria-valuemax=\"100\"><div style=\"width:34%;height:4px;border-radius:2px;background:#D4B06A\"><\/div><\/div>\n<div style=\"display:flex;align-items:center;gap:4px\">\n<button class=\"ib\" aria-label=\"Replay this couplet\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 3-6.2M4 4v4h4\"><\/path><\/svg><\/button>\n<button aria-label=\"Pause\" style=\"width:56px;height:56px;border-radius:28px;border:0;background:#D4B06A;color:#141210;display:flex;align-items:center;justify-content:center;cursor:pointer\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><\/svg><\/button>\n<div style=\"flex:1;padding-left:8px\"><div style=\"font:600 13px Inter\">Recited by [RECITER]<\/div><div style=\"font:400 12px Inter;color:#BDB5A6\">1:12 / [LENGTH]<\/div><\/div>\n<button class=\"ib\" aria-label=\"Playback speed 1x\" style=\"font:600 13px Inter\">1×<\/button>\n<button class=\"ib\" aria-label=\"Follow along is on\" aria-pressed=\"true\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D4B06A\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16M4 12h10M4 18h6\"><\/path><\/svg><\/button>\n<\/div>\n<\/div>\n<div class=\"tap\" aria-hidden=\"true\" style=\"left:150px;top:268px\"><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>3 · Listening.<\/b> The current couplet lifts into a card and the spoken word is gold plus underlined. Auto-scroll pauses if you scroll by hand; \"Follow along\" resumes it. Under Reduce Motion, the highlight changes instantly with no scrolling animation.<\/figcaption>\n<\/figure>\n\n<!-- 4 Word -->\n<figure class=\"step\">\n<div class=\"ph\">\n<div style=\"padding:104px 26px 0;display:flex;flex-direction:column;gap:6px;opacity:.4\" aria-hidden=\"true\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:1.7\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<\/div>\n<section class=\"sheet\" role=\"dialog\" aria-label=\"Word: al-qirtas\">\n<div class=\"grab\" aria-hidden=\"true\"><\/div>\n<div style=\"display:flex;align-items:center;justify-content:space-between\">\n<button class=\"ib\" aria-label=\"Close\" style=\"margin-left:-12px\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg><\/button>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:46px;font-weight:700;color:#D4B06A\">القِرْطاسُ<\/div>\n<\/div>\n<div style=\"display:flex;align-items:center;justify-content:space-between\"><button class=\"sec\" style=\"height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;font-size:14px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 0 1 0 6\"><\/path><\/svg>Hear it<\/button><div style=\"font:500 15px Inter;color:#BDB5A6\">al-qirṭās · noun<\/div><\/div>\n<div style=\"text-align:right;font:500 26px 'Cormorant Garamond',serif\">paper, parchment<\/div>\n<div style=\"display:flex;justify-content:flex-end\"><div style=\"padding:8px 14px;border-radius:12px;background:#211E27;font:500 13px Inter\">Root <span class=\"ar\" lang=\"ar\" style=\"font-size:17px;margin-left:6px\">ق ر ط س<\/span> · <a href=\"#\">3 more words<\/a><\/div><\/div>\n<p style=\"margin:0;text-align:right;font:400 14px/1.55 Inter;color:#D6CFC1\">Borrowed through Greek chártēs, the same ancestor as English chart. Listed beside the sword and spear: the pen counted as a weapon.<\/p>\n<div style=\"text-align:right;font:500 12px Inter;color:#9C9588\">Source: [DICTIONARY] · editor note<\/div>\n<div style=\"display:flex;gap:10px;margin-top:2px\"><button class=\"sec\" style=\"flex:1\">Add to review<\/button><button class=\"pri\" style=\"flex:1\">Save word<\/button><\/div>\n<\/section>\n<\/div>\n<figcaption class=\"cap\"><b>4 · Word.<\/b> Tap any word: a half sheet with pronunciation, meaning, root family and one line of context. Audio keeps playing underneath. Close, swipe down or Escape dismisses it. Focus returns to the word.<\/figcaption>\n<\/figure>\n\n<!-- 5 Ask -->\n<figure class=\"step\">\n<div class=\"ph\">\n<div style=\"padding:88px 26px 0;opacity:.4\" aria-hidden=\"true\"><div class=\"ar\" lang=\"ar\" style=\"font-size:27px;line-height:1.7\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div><\/div>\n<section class=\"sheet\" role=\"dialog\" aria-label=\"Insights for this couplet\" style=\"top:170px\">\n<div class=\"grab\" aria-hidden=\"true\"><\/div>\n<div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"font:600 16px Inter\">About this couplet<\/div><button class=\"ib\" aria-label=\"Close\" style=\"margin-right:-12px\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg><\/button><\/div>\n<div style=\"padding:14px;border-radius:16px;background:#211E27\">\n<div style=\"display:flex;align-items:center;gap:6px;font:600 11px Inter;letter-spacing:.1em;color:#8CC9A0\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4 10-10\"><\/path><\/svg>EDITOR NOTE<\/div>\n<p style=\"margin:8px 0 0;font:400 14px/1.55 Inter;color:#D6CFC1\">Self-praise (fakhr): the poet lists what knows him, moving from horses and desert to weapons and ends on paper and pen.<\/p>\n<\/div>\n<label for=\"ask\" class=\"lab\" style=\"margin-top:2px\">Ask about this line<\/label>\n<div style=\"display:flex;gap:8px\"><input id=\"ask\" value=\"Why does the pen come last?\" style=\"flex:1;height:48px;border-radius:24px;border:1px solid #7A7380;background:#0B0A0F;color:#F2EDE3;padding:0 16px;font:400 14px Inter\"><button class=\"pri\" aria-label=\"Ask\" style=\"width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg><\/button><\/div>\n<div style=\"padding:14px;border-radius:16px;border:1px dashed #7A7380\">\n<div style=\"display:flex;align-items:center;gap:6px;font:600 11px Inter;letter-spacing:.1em;color:#F2D58E\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2\"><\/path><\/svg>AI EXPLANATION · MAY BE WRONG<\/div>\n<p style=\"margin:8px 0 0;font:400 14px/1.55 Inter;color:#D6CFC1\">Ending a list on the strongest item is a common rhetorical move. Here it suggests the poet ranks his writing above his fighting. Interpretations differ.<\/p>\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:8px\"><a href=\"#\" style=\"font:500 12px Inter\">Based on: editor note, [COMMENTARY]<\/a><button class=\"ib\" aria-label=\"Report a problem with this answer\" style=\"width:44px;height:44px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 21V4h11l-2 4 2 4H5\"><\/path><\/svg><\/button><\/div>\n<\/div>\n<\/section>\n<\/div>\n<figcaption class=\"cap\"><b>5 · Insights and Ask.<\/b> Verified editor content comes first and looks different from AI content, which is labelled, cites what it drew on and has a report button. This is trust calibration, not a chatbot bolted on.<\/figcaption>\n<\/figure>\n\n<!-- 6 Share -->\n<figure class=\"step\">\n<div class=\"ph\">\n<div role=\"status\" style=\"margin:56px 18px 0;padding:10px 10px 10px 16px;border-radius:16px;background:#211E27;display:flex;align-items:center;gap:10px;font:500 14px Inter\">\n<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8CC9A0\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4 10-10\"><\/path><\/svg>Couplet saved<button style=\"margin-left:auto;height:40px;padding:0 14px;border-radius:20px;border:0;background:none;color:#D4B06A;font:600 14px Inter;cursor:pointer\">Undo<\/button><\/div>\n<section class=\"sheet\" role=\"dialog\" aria-label=\"Share\">\n<div class=\"grab\" aria-hidden=\"true\"><\/div>\n<div style=\"font:600 16px Inter\">Share this couplet<\/div>\n<div style=\"border-radius:22px;overflow:hidden;position:relative;background:#0B0A0F;border:1px solid #3A3328;padding:28px 22px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center\">\n<svg aria-hidden=\"true\" width=\"320\" height=\"140\" style=\"position:absolute;left:0;top:0\"><defs><pattern id=\"st6\" width=\"34\" height=\"34\" patternUnits=\"userSpaceOnUse\"><path d=\"M17 5 L29 17 L17 29 L5 17Z M8.5 8.5H25.5V25.5H8.5Z\" fill=\"none\" stroke=\"#33406B\" stroke-width=\"1\"><\/path><\/pattern><linearGradient id=\"fd6\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".7\"><\/stop><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"><\/stop><\/linearGradient><mask id=\"mk6\"><rect width=\"320\" height=\"140\" fill=\"url(#fd6)\"><\/rect><\/mask><\/defs><rect width=\"320\" height=\"140\" fill=\"url(#st6)\" mask=\"url(#mk6)\"><\/rect><\/svg>\n<div class=\"ar\" lang=\"ar\" style=\"position:relative;text-align:center;font-size:23px;line-height:1.7\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<br>وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div style=\"width:30px;height:1px;background:#D4B06A\"><\/div>\n<div style=\"font:italic 400 16px/1.4 'Cormorant Garamond',serif;color:#D6CFC1\">The horses, the night and the desert know me, and the sword, the spear, the paper and the pen.<\/div>\n<div class=\"caps\" style=\"font-size:10px;color:#D4B06A\">al-Mutanabbi · poetry بالعربي<\/div>\n<\/div>\n<div role=\"radiogroup\" aria-label=\"Format\" style=\"display:flex;gap:8px\">\n<button role=\"radio\" aria-checked=\"true\" style=\"flex:1;height:44px;border-radius:22px;border:1px solid #D4B06A;background:#211E27;color:#D4B06A;font:600 13px Inter\">Story 9:16<\/button>\n<button role=\"radio\" aria-checked=\"false\" style=\"flex:1;height:44px;border-radius:22px;border:1px solid #7A7380;background:none;color:#F2EDE3;font:500 13px Inter\">Square<\/button>\n<button role=\"radio\" aria-checked=\"false\" style=\"flex:1;height:44px;border-radius:22px;border:1px solid #7A7380;background:none;color:#F2EDE3;font:500 13px Inter\">Link<\/button>\n<\/div>\n<button class=\"pri\">Share<\/button>\n<\/section>\n<\/div>\n<figcaption class=\"cap\"><b>6 · Save and share.<\/b> Saving confirms with an undoable toast (no confirmation dialog for a reversible action). Share renders the couplet as a card that carries the brand's lattice, sized for Stories by default. The system share sheet comes next.<\/figcaption>\n<\/figure>\n\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n"}, "V2Edge.dc.html": {"x": 0, "y": 2320, "w": 2952, "h": 1040, "title": "v2 · Edge states: first run, loading, offline, error, empty", "page": "v2", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>v2: edge states<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Reem+Kufi:wght@500;700&amp;family=Jost:wght@400;500&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#D4B06A}a:hover{color:#F2D58E}\n.step{margin:0;width:360px;flex:none;display:flex;flex-direction:column;gap:16px}\n.ph{width:360px;height:780px;border-radius:44px;overflow:hidden;position:relative;box-sizing:border-box;background:#0B0A0F;border:1px solid #2A2730;display:flex;flex-direction:column;color:#F2EDE3;font-family:Inter,sans-serif}\n.cap{font:400 14px/1.5 Inter;color:#BDB5A6;margin:0}\n.cap b{color:#F2EDE3;font-weight:600}\n.ar{font-family:Amiri,serif;direction:rtl;text-align:right}\n.kufi{font-family:'Reem Kufi',sans-serif;direction:rtl}\n.caps{font:400 13px Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase}\n.en{font-family:'Cormorant Garamond',serif;font-style:italic;text-align:right;color:#D6CFC1}\n.ib{background:none;border:0;color:#F2EDE3;width:48px;height:48px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:24px;cursor:pointer}\n.lab{font:600 11px Inter;letter-spacing:.14em;color:#9C9588;text-transform:uppercase}\n.pill{position:absolute;left:14px;right:14px;bottom:18px;height:72px;border-radius:36px;background:#141218;border:1px solid #2A2730;display:flex;align-items:center;justify-content:space-around;padding:0 8px}\n.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:400 11px Jost;letter-spacing:.12em;text-transform:uppercase;color:#9C9588;min-width:72px;height:60px;justify-content:center;border-radius:30px;cursor:pointer}\n.tab.on{background:#211E27;color:#D4B06A;font-weight:500}\n.pri{height:52px;border-radius:26px;border:0;background:#D4B06A;color:#141210;font:600 15px Inter;cursor:pointer}\n.sec{height:52px;border-radius:26px;border:1px solid #7A7380;background:none;color:#F2EDE3;font:500 15px Inter;cursor:pointer}\n.sk{background:#1D1B22;border-radius:8px}\n.opt{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:#17151C;border:1px solid #2A2730;text-align:left;color:#F2EDE3;cursor:pointer;width:100%;box-sizing:border-box}\n.radio{width:22px;height:22px;border-radius:11px;border:2px solid #7A7380;flex:none;margin-top:2px;box-sizing:border-box}\n<\/style>\n<\/helmet>\n<div style=\"width:2952px;height:1040px;box-sizing:border-box;padding:64px;background:#08070B;display:flex;gap:64px;font-family:Inter,sans-serif\">\n\n<aside style=\"width:400px;flex:none;display:flex;flex-direction:column;gap:20px;color:#F2EDE3\">\n<div style=\"font:600 12px Inter;letter-spacing:.14em;color:#D4B06A\">NIGHT READER · EDGE STATES<\/div>\n<h1 style=\"margin:0;font:500 52px/1.05 'Cormorant Garamond',serif\">The screens nobody mocks up<\/h1>\n<p style=\"margin:0;font:400 15px/1.55 Inter;color:#D6CFC1\">The v1 explorations skipped these. Each state says what happened, what still works, and the one next step.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div class=\"lab\">State rules<\/div>\n<ul style=\"margin:0;padding-left:18px;font:400 14px/1.55 Inter;color:#D6CFC1\">\n<li><b style=\"color:#F2EDE3\">First run<\/b> sets default layers by self-reported level; changeable any time in Layers.<\/li>\n<li><b style=\"color:#F2EDE3\">Loading<\/b> uses a skeleton shaped like the real layout; the shimmer is off under Reduce Motion; a polite live region announces \"Loading poem\".<\/li>\n<li><b style=\"color:#F2EDE3\">Offline<\/b> degrades by feature: text works, audio says why it doesn't.<\/li>\n<li><b style=\"color:#F2EDE3\">Errors<\/b> name the cause and the fix, and never block reading.<\/li>\n<li><b style=\"color:#F2EDE3\">Empty<\/b> states teach the gesture that fills them.<\/li>\n<li><b style=\"color:#F2EDE3\">No results<\/b> is honest about the catalogue (rights), and offers a root search.<\/li>\n<\/ul>\n<\/div>\n<div style=\"margin-top:auto;border-top:1px solid #2A2730;padding-top:16px;font:400 13px/1.5 Inter;color:#BDB5A6\"><b style=\"color:#F2EDE3\">Still to design:<\/b> reminder permission denied, account sync conflict, very long poems (lazy loading), right-to-left screen reader order audit.<\/div>\n<\/aside>\n\n<div style=\"display:flex;gap:40px\">\n\n<figure class=\"step\">\n<div class=\"ph\" style=\"padding:0 20px\">\n<svg aria-hidden=\"true\" width=\"360\" height=\"300\" style=\"position:absolute;left:0;top:0;pointer-events:none\"><defs><pattern id=\"e1\" width=\"44\" height=\"44\" patternUnits=\"userSpaceOnUse\"><path d=\"M22 6 L38 22 L22 38 L6 22Z M10.7 10.7H33.3V33.3H10.7Z\" fill=\"none\" stroke=\"#33406B\" stroke-width=\"1\"><\/path><\/pattern><linearGradient id=\"g1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".85\"><\/stop><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"><\/stop><\/linearGradient><mask id=\"m1\"><rect width=\"360\" height=\"300\" fill=\"url(#g1)\"><\/rect><\/mask><\/defs><rect width=\"360\" height=\"300\" fill=\"url(#e1)\" mask=\"url(#m1)\"><\/rect><\/svg>\n<div style=\"position:relative;padding:84px 6px 0;text-align:center\"><div class=\"kufi\" lang=\"ar\" style=\"font-size:34px;font-weight:700;color:#D4B06A\">أهلاً<\/div><h2 style=\"margin:10px 0 0;font:500 30px/1.15 'Cormorant Garamond',serif\">How do you read Arabic?<\/h2><p style=\"margin:8px 0 0;font:400 14px Inter;color:#BDB5A6\">This sets what you see first. Change it any time.<\/p><\/div>\n<fieldset style=\"position:relative;border:0;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:10px\">\n<legend style=\"position:absolute;width:1px;height:1px;overflow:hidden\">Reading level<\/legend>\n<button class=\"opt\" role=\"radio\" aria-checked=\"false\"><span class=\"radio\"><\/span><span><span style=\"display:block;font:600 15px Inter\">I'm new to Arabic<\/span><span style=\"display:block;font:400 13px/1.4 Inter;color:#BDB5A6;margin-top:2px\">Arabic, a sound-it-out line and English<\/span><\/span><\/button>\n<button class=\"opt\" role=\"radio\" aria-checked=\"true\" style=\"border-color:#D4B06A;background:#1B1810\"><span class=\"radio\" style=\"border:7px solid #D4B06A\"><\/span><span><span style=\"display:block;font:600 15px Inter\">I'm learning<\/span><span style=\"display:block;font:400 13px/1.4 Inter;color:#BDB5A6;margin-top:2px\">Arabic and English, tap words for help<\/span><\/span><\/button>\n<button class=\"opt\" role=\"radio\" aria-checked=\"false\"><span class=\"radio\"><\/span><span><span style=\"display:block;font:600 15px Inter\">I read it fluently<\/span><span style=\"display:block;font:400 13px/1.4 Inter;color:#BDB5A6;margin-top:2px\">Arabic only, English on request<\/span><\/span><\/button>\n<\/fieldset>\n<div style=\"margin-top:auto;padding-bottom:26px;display:flex;flex-direction:column;gap:6px\"><button class=\"pri\">Continue<\/button><button style=\"height:44px;border:0;background:none;color:#D6CFC1;font:500 14px Inter;cursor:pointer\">Decide later<\/button><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>1 · First run.<\/b> One question, three options, one sensible default (Learning). It drives the Layers default so a single reader serves every level. No account wall before the first poem.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div role=\"status\" style=\"position:absolute;width:1px;height:1px;overflow:hidden\">Loading poem<\/div>\n<header style=\"display:flex;align-items:center;justify-content:space-between;padding:48px 12px 0 6px\"><button class=\"ib\" aria-label=\"Back to Today\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button><div class=\"sk\" style=\"width:150px;height:40px;border-radius:20px\"><\/div><\/header>\n<div aria-hidden=\"true\" style=\"padding:10px 26px 0;display:flex;flex-direction:column;align-items:flex-end;gap:12px\">\n<div class=\"sk\" style=\"width:210px;height:44px\"><\/div>\n<div class=\"sk\" style=\"width:190px;height:14px\"><\/div>\n<div class=\"sk\" style=\"width:150px;height:14px\"><\/div>\n<div style=\"height:16px\"><\/div>\n<div class=\"sk\" style=\"width:290px;height:28px\"><\/div>\n<div class=\"sk\" style=\"width:240px;height:16px;background:#17151C\"><\/div>\n<div style=\"height:8px\"><\/div>\n<div class=\"sk\" style=\"width:270px;height:28px\"><\/div>\n<div class=\"sk\" style=\"width:220px;height:16px;background:#17151C\"><\/div>\n<div style=\"height:8px\"><\/div>\n<div class=\"sk\" style=\"width:300px;height:28px\"><\/div>\n<div class=\"sk\" style=\"width:230px;height:16px;background:#17151C\"><\/div>\n<\/div>\n<div style=\"margin-top:auto;padding:0 20px 28px;display:flex;align-items:center;gap:10px\" aria-hidden=\"true\"><div class=\"sk\" style=\"width:130px;height:56px;border-radius:28px\"><\/div><div style=\"flex:1\"><\/div><div class=\"sk\" style=\"width:40px;height:40px;border-radius:20px\"><\/div><div class=\"sk\" style=\"width:40px;height:40px;border-radius:20px\"><\/div><div class=\"sk\" style=\"width:40px;height:40px;border-radius:20px\"><\/div><\/div>\n<\/div>\n<figcaption class=\"cap\"><b>2 · Loading.<\/b> A skeleton that matches the reader exactly, so nothing jumps when the text arrives. Shown only after 300 ms, to avoid a flash on fast loads. Verse text is cached before audio.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<div role=\"status\" style=\"margin:52px 16px 0;padding:12px 14px;border-radius:16px;background:#211E27;display:flex;gap:10px;align-items:flex-start\">\n<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F2D58E\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex:none;margin-top:1px\"><path d=\"M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M3 3l18 18\"><\/path><\/svg>\n<div style=\"font:400 13px/1.45 Inter;color:#D6CFC1\"><b style=\"color:#F2EDE3\">You're offline.<\/b> This poem's text is saved on your device. Recitation needs a connection.<\/div>\n<\/div>\n<div style=\"padding:18px 26px 0;text-align:right\">\n<div class=\"kufi\" lang=\"ar\" style=\"font-size:34px;font-weight:700;color:#D4B06A\">واحر قلباه<\/div>\n<div style=\"margin-top:6px;font:500 14px Inter;color:#D4B06A\">al-Mutanabbi<\/div>\n<\/div>\n<div style=\"padding:16px 26px 0;display:flex;flex-direction:column;gap:6px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:28px;line-height:1.7\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div>\n<div class=\"en\" style=\"font-size:18px\">The horses, the night and the desert know me,<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:28px;line-height:1.7;margin-top:10px\">وَالسّيفُ وَالرّمحُ والقِرْطاسُ وَالقَلَمُ<\/div>\n<div class=\"en\" style=\"font-size:18px\">and the sword, the spear, the paper and the pen.<\/div>\n<\/div>\n<div style=\"margin:18px 20px 0;padding:14px 16px;border-radius:16px;background:#17151C;display:flex;align-items:center;gap:12px\">\n<div style=\"flex:1\"><div style=\"font:600 14px Inter\">Download for offline<\/div><div style=\"font:400 12px Inter;color:#BDB5A6\">Text and audio, when you're back online<\/div><\/div>\n<button role=\"switch\" aria-checked=\"true\" aria-label=\"Download for offline\" style=\"width:52px;height:32px;border-radius:16px;border:0;background:#D4B06A;position:relative;cursor:pointer\"><span style=\"position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#141210\"><\/span><\/button>\n<\/div>\n<div style=\"margin-top:auto;padding:0 20px 28px;display:flex;align-items:center;gap:10px\">\n<button disabled aria-describedby=\"offnote\" style=\"height:56px;padding:0 22px;border-radius:28px;border:1px dashed #7A7380;background:none;color:#BDB5A6;font:500 15px Inter;display:flex;align-items:center;gap:8px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M7 5v14l12-7zM3 3l18 18\"><\/path><\/svg>Audio offline<\/button>\n<span id=\"offnote\" style=\"font:400 12px/1.4 Inter;color:#9C9588\">Available when you reconnect<\/span>\n<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>3 · Offline.<\/b> Reading keeps working. The Listen button turns into a dashed, labelled \"Audio offline\" state instead of failing on tap. Download for offline queues itself.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"display:flex;align-items:center;justify-content:space-between;padding:48px 12px 0 6px\"><button class=\"ib\" aria-label=\"Back to Today\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button><div class=\"kufi\" lang=\"ar\" style=\"font-size:18px;color:#D4B06A\">واحر قلباه<\/div><div style=\"width:48px\"><\/div><\/header>\n<div style=\"padding:20px 26px 0;display:flex;flex-direction:column;gap:6px\">\n<div class=\"ar\" lang=\"ar\" style=\"font-size:28px;line-height:1.7\">أنَا الذي نَظَرَ الأعْمَى إلى أدَبي<\/div>\n<div class=\"en\" style=\"font-size:18px\">I am the one whose craft the blind have seen,<\/div>\n<div class=\"ar\" lang=\"ar\" style=\"font-size:28px;line-height:1.7;margin-top:10px\">وَأسْمَعَتْ كَلِماتي مَنْ بهِ صَمَمُ<\/div>\n<div class=\"en\" style=\"font-size:18px\">whose words have reached even the deaf.<\/div>\n<\/div>\n<div role=\"alert\" style=\"margin:auto 14px 24px;padding:16px;border-radius:24px;background:#17151C;border:1px solid #6B3A33;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;gap:10px;align-items:flex-start\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F08A7E\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex:none\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v6M12 16.5v.5\"><\/path><\/svg><div><div style=\"font:600 14px Inter\">The recitation didn't load<\/div><div style=\"font:400 13px/1.45 Inter;color:#BDB5A6;margin-top:2px\">The connection dropped partway. Your place is saved at 1:12.<\/div><\/div><\/div>\n<div style=\"display:flex;gap:10px\"><button class=\"sec\" style=\"flex:1;height:48px\">Keep reading<\/button><button class=\"pri\" style=\"flex:1;height:48px\">Try again<\/button><\/div>\n<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>4 · Audio error.<\/b> It says what happened, keeps your place, and gives two clear exits. An icon and a red border, not color alone. Announced via role=\"alert\".<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"padding:60px 24px 0\"><h2 style=\"margin:0;font:500 36px 'Cormorant Garamond',serif\">Saved<\/h2><\/header>\n<div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 34px 0;gap:14px\">\n<svg width=\"96\" height=\"96\" viewBox=\"0 0 96 96\" aria-hidden=\"true\"><path d=\"M48 8 L88 48 L48 88 L8 48Z M19.7 19.7H76.3V76.3H19.7Z\" fill=\"none\" stroke=\"#33406B\" stroke-width=\"1.5\"><\/path><path d=\"M38 34h20v30l-10-7-10 7z\" fill=\"none\" stroke=\"#D4B06A\" stroke-width=\"2\"><\/path><\/svg>\n<div style=\"font:500 26px 'Cormorant Garamond',serif\">Nothing saved yet<\/div>\n<p style=\"margin:0;font:400 14px/1.55 Inter;color:#BDB5A6\">Tap the bookmark on a poem, or press and hold a single line to keep just that line. Words you save appear here too.<\/p>\n<button class=\"pri\" style=\"margin-top:8px;padding:0 24px\">Go to today's poem<\/button>\n<\/div>\n<nav class=\"pill\" aria-label=\"Main\">\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 0-5 0-8z\"><\/path><\/svg>Today<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M5 4v16M10 4v16M15 4l4 16\"><\/path><\/svg>Library<\/button>\n<button class=\"tab on\" aria-current=\"page\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg>Saved<\/button>\n<button class=\"tab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\/circle><path d=\"M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6\"><\/path><\/svg>You<\/button>\n<\/nav>\n<\/div>\n<figcaption class=\"cap\"><b>5 · Empty Saved.<\/b> It teaches both save gestures (poem and single line) and offers one way forward. The lattice star returns as the empty-state mark.<\/figcaption>\n<\/figure>\n\n<figure class=\"step\">\n<div class=\"ph\">\n<header style=\"display:flex;align-items:center;gap:8px;padding:52px 16px 0 6px\"><button class=\"ib\" aria-label=\"Back\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"><\/path><\/svg><\/button>\n<label for=\"s\" style=\"position:absolute;width:1px;height:1px;overflow:hidden\">Search poems, poets or roots<\/label>\n<input id=\"s\" value=\"نزار قباني\" dir=\"rtl\" lang=\"ar\" style=\"flex:1;height:48px;border-radius:24px;border:1px solid #7A7380;background:#17151C;color:#F2EDE3;padding:0 16px;font:400 18px Amiri\"><\/header>\n<div style=\"padding:40px 28px 0;display:flex;flex-direction:column;gap:12px\">\n<div role=\"status\" style=\"font:500 24px/1.25 'Cormorant Garamond',serif\">No poems by this poet yet<\/div>\n<p style=\"margin:0;font:400 14px/1.55 Inter;color:#BDB5A6\">Poems are added once the rights to the text and recordings are cleared. You can ask us to prioritise this poet.<\/p>\n<button class=\"sec\" style=\"align-self:flex-start;padding:0 20px;height:48px\">Request this poet<\/button>\n<\/div>\n<div style=\"padding:30px 28px 10px\" class=\"lab\">Try instead<\/div>\n<div style=\"padding:0 20px;display:flex;flex-direction:column;gap:8px\">\n<a href=\"#\" style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:#17151C;text-decoration:none;color:#F2EDE3;min-height:24px\"><span style=\"font:500 14px Inter\">Search by root<\/span><span class=\"ar\" lang=\"ar\" style=\"font-size:20px;letter-spacing:.2em\">ح ب ب<\/span><\/a>\n<a href=\"#\" style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:#17151C;text-decoration:none;color:#F2EDE3\"><span style=\"font:500 14px Inter\">Browse the theme Love<\/span><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#BDB5A6\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"><\/path><\/svg><\/a>\n<a href=\"#\" style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:#17151C;text-decoration:none;color:#F2EDE3\"><span style=\"font:500 14px Inter\">Poets of the 20th century<\/span><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#BDB5A6\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"><\/path><\/svg><\/a>\n<\/div>\n<\/div>\n<figcaption class=\"cap\"><b>6 · No results.<\/b> Honest about why (rights), useful about what next (request, root search, related browse). The request count doubles as demand data for licensing priorities.<\/figcaption>\n<\/figure>\n\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n"}, "V2Spec.dc.html": {"x": 0, "y": 3480, "w": 2952, "h": 1240, "title": "v2 · Spec sheet: tokens, type, states, motion", "page": "v2", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>v2: spec sheet<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Reem+Kufi:wght@500;700&amp;family=Jost:wght@400;500&amp;family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#D4B06A}a:hover{color:#F2D58E}\n.card{background:#121117;border:1px solid #23202A;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}\n.h{margin:0;font:500 30px 'Cormorant Garamond',serif;color:#F2EDE3}\n.lab{font:600 11px Inter;letter-spacing:.14em;color:#9C9588;text-transform:uppercase}\n.mono{font:400 12px 'JetBrains Mono',monospace;color:#BDB5A6}\ntable{border-collapse:collapse;width:100%}\nth,td{text-align:left;padding:8px 8px;border-bottom:1px solid #23202A;font:400 13px/1.4 Inter;color:#D6CFC1;vertical-align:middle}\nth{font:600 10px Inter;letter-spacing:.12em;color:#9C9588;text-transform:uppercase}\n.sw{width:22px;height:22px;border-radius:6px;border:1px solid #34303A;display:inline-block;vertical-align:middle}\n.pass{font:600 11px Inter;color:#8CC9A0}\n.ar{font-family:Amiri,serif;direction:rtl}\n.st{display:flex;flex-direction:column;align-items:center;gap:8px}\n.st span{font:500 11px Inter;color:#9C9588}\n<\/style>\n<\/helmet>\n<div style=\"width:2952px;height:1240px;box-sizing:border-box;padding:64px;background:#08070B;display:flex;flex-direction:column;gap:32px;font-family:Inter,sans-serif;color:#F2EDE3\">\n\n<div style=\"display:flex;align-items:flex-end;justify-content:space-between\">\n<div><div style=\"font:600 12px Inter;letter-spacing:.14em;color:#D4B06A\">NIGHT READER · HANDOFF<\/div><h1 style=\"margin:8px 0 0;font:500 56px/1 'Cormorant Garamond',serif\">Spec sheet<\/h1><\/div>\n<p style=\"margin:0;max-width:760px;font:400 15px/1.55 Inter;color:#BDB5A6\">Contrast ratios are computed against canvas #0B0A0F per WCAG 2.2 (text 4.5:1, UI 3:1). Spacing on a 4/8 scale. Dark is the only theme for v1; a light \"paper\" theme is a later token swap.<\/p>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;flex:1\">\n\n<section class=\"card\" style=\"grid-row:span 2\">\n<h2 class=\"h\">Color roles<\/h2>\n<table>\n<thead><tr><th><\/th><th>Token<\/th><th>Hex<\/th><th>On bg<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><span class=\"sw\" style=\"background:#0B0A0F\"><\/span><\/td><td>bg.canvas<\/td><td class=\"mono\">#0B0A0F<\/td><td>base<\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#17151C\"><\/span><\/td><td>surface.1 (cards, sheets)<\/td><td class=\"mono\">#17151C<\/td><td>base<\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#211E27\"><\/span><\/td><td>surface.2 (chips, toasts)<\/td><td class=\"mono\">#211E27<\/td><td>base<\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#F2EDE3\"><\/span><\/td><td>text.primary, verse<\/td><td class=\"mono\">#F2EDE3<\/td><td><span class=\"pass\">16.9<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#D6CFC1\"><\/span><\/td><td>text.translation<\/td><td class=\"mono\">#D6CFC1<\/td><td><span class=\"pass\">12.7<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#BDB5A6\"><\/span><\/td><td>text.secondary<\/td><td class=\"mono\">#BDB5A6<\/td><td><span class=\"pass\">9.7<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#9C9588\"><\/span><\/td><td>text.muted, inactive tab<\/td><td class=\"mono\">#9C9588<\/td><td><span class=\"pass\">6.6<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#D4B06A\"><\/span><\/td><td>accent.gold<\/td><td class=\"mono\">#D4B06A<\/td><td><span class=\"pass\">9.6<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#141210\"><\/span><\/td><td>on.accent (on gold)<\/td><td class=\"mono\">#141210<\/td><td><span class=\"pass\">9.1<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#7A7380\"><\/span><\/td><td>border.control<\/td><td class=\"mono\">#7A7380<\/td><td><span class=\"pass\">4.3<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#F2D58E\"><\/span><\/td><td>focus.ring<\/td><td class=\"mono\">#F2D58E<\/td><td><span class=\"pass\">13.8<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#8CC9A0\"><\/span><\/td><td>status.success<\/td><td class=\"mono\">#8CC9A0<\/td><td><span class=\"pass\">10.3<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#F08A7E\"><\/span><\/td><td>status.danger<\/td><td class=\"mono\">#F08A7E<\/td><td><span class=\"pass\">8.1<\/span><\/td><\/tr>\n<tr><td><span class=\"sw\" style=\"background:#33406B\"><\/span><\/td><td>pattern.lattice<\/td><td class=\"mono\">#33406B<\/td><td>decor<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p style=\"margin:0;font:400 13px/1.5 Inter;color:#BDB5A6\">Gold is reserved for: the primary action, the active tab, the spoken word, and titles. Never for status. Muted text never carries required information.<\/p>\n<\/section>\n\n<section class=\"card\" style=\"grid-column:span 2\">\n<h2 class=\"h\">Type scale<\/h2>\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 32px\">\n<div><div class=\"lab\">display.ar · Reem Kufi 700 · 52/62<\/div><div lang=\"ar\" style=\"font:700 52px/62px 'Reem Kufi';direction:rtl;color:#D4B06A\">واحر قلباه<\/div><\/div>\n<div><div class=\"lab\">verse.ar · Amiri 400 · 29/49 (1.7)<\/div><div class=\"ar\" lang=\"ar\" style=\"font-size:29px;line-height:49px\">الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني<\/div><\/div>\n<div><div class=\"lab\">eyebrow · Jost 400 · 13/16 · +0.2em caps<\/div><div style=\"font:400 13px/16px Jost;letter-spacing:.2em;text-transform:uppercase;margin-top:8px\">O, the fire in my heart<\/div><\/div>\n<div><div class=\"lab\">translation · Cormorant italic 400 · 19/26<\/div><div style=\"font:italic 400 19px/26px 'Cormorant Garamond';color:#D6CFC1;margin-top:6px\">The horses, the night and the desert know me,<\/div><\/div>\n<div><div class=\"lab\">body · Inter 400 · 15/22<\/div><div style=\"font:400 15px/22px Inter;color:#D6CFC1;margin-top:6px\">Borrowed through Greek chártēs, the same ancestor as chart.<\/div><\/div>\n<div><div class=\"lab\">label · Inter 600 · 11/16 · +0.14em caps<\/div><div style=\"font:600 11px/16px Inter;letter-spacing:.14em;text-transform:uppercase;color:#9C9588;margin-top:6px\">Continue<\/div><\/div>\n<\/div>\n<p style=\"margin:0;font:400 13px/1.5 Inter;color:#BDB5A6\">Verse line-height stays at 1.7 or more so stacked tashkeel never collides. The Aa control scales verse from 24 to 40 px; layout reflows, never truncates. Kufi is for titles only: it renders vowel marks poorly, so verse is always Naskh (Amiri).<\/p>\n<\/section>\n\n<section class=\"card\">\n<h2 class=\"h\">Space, size, shape<\/h2>\n<div style=\"display:flex;align-items:flex-end;gap:10px\">\n<div class=\"st\"><div style=\"width:4px;height:4px;background:#D4B06A\"><\/div><span>4<\/span><\/div>\n<div class=\"st\"><div style=\"width:8px;height:8px;background:#D4B06A\"><\/div><span>8<\/span><\/div>\n<div class=\"st\"><div style=\"width:12px;height:12px;background:#D4B06A\"><\/div><span>12<\/span><\/div>\n<div class=\"st\"><div style=\"width:16px;height:16px;background:#D4B06A\"><\/div><span>16<\/span><\/div>\n<div class=\"st\"><div style=\"width:24px;height:24px;background:#D4B06A\"><\/div><span>24<\/span><\/div>\n<div class=\"st\"><div style=\"width:32px;height:32px;background:#D4B06A\"><\/div><span>32<\/span><\/div>\n<div class=\"st\"><div style=\"width:48px;height:48px;background:#D4B06A\"><\/div><span>48<\/span><\/div>\n<\/div>\n<ul style=\"margin:0;padding-left:18px;font:400 13px/1.6 Inter;color:#D6CFC1\">\n<li>Side margin 24 to 26 px; verse block max 42 ch on tablet and desktop, centered.<\/li>\n<li>Touch targets 48 × 48 minimum; 8 px between targets.<\/li>\n<li>Radius: button full, card 18, sheet 28, tab pill 36.<\/li>\n<li>Elevation by surface step, not shadows, except the floating tab pill.<\/li>\n<li>Use CSS logical properties (margin-inline-start) so RTL and LTR mirror correctly.<\/li>\n<\/ul>\n<\/section>\n\n<section class=\"card\" style=\"grid-column:span 2\">\n<h2 class=\"h\">Component states<\/h2>\n<div class=\"lab\">Primary button<\/div>\n<div style=\"display:flex;gap:18px;align-items:center\">\n<div class=\"st\"><div style=\"height:52px;padding:0 24px;border-radius:26px;background:#D4B06A;color:#141210;font:600 15px Inter;display:flex;align-items:center\">Listen<\/div><span>Default<\/span><\/div>\n<div class=\"st\"><div style=\"height:52px;padding:0 24px;border-radius:26px;background:#B8955A;color:#141210;font:600 15px Inter;display:flex;align-items:center;transform:scale(.97)\">Listen<\/div><span>Pressed<\/span><\/div>\n<div class=\"st\"><div style=\"height:52px;padding:0 24px;border-radius:26px;background:#D4B06A;color:#141210;font:600 15px Inter;display:flex;align-items:center;outline:2px solid #F2D58E;outline-offset:3px\">Listen<\/div><span>Focus-visible<\/span><\/div>\n<div class=\"st\"><div style=\"height:52px;padding:0 24px;border-radius:26px;border:1px dashed #7A7380;color:#BDB5A6;font:500 15px Inter;display:flex;align-items:center\">Audio offline<\/div><span>Disabled, labelled<\/span><\/div>\n<div class=\"st\"><div style=\"height:52px;padding:0 24px;border-radius:26px;background:#D4B06A;color:#141210;font:600 15px Inter;display:flex;align-items:center;gap:8px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 3a9 9 0 1 0 9 9\"><\/path><\/svg>Loading<\/div><span>Busy<\/span><\/div>\n<\/div>\n<div class=\"lab\" style=\"margin-top:6px\">Word token (every word in a verse)<\/div>\n<div style=\"display:flex;gap:28px;align-items:center\" lang=\"ar\">\n<div class=\"st\"><div class=\"ar\" style=\"font-size:30px\">وَالبَيْداءُ<\/div><span>Idle<\/span><\/div>\n<div class=\"st\"><div class=\"ar\" style=\"font-size:30px;outline:2px solid #F2D58E;outline-offset:4px;border-radius:6px\">وَالبَيْداءُ<\/div><span>Focus<\/span><\/div>\n<div class=\"st\"><div class=\"ar\" style=\"font-size:30px;color:#9C9588\">وَالبَيْداءُ<\/div><span>Not yet spoken<\/span><\/div>\n<div class=\"st\"><div class=\"ar\" style=\"font-size:30px;color:#D4B06A;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:10px\">وَالبَيْداءُ<\/div><span>Speaking<\/span><\/div>\n<div class=\"st\"><div class=\"ar\" style=\"font-size:30px;background:#211E27;border-radius:8px;padding:0 6px\">وَالبَيْداءُ<\/div><span>Open in sheet<\/span><\/div>\n<\/div>\n<div class=\"lab\" style=\"margin-top:6px\">Tab item<\/div>\n<div style=\"display:flex;gap:18px;align-items:center\">\n<div class=\"st\"><div style=\"width:76px;height:60px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9C9588;font:400 11px Jost;letter-spacing:.12em\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg>SAVED<\/div><span>Inactive<\/span><\/div>\n<div class=\"st\"><div style=\"width:76px;height:60px;border-radius:30px;background:#211E27;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#D4B06A;font:500 11px Jost;letter-spacing:.12em\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg>SAVED<\/div><span>Active: pill + fill + weight<\/span><\/div>\n<div class=\"st\"><div style=\"width:76px;height:60px;border-radius:30px;outline:2px solid #F2D58E;outline-offset:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9C9588;font:400 11px Jost;letter-spacing:.12em\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"><\/path><\/svg>SAVED<\/div><span>Focus<\/span><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2 class=\"h\">Motion<\/h2>\n<table>\n<thead><tr><th>Event<\/th><th>Spec<\/th><th>Reduce Motion<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Spoken word<\/td><td>color 0 ms, underline 120 ms ease-out<\/td><td>same, no glow<\/td><\/tr>\n<tr><td>Auto-scroll to line<\/td><td>300 ms, ease-in-out<\/td><td>jump<\/td><\/tr>\n<tr><td>Sheet open / close<\/td><td>240 / 180 ms, cubic-bezier(.2,.8,.2,1)<\/td><td>150 ms fade<\/td><\/tr>\n<tr><td>Toast<\/td><td>200 ms in, 4 s hold, undo keeps it<\/td><td>fade<\/td><\/tr>\n<tr><td>Skeleton<\/td><td>shown after 300 ms, 1.2 s shimmer<\/td><td>static<\/td><\/tr>\n<tr><td>Press<\/td><td>scale .97, 90 ms<\/td><td>color only<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/section>\n\n<section class=\"card\">\n<h2 class=\"h\">Accessibility and build notes<\/h2>\n<ul style=\"margin:0;padding-left:18px;font:400 13px/1.6 Inter;color:#D6CFC1\">\n<li>Each line is its own element with lang=\"ar\" dir=\"rtl\" or lang=\"en\"; screen readers switch voice per line.<\/li>\n<li>Verse is real text, never an image, so it can be selected, zoomed and translated.<\/li>\n<li>Words are buttons inside the line; arrow keys move between words, Enter opens the sheet.<\/li>\n<li>Sheets trap focus, close on Escape, and return focus to the word.<\/li>\n<li>Live regions: polite for loading and saves, assertive only for errors.<\/li>\n<li>PWA: service worker caches texts on view; audio only when downloaded.<\/li>\n<\/ul>\n<\/section>\n\n<section class=\"card\">\n<h2 class=\"h\">Content rules<\/h2>\n<ul style=\"margin:0;padding-left:18px;font:400 13px/1.6 Inter;color:#D6CFC1\">\n<li>Every poem carries a source edition and an editor-verified flag before it can publish.<\/li>\n<li>Tashkeel and translation are reviewed together; person and number must agree.<\/li>\n<li>AI text is always labelled, cites what it drew on, and can be reported.<\/li>\n<li>Errors: what happened, then what to do. Buttons are verbs.<\/li>\n<\/ul>\n<\/section>\n\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n"}}, "notes": {"title": {"x": 0, "y": -300, "text": "Poetry بالعربي · five redesign directions, each with its full user flow", "kind": "title1", "maxW": 2952, "page": "v1"}, "v2title": {"x": 0, "y": -300, "text": "Poetry بالعربي v2 · principal redesign, built from the original screen", "kind": "title1", "maxW": 2952, "page": "v2"}}};
const vp=document.getElementById('vp'),world=document.getElementById('world');
let page=(location.hash.slice(1)||DATA.pages[0].id),z=0.25,list=[];
const tabs=document.getElementById('tabs');
DATA.pages.forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.dataset.id=p.id;b.onclick=()=>{location.hash=p.id;show(p.id)};tabs.appendChild(b)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const f=e.target.querySelector('iframe');if(!f.srcdoc){f.srcdoc=DATA.boards[e.target.dataset.k].html}}}),{root:vp,rootMargin:'600px'});
function show(id){
  page=id;[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  world.innerHTML='';io.disconnect();
  const bs=Object.entries(DATA.boards).filter(([k,b])=>b.page===id);
  const ns=Object.entries(DATA.notes).filter(([k,n])=>n.page===id);
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  const ext=(x,y,w,h)=>{minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x+w);maxy=Math.max(maxy,y+h)};
  bs.forEach(([k,b])=>ext(b.x,b.y-40,b.w,b.h+40));ns.forEach(([k,n])=>ext(n.x,n.y,n.w||n.maxW||600,n.kind==='title1'?60:200));
  const ox=-minx+120,oy=-miny+120;world.style.width=(maxx-minx+240)+'px';world.style.height=(maxy-miny+240)+'px';
  list=bs.sort((a,b)=>a[1].y-b[1].y||a[1].x-b[1].x).map(([k])=>k);
  bs.forEach(([k,b])=>{
    const d=document.createElement('div');d.className='board';d.dataset.k=k;
    Object.assign(d.style,{left:b.x+ox+'px',top:b.y+oy+'px',width:b.w+'px',height:b.h+'px',borderRadius:(b.radius||0)+'px'});
    const f=document.createElement('iframe');f.title=b.title||k;f.style.width=b.w+'px';f.style.height=b.h+'px';d.appendChild(f);
    d.onclick=()=>open(k);world.appendChild(d);io.observe(d);
    const l=document.createElement('div');l.className='blabel';Object.assign(l.style,{left:b.x+ox+'px',top:b.y+oy-30+'px',width:b.w+'px'});l.textContent=b.title||k;world.appendChild(l);
  });
  ns.forEach(([k,n])=>{const d=document.createElement('div');
    if(n.kind==='title1'){d.className='title1';d.style.maxWidth=(n.maxW||2000)+'px'}else{d.className='sticky';d.style.width=(n.w||390)+'px'}
    Object.assign(d.style,{left:n.x+ox+'px',top:n.y+oy+'px'});d.textContent=n.text||'';world.appendChild(d)});
  fit();
}
function setZ(v){z=Math.max(0.05,Math.min(1.5,v));world.style.transform=`scale(${z})`;world.style.marginRight=world.style.marginBottom='0';
  document.getElementById('zl').textContent=Math.round(z*100)+'%';
  const w=parseFloat(world.style.width),h=parseFloat(world.style.height);
  world.parentElement.style.setProperty('--w',w*z);world.style.height=h+'px';
  world.style.marginBottom=(h*z-h)+'px';world.style.marginRight=(w*z-w)+'px'}
function fit(){const w=parseFloat(world.style.width);setZ(Math.min(0.6,vp.clientWidth/w));vp.scrollTo(0,0)}
document.getElementById('zi').onclick=()=>setZ(z*1.25);document.getElementById('zo').onclick=()=>setZ(z/1.25);document.getElementById('zf').onclick=fit;
vp.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZ(z*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
let dr=null;vp.addEventListener('mousedown',e=>{dr={x:e.clientX,y:e.clientY,sl:vp.scrollLeft,st:vp.scrollTop,m:false};vp.classList.add('drag')});
window.addEventListener('mousemove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(Math.abs(dx)+Math.abs(dy)>4)dr.m=true;vp.scrollLeft=dr.sl-dx;vp.scrollTop=dr.st-dy});
window.addEventListener('mouseup',()=>{vp.classList.remove('drag');setTimeout(()=>dr=null,0)});
world.addEventListener('click',e=>{if(dr&&dr.m)e.stopPropagation()},true);
const ov=document.getElementById('ov'),of=document.getElementById('of');let cur=null;
function open(k){cur=k;const b=DATA.boards[k];const s=Math.min(1,(innerWidth-140)/b.w,(innerHeight-90)/b.h);
  of.style.width=b.w+'px';of.style.height=b.h+'px';of.style.transform=`scale(${s})`;of.style.margin=`${(b.h*s-b.h)/2}px ${(b.w*s-b.w)/2}px`;
  of.srcdoc=b.html;document.getElementById('ot').textContent=b.title||k;ov.classList.add('on')}
function step(d){const i=list.indexOf(cur);if(i<0)return;open(list[(i+d+list.length)%list.length])}
document.getElementById('ox').onclick=()=>ov.classList.remove('on');document.getElementById('op').onclick=()=>step(-1);document.getElementById('on').onclick=()=>step(1);
window.addEventListener('keydown',e=>{if(!ov.classList.contains('on'))return;if(e.key==='Escape')ov.classList.remove('on');if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
show(DATA.pages.some(p=>p.id===page)?page:DATA.pages[0].id);
</script>
