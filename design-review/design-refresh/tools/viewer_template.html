<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poetry بالعربي · Design refresh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Josefin+Sans:wght@300;400;600&family=Reem+Kufi:wght@500&display=swap">
<style>
:root{--bg:#0A0A0D;--panel:#111015;--line:#2A2722;--gold:#D4B36A;--ivory:#F2EEE6;--mute:#A8A296}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1A1A1E;color:var(--ivory);font-family:'Josefin Sans',system-ui,sans-serif}
header{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
header h1{margin:0;font:500 20px 'Cormorant Garamond',serif;white-space:nowrap}
header h1 span{font-family:'Reem Kufi',sans-serif;color:var(--gold);font-size:17px}
nav{display:flex;gap:6px;overflow-x:auto;flex:1}
nav button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:16px;height:32px;padding:0 14px;font:400 12px 'Josefin Sans';letter-spacing:.08em;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--gold);color:#17140D;border-color:var(--gold);font-weight:600}
.zoom{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--mute)}
.zoom button{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--gold);cursor:pointer;font-size:16px}
#vp{position:fixed;inset:56px 0 0 0;overflow:auto;cursor:grab}
#vp.drag{cursor:grabbing}
#world{position:relative;transform-origin:0 0}
.board{position:absolute;background:#0A0A0D;box-shadow:0 2px 14px rgba(0,0,0,.45);overflow:hidden;cursor:zoom-in}
.board iframe{border:0;width:100%;height:100%;pointer-events:none;display:block}
.blabel{position:absolute;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title1{position:absolute;font:500 44px 'Cormorant Garamond',serif;color:var(--ivory);white-space:nowrap}
.sticky{position:absolute;background:#26252B;color:#D9D4CA;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap}
#ov{position:fixed;inset:0;background:rgba(5,5,7,.92);display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#ov.on{display:flex}
#ov .t{font-size:14px;color:var(--mute);max-width:90vw;text-align:center}
#ov iframe{border:0;background:#0A0A0D;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#ov .x{position:absolute;top:14px;right:18px;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--gold);font-size:18px;cursor:pointer}
#ov .nv{position:absolute;top:50%;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--gold);font-size:20px;cursor:pointer}
</style>
</head>
<body>
<header><h1>Poetry <span>بالعربي</span> · design refresh</h1><nav id="tabs"></nav>
<div class="zoom"><button id="zo" title="Zoom out">−</button><span id="zl">25%</span><button id="zi" title="Zoom in">+</button><button id="zf" title="Fit" style="width:auto;padding:0 10px;font-size:11px;letter-spacing:.1em">FIT</button></div></header>
<div id="vp"><div id="world"></div></div>
<div id="ov"><button class="x" id="ox">✕</button><button class="nv" id="op" style="left:18px">‹</button><button class="nv" id="on" style="right:18px">›</button><div class="t" id="ot"></div><iframe id="of"></iframe></div>
<script>
const DATA=/*__DATA__*/null;
const vp=document.getElementById('vp'),world=document.getElementById('world');
let page=(location.hash.slice(1)||DATA.pages[0].id),z=0.25,list=[];
const tabs=document.getElementById('tabs');
DATA.pages.forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.dataset.id=p.id;b.onclick=()=>{location.hash=p.id;show(p.id)};tabs.appendChild(b)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const f=e.target.querySelector('iframe');if(!f.srcdoc){f.srcdoc=DATA.boards[e.target.dataset.k].html}}}),{root:vp,rootMargin:'600px'});
function show(id){
  page=id;[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  world.innerHTML='';io.disconnect();
  const bs=Object.entries(DATA.boards).filter(([k,b])=>b.page===id);
  const ns=Object.entries(DATA.notes).filter(([k,n])=>n.page===id);
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  const ext=(x,y,w,h)=>{minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x+w);maxy=Math.max(maxy,y+h)};
  bs.forEach(([k,b])=>ext(b.x,b.y-40,b.w,b.h+40));ns.forEach(([k,n])=>ext(n.x,n.y,n.w||n.maxW||600,n.kind==='title1'?60:200));
  const ox=-minx+120,oy=-miny+120;world.style.width=(maxx-minx+240)+'px';world.style.height=(maxy-miny+240)+'px';
  list=bs.sort((a,b)=>a[1].y-b[1].y||a[1].x-b[1].x).map(([k])=>k);
  bs.forEach(([k,b])=>{
    const d=document.createElement('div');d.className='board';d.dataset.k=k;
    Object.assign(d.style,{left:b.x+ox+'px',top:b.y+oy+'px',width:b.w+'px',height:b.h+'px',borderRadius:(b.radius||0)+'px'});
    const f=document.createElement('iframe');f.title=b.title||k;f.style.width=b.w+'px';f.style.height=b.h+'px';d.appendChild(f);
    d.onclick=()=>open(k);world.appendChild(d);io.observe(d);
    const l=document.createElement('div');l.className='blabel';Object.assign(l.style,{left:b.x+ox+'px',top:b.y+oy-30+'px',width:b.w+'px'});l.textContent=b.title||k;world.appendChild(l);
  });
  ns.forEach(([k,n])=>{const d=document.createElement('div');
    if(n.kind==='title1'){d.className='title1';d.style.maxWidth=(n.maxW||2000)+'px'}else{d.className='sticky';d.style.width=(n.w||390)+'px'}
    Object.assign(d.style,{left:n.x+ox+'px',top:n.y+oy+'px'});d.textContent=n.text||'';world.appendChild(d)});
  fit();
}
function setZ(v){z=Math.max(0.05,Math.min(1.5,v));world.style.transform=`scale(${z})`;world.style.marginRight=world.style.marginBottom='0';
  document.getElementById('zl').textContent=Math.round(z*100)+'%';
  const w=parseFloat(world.style.width),h=parseFloat(world.style.height);
  world.parentElement.style.setProperty('--w',w*z);world.style.height=h+'px';
  world.style.marginBottom=(h*z-h)+'px';world.style.marginRight=(w*z-w)+'px'}
function fit(){const w=parseFloat(world.style.width);setZ(Math.min(0.6,vp.clientWidth/w));vp.scrollTo(0,0)}
document.getElementById('zi').onclick=()=>setZ(z*1.25);document.getElementById('zo').onclick=()=>setZ(z/1.25);document.getElementById('zf').onclick=fit;
vp.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZ(z*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
let dr=null;vp.addEventListener('mousedown',e=>{dr={x:e.clientX,y:e.clientY,sl:vp.scrollLeft,st:vp.scrollTop,m:false};vp.classList.add('drag')});
window.addEventListener('mousemove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(Math.abs(dx)+Math.abs(dy)>4)dr.m=true;vp.scrollLeft=dr.sl-dx;vp.scrollTop=dr.st-dy});
window.addEventListener('mouseup',()=>{vp.classList.remove('drag');setTimeout(()=>dr=null,0)});
world.addEventListener('click',e=>{if(dr&&dr.m)e.stopPropagation()},true);
const ov=document.getElementById('ov'),of=document.getElementById('of');let cur=null;
function open(k){cur=k;const b=DATA.boards[k];const s=Math.min(1,(innerWidth-140)/b.w,(innerHeight-90)/b.h);
  of.style.width=b.w+'px';of.style.height=b.h+'px';of.style.transform=`scale(${s})`;of.style.margin=`${(b.h*s-b.h)/2}px ${(b.w*s-b.w)/2}px`;
  of.srcdoc=b.html;document.getElementById('ot').textContent=b.title||k;ov.classList.add('on')}
function step(d){const i=list.indexOf(cur);if(i<0)return;open(list[(i+d+list.length)%list.length])}
document.getElementById('ox').onclick=()=>ov.classList.remove('on');document.getElementById('op').onclick=()=>step(-1);document.getElementById('on').onclick=()=>step(1);
window.addEventListener('keydown',e=>{if(!ov.classList.contains('on'))return;if(e.key==='Escape')ov.classList.remove('on');if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
show(DATA.pages.some(p=>p.id===page)?page:DATA.pages[0].id);
</script>
</body>
</html>
