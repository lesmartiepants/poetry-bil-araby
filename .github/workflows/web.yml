name: web (ReDesign2)

on:
  # Pushes only on main; a PR is covered by pull_request (otherwise every push to a PR branch ran twice).
  push:
    branches: [main]
    paths: ['web/**', 'server.js', 'server/**', 'supabase/**', 'scripts/db-*.sh', 'package.json', 'package-lock.json', 'design-review/design-refresh/canvas/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'server.js', 'server/**', 'supabase/**', 'scripts/db-*.sh', 'package.json', 'package-lock.json', 'design-review/design-refresh/canvas/**', '.github/workflows/web.yml']

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Typecheck, lint, unit, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run tokens
      - run: npm run typecheck
      - run: npm run check:features
      - run: npm run lint
      - run: npm test
      - run: npm run build

  journeys:
    name: Journey tests (mock data)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run tokens
      - run: npm run test:journeys -- --trace off
      # Advisory, never gating: fonts and data differ from the frames. Review the contact sheet per slice.
      - name: Mock QA contact sheet
        if: always()
        continue-on-error: true
        run: npm run qa:mocks
      # Advisory: every screen in its loading, error, empty, signed in/out, kept and progress states.
      - name: State QA
        if: always()
        continue-on-error: true
        run: npm run qa:states
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-qa
          path: web/qa/out
          retention-days: 14

  live-smoke:
    name: Journey tests (live, local server + Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: qafiyah }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qafiyah
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qafiyah?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Server deps
        working-directory: .
        run: npm ci
      - name: Database schema and seed
        working-directory: .
        run: npm run db:setup && npm run db:seed && psql "$LOCAL_DATABASE_URL" -q -f web/journeys/live-seed.sql
      - name: Database rules (keeps, lists, reads)
        working-directory: .
        run: psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/redesign2_rules.sql
      - name: Start API
        working-directory: .
        env: { TTS_FAKE: '1' } # recitation returns a quiet tone: no Gemini key in CI
        run: node server.js > /tmp/server.log 2>&1 &
      - run: npm ci && npx playwright install --with-deps chromium && npm run tokens
      - name: Live journeys (only domains already live)
        # No --pass-with-no-tests: a grep that matches nothing must fail, not pass silently.
        run: npm run test:journeys:live -- --trace off

  live-supabase:
    # The @live @supabase journeys: per-user data through real Supabase auth, RLS and triggers
    # (keeps and lists across devices, settings, follows and reads, journey progress, isolation).
    # Advisory until it has been green on a few runs; then drop continue-on-error.
    name: Journey tests (live, local Supabase auth + RLS)
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1 # same pin as deploy.yml
      - name: Start local Supabase (applies supabase/migrations)
        working-directory: .
        run: supabase start -x studio,imgproxy,edge-runtime,functions,analytics,vector,realtime,storage,inbucket
      - name: Server deps
        working-directory: .
        run: npm ci
      - run: npm ci && npx playwright install --with-deps chromium && npm run tokens
      - name: Supabase journeys
        run: scripts/live-supabase.sh --grep @supabase --trace off
      - name: API log
        if: failure()
        run: tail -n 200 /tmp/redesign2-api.log || true
