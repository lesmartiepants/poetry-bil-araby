<style>
:root{--bg:#0A0A0D;--panel:#111015;--line:#2A2722;--gold:#D4B36A;--ivory:#F2EEE6;--mute:#A8A296}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1A1A1E;color:var(--ivory);font-family:'Josefin Sans',system-ui,sans-serif}
header{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
header h1{margin:0;font:500 20px 'Cormorant Garamond',serif;white-space:nowrap}
header h1 span{font-family:'Reem Kufi',sans-serif;color:var(--gold);font-size:17px}
nav{display:flex;gap:6px;overflow-x:auto;flex:1}
nav button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:16px;height:32px;padding:0 14px;font:400 12px 'Josefin Sans';letter-spacing:.08em;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--gold);color:#17140D;border-color:var(--gold);font-weight:600}
.zoom{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--mute)}
.zoom button{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--gold);cursor:pointer;font-size:16px}
#vp{position:fixed;inset:56px 0 0 0;overflow:auto;cursor:grab}
#vp.drag{cursor:grabbing}
#world{position:relative;transform-origin:0 0}
.board{position:absolute;background:#0A0A0D;box-shadow:0 2px 14px rgba(0,0,0,.45);overflow:hidden;cursor:zoom-in}
.board iframe{border:0;width:100%;height:100%;pointer-events:none;display:block}
.blabel{position:absolute;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title1{position:absolute;font:500 44px 'Cormorant Garamond',serif;color:var(--ivory);white-space:nowrap}
.sticky{position:absolute;background:#26252B;color:#D9D4CA;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap}
#ov{position:fixed;inset:0;background:rgba(5,5,7,.92);display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#ov.on{display:flex}
#ov .t{font-size:14px;color:var(--mute);max-width:90vw;text-align:center}
#ov iframe{border:0;background:#0A0A0D;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#ov .x{position:absolute;top:14px;right:18px;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--gold);font-size:18px;cursor:pointer}
#ov .nv{position:absolute;top:50%;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--gold);font-size:20px;cursor:pointer}
</style>

r:1px solid transparent;background:transparent;color:#A8A296;font-size:11px;letter-spacing:0.14em\">LANGUAGE<\/button>\n<\/div>\n<span aria-hidden=\"true\" style=\"width:44px\"><\/span>\n<\/header>\n\n<main style=\"padding:26px 24px 0 18px;display:flex;flex-direction:column;gap:14px\">\n\n<div style=\"display:flex;align-items:flex-start;gap:12px\">\n<button aria-label=\"Note 1, open\" aria-expanded=\"true\" style=\"flex:none;width:28px;height:28px;margin-top:10px;border-radius:14px;border:none;background:#D4B36A;color:#17140D;font-size:12px;font-weight:600\">1<\/button>\n<div style=\"flex:1;min-width:0;text-align:right\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:26px;line-height:1.6;color:#F2EEE6\">أَمُرُّ عَلى <span style=\"border-bottom:1.5px solid #D4B36A;padding-bottom:2px\">الدِيارِ دِيارِ<\/span> لَيلى<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#BDB6A8\">I pass by the dwellings, Layla's dwellings,<\/p>\n<\/div>\n<\/div>\n\n<aside style=\"margin-left:40px;padding:14px 16px;border-left:1px solid #D4B36A;background:#121116;border-radius:0 12px 12px 0\">\n<p style=\"margin:0;font-size:10px;letter-spacing:0.2em;color:#D4B36A\">AL-ATLAL · THE RUINED CAMP<\/p>\n<p style=\"margin:8px 0 0;font-family:'Cormorant Garamond',serif;font-size:17px;line-height:1.45;color:#E4DED2\">Pausing at an abandoned dwelling is the oldest opening in Arabic verse, inherited from the pre-Islamic odes. Majnun takes the convention and makes it a single, obsessive walk.<\/p>\n<div style=\"display:flex;gap:16px;margin-top:10px;font-size:12px;letter-spacing:0.08em\">\n<a href=\"#\" style=\"color:#D4B36A\">Read the ode it echoes<\/a>\n<a href=\"#\" style=\"color:#A8A296\">Collapse<\/a>\n<\/div>\n<\/aside>\n\n<div style=\"display:flex;align-items:flex-start;gap:12px\">\n<span aria-hidden=\"true\" style=\"flex:none;width:28px\"><\/span>\n<div style=\"flex:1;min-width:0;text-align:right\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:26px;line-height:1.6;color:#F2EEE6\">أُقَبِّلُ ذا الجِدارَ وَذا الجِدارا<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#BDB6A8\">and kiss this wall, and then that wall.<\/p>\n<\/div>\n<\/div>\n\n<div style=\"display:flex;align-items:flex-start;gap:12px\">\n<span aria-hidden=\"true\" style=\"flex:none;width:28px\"><\/span>\n<div style=\"flex:1;min-width:0;text-align:right\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:26px;line-height:1.6;color:#F2EEE6\">وَما حُبُّ الدِيارِ شَغَفنَ قَلبي<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#BDB6A8\">It is not love of the dwellings that took my heart,<\/p>\n<\/div>\n<\/div>\n\n<div style=\"display:flex;align-items:flex-start;gap:12px\">\n<button aria-label=\"Note 2\" aria-expanded=\"false\" style=\"flex:none;width:28px;height:28px;margin-top:10px;border-radius:14px;border:1px solid #D4B36A;background:transparent;color:#D4B36A;font-size:12px\">2<\/button>\n<div style=\"flex:1;min-width:0;text-align:right\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:26px;line-height:1.6;color:#F2EEE6\">وَلَكِن حُبُّ <span style=\"border-bottom:1.5px dashed #8A7442;padding-bottom:2px\">مَن سَكَنَ<\/span> الدِيارا<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#BDB6A8\">but love of the one who lived in them.<\/p>\n<\/div>\n<\/div>\n<\/main>\n\n<form style=\"position:absolute;left:16px;right:16px;bottom:30px;height:56px;border-radius:28px;background:#16151B;border:1px solid #2E2A22;display:flex;align-items:center;padding:0 6px 0 18px;gap:10px\">\n<svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 ight:84px;border-radius:12px;background:#EFE6D2\"><\/div><p style=\"margin:0;font-size:13px\">Parchment <span lang=\"ar\" style=\"font-family:Amiri,serif;color:#D4B36A\">رَقّ<\/span><\/p><p style=\"margin:0;font-size:11px;color:#A8A296\">#EFE6D2 · light mode<\/p><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:84px;border-radius:12px;background:#4A1620\"><\/div><p style=\"margin:0;font-size:13px\">Pomegranate <span lang=\"ar\" style=\"font-family:Amiri,serif;color:#D4B36A\">رمّان<\/span><\/p><p style=\"margin:0;font-size:11px;color:#A8A296\">#4A1620 · love poems<\/p><\/div>\n<\/div>\n\n<div style=\"margin-top:auto;padding-top:20px;border-top:1px solid #2A2722\">\n<p style=\"margin:0 0 12px;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">CONTRAST, WCAG 2.2<\/p>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n<span style=\"height:34px;line-height:34px;padding:0 14px;border-radius:17px;background:#0A0A0D;border:1px solid #2E2A22;font-size:13px;color:#F2EEE6\">Ivory on Midnight 17.1 : 1<\/span>\n<span style=\"height:34px;line-height:34px;padding:0 14px;border-radius:17px;background:#0A0A0D;border:1px solid #2E2A22;font-size:13px;color:#D4B36A\">Gold on Midnight 9.8 : 1<\/span>\n<span style=\"height:34px;line-height:34px;padding:0 14px;border-radius:17px;background:#0A0A0D;border:1px solid #2E2A22;font-size:13px;color:#A8A296\">Ash on Midnight 7.8 : 1<\/span>\n<span style=\"height:34px;line-height:34px;padding:0 14px;border-radius:17px;background:#D4B36A;font-size:13px;color:#17140D\">Ink on Gold 9.2 : 1<\/span>\n<span style=\"height:34px;line-height:34px;padding:0 14px;border-radius:17px;background:#EFE6D2;font-size:13px;color:#2A2216\">Ink on Parchment 12.6 : 1<\/span>\n<span style=\"height:34px;line-height:34px;padding:0 14px;border-radius:17px;background:#0A0A0D;border:1px dashed #8A7442;font-size:13px;color:#A8A296\">Old gold 4.4 : 1, never for text<\/span>\n<\/div>\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "BrandType.dc.html": {"x": 1160, "y": 2404, "w": 1080, "h": 720, "title": "B5 · Typography", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Typography<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1080px;height:720px;box-sizing:border-box;padding:48px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px\">\n<h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px\">Typography<\/h1>\n<span style=\"font-size:12px;letter-spacing:0.22em;color:#A8A296\">BRAND · 05<\/span>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) 220px;align-items:center;gap:24px;padding:16px 0;border-top:1px solid #2A2722\">\n<div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">DISPLAY · ARABIC<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#F2EEE6\">Aref Ruqaa Bold<\/p><\/div>\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:'Aref Ruqaa',serif;font-weight:700;font-size:64px;line-height:1.2;color:#D4B36A;text-align:right\">أمرُّ على الديار<\/p>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Poem titles and the logo only. 40 to 64px. Never for verse.<\/p>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) 220px;align-items:center;gap:24px;padding:16px 0;border-top:1px solid #2A2722\">\n<div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">VERSE · ARABIC<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#F2EEE6\">Amiri Regular<\/p><\/div>\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:34px;line-height:1.7;color:#F2EEE6;text-align:right\">وَما حُبُّ الدِيارِ شَغَفنَ قَلبي<\/p>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Naskh with full vowel marks. 27px, line height 1.6 so marks never collide.<\/p>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) 220px;align-items:center;gap:24px;padding:16px 0;border-top:1px solid #2A2722\">\n<div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">VERSE · ENGLISH<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#F2EEE6\">Cormorant Garamond Italic<\/p><\/div>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;line-height:1.4;color:#BDB6A8;text-align:right\">It is not love of the dwellings that took my heart<\/p>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Set about two-thirds the Arabic size so the translation reads as a gloss, not a rival.<\/p>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) 220px;align-items:center;gap:24px;padding:16px 0;border-top:1px solid #2A2722\">\n<div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">INTERFACE<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#F2EEE6\">Josefin Sans 400 / 600<\/p><\/div>\n<div style=\"display:flex;gap:28px;align-items:baseline;justify-content:flex-end\"><span style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;color:#D4B36A\">LISTEN · INSIGHTS<\/span><span style=\"font-size:15px;color:#F2EEE6\">Recited by a native voice<\/span><\/div>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Caps with 0.14em tracking for actions, sentence case for everything else.<\/p>\n<\/div>\n\n<div style=\"margin-top:auto;padding:16px 20px;border-radius:12px;background:#111015;border:1px solid #2A2722;font-size:14px;line-height:1.5;color:#BDB6A8\">\n<span style=\"color:#D4B36A\">Rule of hierarchy:<\/span> Arabic always leads in size, weight and position. English is italic and quieter. Interface type stays out of the verse area.\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "BrandPattern.dc.html": {"x": 2320, "y": 2404, "w": 1080, "h": 720, "title": "B6 · Pattern, ornament & voice", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Pattern, ornament and voice<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1080px;height:720px;box-sizing:border-box;padding:48px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n<h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px\">Pattern, ornament & voice<\/h1>\n<span style=\"font-size:12px;letter-spacing:0.22em;color:#A8A296\">BRAND · 06<\/span>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:340px minmax(0,1fr);gap:40px;flex:1\">\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"height:300px;border-radius:14px;overflow:hidden;border:1px solid #2A2722;position:relative;background:#0E0D12\">\n<svg role=\"img\" aria-label=\"Eight-point star pattern\" width=\"340\" height=\"300\"><defs><pattern id=\"bp\" width=\"68\" height=\"68\" patternUnits=\"userSpaceOnUse\"><g fill=\"none\" stroke=\"#4A5580\" stroke-width=\"1.2\"><rect x=\"17\" y=\"17\" width=\"34\" height=\"34\"><\/rect><rect x=\"17\" y=\"17\" width=\"34\" height=\"34\" transform=\"rotate(45 34 34)\"><\/rect><path d=\"M0 34h10M58 34h10M34 0v10M34 58v10\"><\/path><\/g><\/pattern><\/defs><rect width=\"340\" height=\"300\" fill=\"url(#bp)\"><\/rect><\/svg>\n<span style=\"position:absolute;left:16px;bottom:14px;font-size:11px;letter-spacing:0.18em;color:#A8A296;background:#0E0D12;padding:4px 8px;border-radius:6px\">KHATAM PATTERN · 30–40% OPACITY<\/span>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">ORNAMENTS<\/p>\n<div style=\"display:flex;align-items:center;gap:28px\">\n<svg role=\"img\" aria-label=\"Star divider\" width=\"64\" height=\"20\" viewBox=\"0 0 64 20\"><path d=\"M0 10h22M42 10h22\" stroke=\"#8A7442\" stroke-width=\"1\"><\/path><g fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.2\"><rect x=\"26\" y=\"4\" width=\"12\" height=\"12\"><\/rect><rect x=\"26\" y=\"4\" width=\"12\" height=\"12\" transform=\"rotate(45 32 10)\"><\/rect><\/g><\/svg>\n<svg role=\"img\" aria-label=\"Hemistich separator\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><path d=\"M10 4l6 6-6 6-6-6z\" fill=\"#D4B36A\"><\/path><\/svg>\n<svg role=\"img\" aria-label=\"Verse number medallion\" width=\"32\" height=\"32\" viewBox=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"13\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.2\"><\/circle><text x=\"16\" y=\"21\" text-anchor=\"middle\" font-family=\"Amiri\" font-size=\"14\" fill=\"#D4B36A\">٣<\/text><\/svg>\n<\/div>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Pattern fades in from the top edge and never sits behind verse text.<\/p>\n<\/div>\n<\/div>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">VOICE<\/p>\n\n<div style=\"padding:16px 18px;border-radius:12px;background:#111015;border:1px solid #2A2722\">\n<p style=\"margin:0;font-size:16px;color:#F2EEE6\">The verse speaks first.<\/p>\n<p style=\"margin:6px 0 0;font-size:13px;line-height:1.5;color:#A8A296\">The interface whispers. No badges, counters or alerts on top of a poem.<\/p>\n<\/div>\n\n<div style=\"padding:16px 18px;border-radius:12px;background:#111015;border:1px solid #2A2722\">\n<p style=\"margin:0;font-size:16px;color:#F2EEE6\">Translate the feeling, not only the words.<\/p>\n<p style=\"margin:8px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:#D4B36A\">Yes: “It is not love of the dwellings that took my heart.”<\/p>\n<p style=\"margin:2px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:#A8A296\">No: “Love of houses did not affect my heart.”<\/p>\n<\/div>\n\n<div style=\"padding:16px 18px;border-radius:12px;background:#111015;border:1px solid #2A2722\">\n<p style=\"margin:0;font-size:16px;color:#F2EEE6\">Explain like a friend in the majlis, not a textbook.<\/p>\n<p style=\"margin:8px 0 0;font-size:13px;color:#D4B36A\">Yes: “Majnun takes an old convention and makes it an obsession.”<\/p>\n<p style=\"margin:2px 0 0;font-size:13px;color:#A8A296\">No: “This poem utilizes the atlal motif.”<\/p>\n<\/div>\n\n<div style=\"padding:16px 18px;border-radius:12px;background:#111015;border:1px solid #2A2722\">\n<p style=\"margin:0;font-size:16px;color:#F2EEE6\">Never rush the reader.<\/p>\n<p style=\"margin:8px 0 0;font-size:13px;color:#D4B36A\">Yes: “That's today's seven. More tomorrow.”<\/p>\n<p style=\"margin:2px 0 0;font-size:13px;color:#A8A296\">No: “Don't lose your streak!”<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "Marks.dc.html": {"x": 0, "y": 3544, "w": 1440, "h": 820, "title": "M1 · Mark finalists", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Mark finalists<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,5 68 Q880.00 596.88 896.00 609.68 Q876.91 617.14 880.00 637.39 Q883.09 657.65 864.00 665.11 Q867.09 644.85 848.00 637.39 Q828.91 629.94 832.00 609.68 Z\" fill=\"#EDE3CF\"><\/path><\/svg><\/div><div style=\"display:flex;flex-direction:column;gap:20px;flex:1\"><div style=\"height:200px;border-radius:16px;background:#22406E;display:flex;align-items:center;justify-content:center\"><svg role=\"img\" aria-label=\"Pajarita mark\" width=\"150\" height=\"150\" viewBox=\"0 0 120 120\"><path d=\"M60.00 16.00 Q54.28 44.68 82.00 54.00 Q109.72 63.32 104.00 92.00 Q82.00 72.64 60.00 92.00 Q38.00 111.36 16.00 92.00 Q43.72 82.68 38.00 54.00 Q32.28 25.32 60.00 16.00 Z\" fill=\"#EDE3CF\"><\/path><circle cx=\"60\" cy=\"40\" r=\"4.0\" fill=\"#22406E\"><\/circle><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">FROM A3<\/p><p style=\"margin:0;font-size:14px;line-height:1.5;color:#BDB6A8\">A brand pattern, not a logo: backgrounds for onboarding, share cards, packaging and the App Store hero. Every curved edge is shared by two birds, so the pattern tiles endlessly at any scale.<\/p><\/div><\/div><\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "Fused.dc.html": {"x": 0, "y": 5924, "w": 1440, "h": 900, "title": "F1 · One name, two languages", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Fused bilingual names<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Reem+Kufi:wght@500;700&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1440px;height:900px;box-sizing:border-box;padding:48px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:26px\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:42px\">One name, two languages<\/h1><span style=\"font-size:12px;letter-spacing:0.22em;color:#A8A296\">BILINGUAL · 01<\/span><\/div><div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;flex:1\"><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:96px;color:#F2EEE6;line-height:1\">Shi<span lang=\"ar\" style=\"font-family:Amiri,serif;font-weight:700;color:#D4B36A;font-size:92px\">ع<\/span>r<\/span><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">01 · EMBEDDED LETTER<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">One word, two scripts. The Arabic letter ʿayn stands in for the sound English cannot spell.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> English readers may not know how to say it at first. Pair with a tagline.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:88px;letter-spacing:0.04em;color:#F2EEE6;line-height:1\">sh<span style=\"color:#D4B36A\">3<\/span>r<\/span><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">02 · ARABIZI<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">How Arabs type Arabic in Latin letters on phones: 3 stands for ع. Instantly native to young bilinguals.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Reads as casual texting. Fights the classical tone.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><div style=\"display:flex;align-items:baseline;gap:18px\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:86px;color:#F2EEE6;line-height:1\">bayt<\/span><span lang=\"ar\" style=\"font-family:Amiri,serif;font-weight:700;font-size:80px;color:#D4B36A;line-height:1\">بيت<\/span><\/div><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">03 · ONE WORD, TWO MEANINGS<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">In Arabic, bayt means both a house and a line of verse. Brand story: a home for Arabic poetry.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Bayt.com is a large Middle East job site. Name clash risk.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><div style=\"display:flex;align-items:baseline;gap:18px\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:84px;color:#F2EEE6;line-height:1\">Dīwān<\/span><span lang=\"ar\" style=\"font-family:Amiri,serif;font-weight:700;font-size:74px;color:#D4B36A;line-height:1\">ديوان<\/span><\/div><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">04 · SHARED WORD<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">Already lives in both languages: a poet's collected works, and Goethe's West-Eastern Divan.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Widely used by restaurants and cafés. Hard to own.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span lang=\"ar\" style=\"font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:70px;color:#D4B36A;line-height:1.1\">شعر<\/span><span style=\"width:150px;height:2px;background:#8A7442\"><\/span><span style=\"font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:44px;letter-spacing:0.18em;color:#F2EEE6;line-height:1\">SHIʿR<\/span><\/div><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">05 · ONE TYPE SYSTEM<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">Arabic and Latin drawn in the same geometric Kufi, same width, same weight. Reads as one wordmark.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Needs custom lettering to get the shared strokes right.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><div style=\"display:flex;align-items:center;gap:20px\"><span style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:58px;color:#F2EEE6;line-height:1\">verse<\/span><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M10 2l8 8-8 8-8-8z\" fill=\"#D4B36A\"><\/path><\/svg><span lang=\"ar\" style=\"font-family:Amiri,serif;font-weight:700;font-size:58px;color:#D4B36A;line-height:1\">شعر<\/span><\/div><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">06 · VERSE AS LOGO<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">The name is set like a single line of classical poetry: two halves, one caesura, two languages.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Closest to two words side by side. Works better as a tagline style.<\/p><\/div><\/div><\/div><\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "LockupL1.dc.html": {"x": 0, "y": 7244, "w": 1080, "h": 720, "title": "L1 · Ruq'ah lead · Khatam seal", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Ruq'ah lead · Khatam seal<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Reem+Kufi:wght@500;700&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1080px;height:720px;box-sizing:border-box;padding:44px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:22px\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px\">Ruq'ah lead · Khatam seal<\/h1><span style=\"font-size:12px;letter-spacing:0.22em;color:#A 56 / 33.5 px), so it starts and ends with the Arabic. Lock as outlined vector.<\/p><\/div><div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">CLEAR SPACE<\/p><p style=\"margin:6px 0 0;font-size:13px;line-height:1.45;color:#BDB6A8\">Keep the height of the Arabic line empty on every side of the lockup.<\/p><\/div><div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">MINIMUM<\/p><p style=\"margin:6px 0 0;font-size:13px;line-height:1.45;color:#BDB6A8\">B1h 140 px wide; below 120 px switch English to Josefin Light; below 80 px use the mark alone.<\/p><\/div><div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">COLOR<\/p><p style=\"margin:6px 0 0;font-size:13px;line-height:1.45;color:#BDB6A8\">Gold #D4B36A on Midnight #0A0A0D · Ivory #EDE3CF + light gold #E8CC8A on Cobalt #22406E · Ink #2A2216 + old gold #7A5C22 on Parchment #EFE6D2.<\/p><\/div><\/div><\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}}, "notes": {"n1": {"x": 0, "y": -300, "text": "App screens", "kind": "title1", "maxW": 1800, "page": "main"}, "n2": {"x": 0, "y": 964, "text": "Identity", "kind": "title1", "maxW": 2240, "page": "main"}, "n3": {"x": 0, "y": 2104, "text": "Brand system", "kind": "title1", "maxW": 3400, "page": "main"}, "n4": {"x": 0, "y": 3244, "text": "Mark & icon finalists", "kind": "title1", "maxW": 2960, "page": "main"}, "n5": {"x": 0, "y": 4484, "text": "Pattern & geometry", "kind": "title1", "maxW": 2240, "page": "main"}, "n6": {"x": 0, "y": 5624, "text": "Naming", "kind": "title1", "maxW": 1440, "page": "main"}, "n7": {"x": 0, "y": 6944, "text": "Lockup explorations", "kind": "title1", "maxW": 3400, "page": "main"}, "n8": {"x": 0, "y": 8924, "text": "Ruq'ah lockups", "kind": "title1", "maxW": 2960, "page": "main"}, "n9": {"x": 0, "y": 10344, "text": "Top three marks", "kind": "title1", "maxW": 4480, "page": "main"}, "ap0": {"x": 0, "y": 11664, "text": "Khatam seal in the app", "kind": "title1", "maxW": 1330, "page": "main"}, "ap1": {"x": 0, "y": 12928, "text": "Seven heavens in the app", "kind": "title1", "maxW": 1330, "page": "main"}, "ap2": {"x": 0, "y": 14192, "text": "Interlace in the app", "kind": "title1", "maxW": 1330, "page": "main"}, "bi": {"x": 0, "y": 15456, "text": "English in the brand · round 2", "kind": "title1", "maxW": 4300, "page": "main"}, "roles": {"x": 0, "y": 18496, "text": "Brand vs poem title · separating the voices", "kind": "title1", "maxW": 3790, "page": "main"}, "r3": {"x": 0, "y": 19760, "text": "English in the brand · round 3", "kind": "title1", "maxW": 2960, "page": "main"}, "typ": {"x": 0, "y": 21360, "text": "English typeface studies", "kind": "title1", "maxW": 4480, "page": "main"}, "r4": {"x": 0, "y": 22960, "text": "Finalist · round 4", "kind": "title1", "maxW": 1440, "page": "main"}, "final": {"x": 0, "y": 24640, "text": "Final", "kind": "title1", "maxW": 1440, "page": "main"}}};
const vp=document.getElementById('vp'),world=document.getElementById('world');
let page=(location.hash.slice(1)||DATA.pages[0].id),z=0.25,list=[];
const tabs=document.getElementById('tabs');
DATA.pages.forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.dataset.id=p.id;b.onclick=()=>{location.hash=p.id;show(p.id)};tabs.appendChild(b)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const f=e.target.querySelector('iframe');if(!f.srcdoc){f.srcdoc=DATA.boards[e.target.dataset.k].html}}}),{root:vp,rootMargin:'600px'});
function show(id){
  page=id;[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  world.innerHTML='';io.disconnect();
  const bs=Object.entries(DATA.boards).filter(([k,b])=>b.page===id);
  const ns=Object.entries(DATA.notes).filter(([k,n])=>n.page===id);
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  const ext=(x,y,w,h)=>{minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x+w);maxy=Math.max(maxy,y+h)};
  bs.forEach(([k,b])=>ext(b.x,b.y-40,b.w,b.h+40));ns.forEach(([k,n])=>ext(n.x,n.y,n.w||n.maxW||600,n.kind==='title1'?60:200));
  const ox=-minx+120,oy=-miny+120;world.style.width=(maxx-minx+240)+'px';world.style.height=(maxy-miny+240)+'px';
  list=bs.sort((a,b)=>a[1].y-b[1].y||a[1].x-b[1].x).map(([k])=>k);
  bs.forEach(([k,b])=>{
    const d=document.createElement('div');d.className='board';d.dataset.k=k;
    Object.assign(d.style,{left:b.x+ox+'px',top:b.y+oy+'px',width:b.w+'px',height:b.h+'px',borderRadius:(b.radius||0)+'px'});
    const f=document.createElement('iframe');f.title=b.title||k;f.style.width=b.w+'px';f.style.height=b.h+'px';d.appendChild(f);
    d.onclick=()=>open(k);world.appendChild(d);io.observe(d);
    const l=document.createElement('div');l.className='blabel';Object.assign(l.style,{left:b.x+ox+'px',top:b.y+oy-30+'px',width:b.w+'px'});l.textContent=b.title||k;world.appendChild(l);
  });
  ns.forEach(([k,n])=>{const d=document.createElement('div');
    if(n.kind==='title1'){d.className='title1';d.style.maxWidth=(n.maxW||2000)+'px'}else{d.className='sticky';d.style.width=(n.w||390)+'px'}
    Object.assign(d.style,{left:n.x+ox+'px',top:n.y+oy+'px'});d.textContent=n.text||'';world.appendChild(d)});
  fit();
}
function setZ(v){z=Math.max(0.05,Math.min(1.5,v));world.style.transform=`scale(${z})`;world.style.marginRight=world.style.marginBottom='0';
  document.getElementById('zl').textContent=Math.round(z*100)+'%';
  const w=parseFloat(world.style.width),h=parseFloat(world.style.height);
  world.parentElement.style.setProperty('--w',w*z);world.style.height=h+'px';
  world.style.marginBottom=(h*z-h)+'px';world.style.marginRight=(w*z-w)+'px'}
function fit(){const w=parseFloat(world.style.width);setZ(Math.min(0.6,vp.clientWidth/w));vp.scrollTo(0,0)}
document.getElementById('zi').onclick=()=>setZ(z*1.25);document.getElementById('zo').onclick=()=>setZ(z/1.25);document.getElementById('zf').onclick=fit;
vp.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZ(z*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
let dr=null;vp.addEventListener('mousedown',e=>{dr={x:e.clientX,y:e.clientY,sl:vp.scrollLeft,st:vp.scrollTop,m:false};vp.classList.add('drag')});
window.addEventListener('mousemove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(Math.abs(dx)+Math.abs(dy)>4)dr.m=true;vp.scrollLeft=dr.sl-dx;vp.scrollTop=dr.st-dy});
window.addEventListener('mouseup',()=>{vp.classList.remove('drag');setTimeout(()=>dr=null,0)});
world.addEventListener('click',e=>{if(dr&&dr.m)e.stopPropagation()},true);
const ov=document.getElementById('ov'),of=document.getElementById('of');let cur=null;
function open(k){cur=k;const b=DATA.boards[k];const s=Math.min(1,(innerWidth-140)/b.w,(innerHeight-90)/b.h);
  of.style.width=b.w+'px';of.style.height=b.h+'px';of.style.transform=`scale(${s})`;of.style.margin=`${(b.h*s-b.h)/2}px ${(b.w*s-b.w)/2}px`;
  of.srcdoc=b.html;document.getElementById('ot').textContent=b.title||k;ov.classList.add('on')}
function step(d){const i=list.indexOf(cur);if(i<0)return;open(list[(i+d+list.length)%list.length])}
document.getElementById('ox').onclick=()=>ov.classList.remove('on');document.getElementById('op').onclick=()=>step(-1);document.getElementById('on').onclick=()=>step(1);
window.addEventListener('keydown',e=>{if(!ov.classList.contains('on'))return;if(e.key==='Escape')ov.classList.remove('on');if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
show(DATA.pages.some(p=>p.id===page)?page:DATA.pages[0].id);
</script>
