<style>
:root{--bg:#0A0A0D;--panel:#111015;--line:#2A2722;--gold:#D4B36A;--ivory:#F2EEE6;--mute:#A8A296}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1A1A1E;color:var(--ivory);font-family:'Josefin Sans',system-ui,sans-serif}
header{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
header h1{margin:0;font:500 20px 'Cormorant Garamond',serif;white-space:nowrap}
header h1 span{font-family:'Reem Kufi',sans-serif;color:var(--gold);font-size:17px}
nav{display:flex;gap:6px;overflow-x:auto;flex:1}
nav button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:16px;height:32px;padding:0 14px;font:400 12px 'Josefin Sans';letter-spacing:.08em;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--gold);color:#17140D;border-color:var(--gold);font-weight:600}
.zoom{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--mute)}
.zoom button{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--gold);cursor:pointer;font-size:16px}
#vp{position:fixed;inset:56px 0 0 0;overflow:auto;cursor:grab}
#vp.drag{cursor:grabbing}
#world{position:relative;transform-origin:0 0}
.board{position:absolute;background:#0A0A0D;box-shadow:0 2px 14px rgba(0,0,0,.45);overflow:hidden;cursor:zoom-in}
.board iframe{border:0;width:100%;height:100%;pointer-events:none;display:block}
.blabel{position:absolute;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title1{position:absolute;font:500 44px 'Cormorant Garamond',serif;color:var(--ivory);white-space:nowrap}
.sticky{position:absolute;background:#26252B;color:#D9D4CA;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap}
#ov{position:fixed;inset:0;background:rgba(5,5,7,.92);display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#ov.on{display:flex}
#ov .t{font-size:14px;color:var(--mute);max-width:90vw;text-align:center}
#ov iframe{border:0;background:#0A0A0D;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#ov .x{position:absolute;top:14px;right:18px;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--gold);font-size:18px;cursor:pointer}
#ov .nv{position:absolute;top:50%;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--gold);font-size:20px;cursor:pointer}
</style>
</head>

:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n<span style=\"font-family:'Cormorant Garamond',serif;font-size:17px;color:#A8A296\">poetry <span lang=\"ar\" style=\"font-family:'Aref Ruqaa',serif;color:#D4B36A\">بالعربي<\/span><\/span>\n<button aria-label=\"Reading settings\" style=\"width:44px;height:44px;border:none;background:transparent;color:#D4B36A;font-family:'Cormorant Garamond',serif;font-size:20px\">Aa<\/button>\n<\/header>\n\n<section style=\"position:relative;padding:20px 28px 0 28px;text-align:right\">\n<h1 lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:'Aref Ruqaa',serif;font-weight:700;font-size:44px;line-height:1.3;color:#D4B36A\">أمرُّ على الديار<\/h1>\n<p style=\"margin:6px 0 0;font-size:12px;letter-spacing:0.22em;color:#F2EEE6\">I PASS BY THE DWELLINGS<\/p>\n<p style=\"margin:10px 0 0;font-size:15px;color:#D4B36A\"><span lang=\"ar\" style=\"font-family:Amiri,serif;font-size:17px\">قيس بن الملوّح<\/span> · Majnun Layla<\/p>\n<p style=\"margin:6px 0 0;font-size:11px;letter-spacing:0.14em;color:#A8A296\">UMAYYAD · 7TH C. · METER AL-WAFIR<\/p>\n<\/section>\n\n<main style=\"position:relative;padding:30px 28px 0 28px;display:flex;flex-direction:column;gap:16px;text-align:right\">\n<div style=\"display:flex;flex-direction:column;gap:2px\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:27px;line-height:1.6;color:#F2EEE6\">أَمُرُّ عَلى الدِيارِ دِيارِ لَيلى<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:#BDB6A8\">I pass by the dwellings, Layla's dwellings,<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:2px\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:27px;line-height:1.6;color:#F2EEE6\">أُقَبِّلُ ذا الجِدارَ وَذا الجِدارا<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:#BDB6A8\">and kiss this wall, and then that wall.<\/p>\n<\/div>\n<div aria-hidden=\"true\" style=\"display:flex;justify-content:center;padding:2px 0\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8A7442\" stroke-width=\"1.4\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\"><\/rect><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" transform=\"rotate(45 12 12)\"><\/rect><\/svg><\/div>\n<div style=\"display:flex;flex-direction:column;gap:2px\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:27px;line-height:1.6;color:#F2EEE6\">وَما حُبُّ الدِيارِ شَغَفنَ قَلبي<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:#BDB6A8\">It is not love of the dwellings that took my heart,<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:2px\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:27px;line-height:1.6;color:#F2EEE6\">وَلَكِن حُبُّ مَن سَكَنَ الدِيارا<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:#BDB6A8\">but love of the one who lived in them.<\/p>\n<\/div>\n<\/main>\n\n<div style=\"position:absolute;left:0;right:0;bottom:112px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#A8A296;font-size:11px;letter-spacing:0.16em\">\n<svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 15l6-6 6 6\"><\/path><\/svg>\n<span>NEXT POEM<\/span>\n<\/div>\n\n<nav aria-label=\"Poem actions\" style=\"position:absolute;left:20px;right:20px;bottom:30px;height:64px;border-radius:32px;background:#16151B;border:1px solid #2E2A22;display:flex;align-items:center;justify-content:space-between;padding:0 8px;box-shadow:0 12px 32px rgba(0,0,0,0.5)\">\n<button style=\"height:48px;padding:0 16px;border-radius:24px;border:none;background:transparent;color:#D4B36A;display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:0.14em\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"><\/path><\/svg>LISTEN<\/button>\n<button style=\"height:48px;padding:0 18px;border-radius:24px;border:none;background:#D4B36A;color:#17140D;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:0.14em\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\/path><\/svg>INSIGHTS<\/button>\n<button aria-label=\"Save poem\" style=\"width:48px;height:48px;border-radius:24px;border:none;background:transparent;color:#D4B36A;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><path d=\"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\"><\/path><\/svg><\/button>\n<button aria-label=\"Share poem\" style=\"width:48px;height:48px;border-radius:24px;border:none;background:transparent;color:#D4B36A;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12\"><\/path><path d=\"M7 8l5-5 5 5\"><\/path><path d=\"M5 14v5h14v-5\"><\/path><\/svg><\/button>\n<\/nav>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "Bayt.dc.html": {"x": 470, "y": 0, "w": 390, "h": 844, "title": "02 · Classical bayt", "radius": 44, "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Classical bayt<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>\nbody{margin:0;background:#0A0A0D}\na{color:#D4B36A}a:hover{color:#E8CC8A}\nbutton{font:inherit;cursor:pointer}\n<\/style>\n<\/helmet>\n<div style=\"width:390px;height:844px;position:relative;overflow:hidden;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif\">\n\n<header style=\"display:flex;align-items:center;justify-content:space-between;padding:48px 12px 0 12px\">\n<button aria-label=\"Back\" style=\"width:44px;height:44px;border:none;background:transparent;color:#D4B36A;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n<div role=\"group\" aria-label=\"Layout\" style=\"display:flex;padding:3px;border-radius:20px;border:1px solid #2E2A22;background:#141318\">\n<button aria-pressed=\"true\" style=\"height:32px;padding:0 14px;border-radius:16px;border:none;background:#D4B36A;color:#17140D;font-size:11px;font-weight:600;letter-spacing:0.12em\">CLASSICAL<\/button>\n<button aria-pressed=\"false\" style=\"height:32px;padding:0 14px;border-radius:16px;border:none;background:transparent;color:#A8A296;font-size:11px;letter-spacing:0.12em\">STACKED<\/button>\n<\/div>\n<button aria-label=\"Reading settings\" style=\"width:44px;height:44px;border:none;background:transparent;color:#D4B36A;font-family:'Cormorant Garamond',serif;font-size:20px\">Aa<\/button>\n<\/header>\n\n<section style=\"padding:28px 28px 0 28px;text-align:center\">\n<p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#A8A296\">ABBASID · 10TH CENTURY<\/p>\n<h1 lang=\"ar\" dir=\"rtl\" style=\"margin:10px 0 0;font-family:'Aref Ruqaa',serif;font-weight:700;font-size:42px;line-height:1.3;color:#D4B36A\">واحرَّ قلباه<\/h1>\n<p style=\"margin:4px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:#E4DED2\">O, the fire in my heart<\/p>\n<p style=\"margin:10px 0 0;font-size:14px;color:#D4B36A\"><span lang=\"ar\" style=\"font-family:Amiri,serif;font-size:17px\">المتنبّي<\/span> · Al-Mutanabbi<\/p>\n<\/section>\n\n<div style=\"margin:26px 18px 0 18px;padding:6px;border:1px solid #5C4C2A;border-radius:6px\">\n<div style=\"border:1px solid #2E2A22;border-radius:3px;padding:22px 14px 20px 14px;display:flex;flex-direction:column;gap:22px;background:#0F0E12\">\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div dir=\"rtl\" lang=\"ar\" style=\"display:grid;grid-template-columns:28px minmax(0,1fr) 14px minmax(0,1fr);align-items:center;gap:6px\">\n<span style=\"font-family:Amiri,serif;font-size:15px;color:#8F8778;text-align:center\">١<\/span>\n<p style=\"margin:0;font-family:Amiri,serif;font-size:19px;line-height:1.7;color:#F2EEE6;text-align:justify;text-align-last:justify\">أَنا الَّذي نَظَرَ الأَعمى إِلى أَدَبي<\/p>\n<span aria-hidden=\"true\" style=\"width:4px;height:4px;border-radius:2px;background:#D4B36A;justify-self:center\"><\/span>\n<p style=\"margin:0;font-family:Amiri,serif;font-size:19px;line-height:1.7;color:#F2EEE6;text-align:justify;text-align-last:justify\">وَأَسمَعَت كَلِماتي مَن بِهِ صَمَمُ<\/p>\n<\/div>\n<p style=\"margin:0;padding:0 6px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;line-height:1.4;color:#BDB6A8;text-align:center\">I am the one whose craft the blind have seen, whose words have reached the ears of the deaf.<\/p>\n<\/div>\n\n<div aria-hidden=\"true\" style=\"height:1px;background:#2E2A22;margin:0 30px\"><\/div>\n\n<div sty px;color:#BDB6A8;text-align:right;padding-right:6px\">to wall in, to be fitting<\/span>\n<\/div>\n<p style=\"margin:14px 0 0;font-size:10px;letter-spacing:0.2em;color:#A8A296;text-align:right\">ALSO FROM THIS ROOT<\/p>\n<div dir=\"rtl\" style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap\">\n<a href=\"#\" style=\"text-decoration:none;height:36px;padding:0 14px;border-radius:18px;background:#1C1A20;display:flex;align-items:center;gap:6px;color:#F2EEE6;font-size:13px\"><span lang=\"ar\" style=\"font-family:Amiri,serif;font-size:17px\">جَدير<\/span> worthy<\/a>\n<a href=\"#\" style=\"text-decoration:none;height:36px;padding:0 14px;border-radius:18px;background:#1C1A20;display:flex;align-items:center;gap:6px;color:#F2EEE6;font-size:13px\"><span lang=\"ar\" style=\"font-family:Amiri,serif;font-size:17px\">جَدارة<\/span> merit<\/a>\n<\/div>\n<\/div>\n\n<div style=\"margin-top:auto;display:flex;gap:10px\">\n<button style=\"flex:1;height:52px;border-radius:26px;border:1px solid #5C4C2A;background:transparent;color:#D4B36A;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;letter-spacing:0.14em\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><path d=\"M4 9h4l5-4v14l-5-4H4z\"><\/path><path d=\"M16 9a4 4 0 0 1 0 6\"><\/path><\/svg>HEAR IT<\/button>\n<button style=\"flex:1;height:52px;border-radius:26px;border:none;background:#D4B36A;color:#17140D;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:0.14em\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M6 3h12v18l-6-4-6 4z\"><\/path><\/svg>SAVE WORD<\/button>\n<\/div>\n<\/section>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "Marginalia.dc.html": {"x": 1880, "y": 0, "w": 390, "h": 844, "title": "05 · Insights as marginalia", "radius": 44, "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Insights as marginalia<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>\nbody{margin:0;background:#0A0A0D}\na{color:#D4B36A}a:hover{color:#E8CC8A}\nbutton,input{font:inherit}\nbutton{cursor:pointer}\ninput::placeholder{color:#A8A296}\n<\/style>\n<\/helmet>\n<div style=\"width:390px;height:844px;position:relative;overflow:hidden;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif\">\n\n<header style=\"display:flex;align-items:center;justify-content:space-between;padding:48px 12px 0 12px\">\n<button aria-label=\"Back\" style=\"width:44px;height:44px;border:none;background:transparent;color:#D4B36A;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n<div role=\"tablist\" aria-label=\"Insight lens\" style=\"display:flex;gap:4px\">\n<button role=\"tab\" aria-selected=\"true\" style=\"height:36px;padding:0 14px;border-radius:18px;border:1px solid #D4B36A;background:transparent;color:#D4B36A;font-size:11px;letter-spacing:0.14em\">CONTEXT<\/button>\n<button role=\"tab\" aria-selected=\"false\" style=\"height:36px;padding:0 14px;border-radius:18px;border:1px solid transparent;background:transparent;color:#A8A296;font-size:11px;letter-spacing:0.14em\">FORM<\/button>\n<button role=\"tab\" aria-selected=\"false\" style=\"height:36px;padding:0 14px;border-radius:18px;border:1px solid transparent;background:transparent;color:#A8A296;font-size:11px;letter-spacing:0.14em\">LANGUAGE<\/button>\n<\/div>\n<span aria-hidden=\"true\" style=\"width:44px\"><\/span>\n<\/header>\n\n<main style=\"padding:26px 24px 0 18px;display:flex;flex-direction:column;gap:14px\">\n\n<div style=\"display:flex;align-items:flex-start;gap:12px\">\n<button aria-label=\"Note 1, open\" aria-expanded=\"true\" style=\"flex:none;width:28px;height:28px;margin-top:10px;border-radius:14px;border:none;background:#D4B36A;color:#17140D;font-size:12px;font-weight:600\">1<\/button>\n<div style=\"flex:1;min-width:0;text-align:right\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:26px;line-height:1.6;color:#F2EEE6\">أَمُرُّ عَلى <span style=\"border-bottom:1.5px solid #D4B36A;padding-bottom:2px\">الدِيارِ دِيارِ<\/span> لَيلى<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#BDB6A8\">I pass by the dwellings, Layla's dwellings,<\/p>\n<\/div>\n<\/div>\n\n<aside style=\"margin-left:40px;padding:14px 16px;border-left:1px solid #D4B36A;background:#121116;border-radius:0 12px 12px 0\">\n<p style=\"margin:0;font-size:10px;letter-spacing:0.2em;color:#D4B36A\">AL-ATLAL · THE RUINED CAMP<\/p>\n<p style=\"margin:8px 0 0;font-family:'Cormorant Garamond',serif;font-size:17px;line-height:1.45;color:#E4DED2\">Pausing at an abandoned dwelling is the oldest opening in Arabic verse, inherited from the pre-Islamic odes. Majnun takes the convention and makes it a single, obsessive walk.<\/p>\n<div style=\"display:flex;gap:16px;margin-top:10px;font-size:12px;letter-spacing:0.08em\">\n<a href=\"#\" style=\"color:#D4B36A\">Read the ode it echoes<\/a>\n<a href=\"#\" style=\"color:#A8A296\">Collapse<\/a>\n<\/div>\n<\/aside>\n\n<div style=\"display:flex;align-items:flex-start;gap:12px\">\n<span aria-hidden=\"true\" style=\"flex:none;width:28px\"><\/span>\n<div style=\"flex:1;min-width:0;text-align:right\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:26px;line-height:1.6;color:#F2EEE6\">أُقَبِّلُ ذا الجِدارَ وَذا الجِدارا<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#BDB6A8\">and kiss this wall, and then that wall.<\/p>\n<\/div>\n<\/div>\n\n<div style=\"display:flex;align-items:flex-start;gap:12px\">\n<span aria-hidden=\"true\" style=\"flex:none;width:28px\"><\/span>\n<div style=\"flex:1;min-width:0;text-align:right\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:26px;line-height:1.6;color:#F2EEE6\">وَما حُبُّ الدِيارِ شَغَفنَ قَلبي<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#BDB6A8\">It is not love of the dwellings that took my heart,<\/p>\n<\/div>\n<\/div>\n\n<div style=\"display:flex;align-items:flex-start;gap:12px\">\n<button aria-label=\"Note 2\" aria-expanded=\"false\" style=\"flex:none;width:28px;height:28px;margin-top:10px;border-radius:14px;border:1px solid #D4B36A;background:transparent;color:#D4B36A;font-size:12px\">2<\/button>\n<div style=\"flex:1;min-width:0;text-align:right\">\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:26px;line-height:1.6;color:#F2EEE6\">وَلَكِن حُبُّ <span style=\"border-bottom:1.5px dashed #8A7442;padding-bottom:2px\">مَن سَكَنَ<\/span> الدِيارا<\/p>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:#BDB6A8\">but love of the one who lived in them.<\/p>\n<\/div>\n<\/div>\n<\/main>\n\n<form style=\"position:absolute;left:16px;right:16px;bottom:30px;height:56px;border-radius:28px;background:#16151B;border:1px solid #2E2A22;display:flex;align-items:center;padding:0 6px 0 18px;gap:10px\">\n<svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\/path><\/svg>\n<label for=\"ask\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">Ask about this poem<\/label>\n<input id=\"ask\" type=\"text\" placeholder=\"Ask about this poem\" style=\"flex:1;min-width:0;height:44px;border:none;background:transparent;color:#F2EEE6;font-size:15px;outline:none\">\n<button type=\"submit\" aria-label=\"Ask\" style=\"width:44px;height:44px;border-radius:22px;border:none;background:#D4B36A;color:#17140D;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5\"><\/path><path d=\"M6 11l6-6 6 6\"><\/path><\/svg><\/button>\n<\/form>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "Feed.dc.html": {"x": 0, "y": 1264, "w": 390, "h": 844, "title": "06 · Today's seven", "radius": 44, "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Today's seven<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>\nbody{margin:0;background:#0A0A0D}\na{color:#D4B36A}a:hover{color:#E8CC8A}\nbutton{font:inherit;cursor:pointer}\n<\/style>\n<\/helmet>\n<div style=\"width:390px;height:844px;position:relative;overflow:hidden;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif\">\n<svg aria-hidden=\"true\" width=\"390\" height=\"844\" style=\"position:absolute;top:0;left:0;opacity:0.22\">\n<defs>\n<pattern id=\"st6\" width=\"72\" height=\"72\" patternUnits=\"userSpaceOnUse\"><g fill=\"none\" stroke=\"#3B4466\" stroke-width=\"1\"><rect x=\"18\" y=\"18\" width=\"36\" height=\"36\"><\/rect><rect x=\"18\" y=\"18\" width=\"36\" height=\"36\" transform=\"rotate(45 36 rgin:0;font-family:Amiri,serif;font-size:31px;line-height:1.65;color:#F2EEE6\">بِسِقطِ اللِوى بَينَ الدَخولِ فَحَومَلِ<\/p>\n<p style=\"margin:18px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;line-height:1.4;color:#BDB6A8\">Halt, my two friends, and let us weep for a beloved and a dwelling, where the sands curl down between al-Dakhul and Hawmal.<\/p>\n<p style=\"margin:22px 0 0;font-size:15px;color:#D4B36A\"><span lang=\"ar\" style=\"font-family:Amiri,serif;font-size:17px\">امرؤ القيس<\/span> · Imru' al-Qais<\/p>\n<p style=\"margin:4px 0 0;font-size:11px;letter-spacing:0.14em;color:#A8A296\">FROM THE MU'ALLAQA<\/p>\n<div style=\"display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap\">\n<span style=\"height:30px;line-height:30px;padding:0 12px;border-radius:15px;background:#1A1920;font-size:12px;color:#E4DED2\">Longing<\/span>\n<span style=\"height:30px;line-height:30px;padding:0 12px;border-radius:15px;background:#1A1920;font-size:12px;color:#E4DED2\">Memory<\/span>\n<span style=\"height:30px;line-height:30px;padding:0 12px;border-radius:15px;background:#1A1920;font-size:12px;color:#E4DED2\">Desert<\/span>\n<\/div>\n<\/article>\n\n<div style=\"position:absolute;right:8px;top:300px;display:flex;flex-direction:column;gap:6px\">\n<button aria-label=\"Save\" style=\"width:48px;height:48px;border-radius:24px;border:none;background:transparent;color:#D4B36A;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><path d=\"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\"><\/path><\/svg><\/button>\n<button aria-label=\"Listen\" style=\"width:48px;height:48px;border-radius:24px;border:none;background:transparent;color:#D4B36A;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox= A2722\">\n<div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">DISPLAY · ARABIC<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#F2EEE6\">Aref Ruqaa Bold<\/p><\/div>\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:'Aref Ruqaa',serif;font-weight:700;font-size:64px;line-height:1.2;color:#D4B36A;text-align:right\">أمرُّ على الديار<\/p>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Poem titles and the logo only. 40 to 64px. Never for verse.<\/p>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) 220px;align-items:center;gap:24px;padding:16px 0;border-top:1px solid #2A2722\">\n<div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">VERSE · ARABIC<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#F2EEE6\">Amiri Regular<\/p><\/div>\n<p lang=\"ar\" dir=\"rtl\" style=\"margin:0;font-family:Amiri,serif;font-size:34px;line-height:1.7;color:#F2EEE6;text-align:right\">وَما حُبُّ الدِيارِ شَغَفنَ قَلبي<\/p>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Naskh with full vowel marks. 27px, line height 1.6 so marks never collide.<\/p>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) 220px;align-items:center;gap:24px;padding:16px 0;border-top:1px solid #2A2722\">\n<div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">VERSE · ENGLISH<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#F2EEE6\">Cormorant Garamond Italic<\/p><\/div>\n<p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;line-height:1.4;color:#BDB6A8;text-align:right\">It is not love of the dwellings that took my heart<\/p>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Set about two-thirds the Arabic size so the translation reads as a gloss, not a rival.<\/p>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:200px minmax(0,1fr) 220px;align-items:center;gap:24px;padding:16px 0;border-top:1px solid #2A2722\">\n<div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">INTERFACE<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#F2EEE6\">Josefin Sans 400 / 600<\/p><\/div>\n<div style=\"display:flex;gap:28px;align-items:baseline;justify-content:flex-end\"><span style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;color:#D4B36A\">LISTEN · INSIGHTS<\/span><span style=\"font-size:15px;color:#F2EEE6\">Recited by a native voice<\/span><\/div>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Caps with 0.14em tracking for actions, sentence case for everything else.<\/p>\n<\/div>\n\n<div style=\"margin-top:auto;padding:16px 20px;border-radius:12px;background:#111015;border:1px solid #2A2722;font-size:14px;line-height:1.5;color:#BDB6A8\">\n<span style=\"color:#D4B36A\">Rule of hierarchy:<\/span> Arabic always leads in size, weight and position. English is italic and quieter. Interface type stays out of the verse area.\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "BrandPattern.dc.html": {"x": 2320, "y": 3368, "w": 1080, "h": 720, "title": "B6 · Pattern, ornament & voice", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Pattern, ornament and voice<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1080px;height:720px;box-sizing:border-box;padding:48px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n<h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px\">Pattern, ornament & voice<\/h1>\n<span style=\"font-size:12px;letter-spacing:0.22em;color:#A8A296\">BRAND · 06<\/span>\n<\/div>\n\n<div style=\"display:grid;grid-template-columns:340px minmax(0,1fr);gap:40px;flex:1\">\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"height:300px;border-radius:14px;overflow:hidden;border:1px solid #2A2722;position:relative;background:#0E0D12\">\n<svg role=\"img\" aria-label=\"Eight-point star pattern\" width=\"340\" height=\"300\"><defs><pattern id=\"bp\" width=\"68\" height=\"68\" patternUnits=\"userSpaceOnUse\"><g fill=\"none\" stroke=\"#4A5580\" stroke-width=\"1.2\"><rect x=\"17\" y=\"17\" width=\"34\" height=\"34\"><\/rect><rect x=\"17\" y=\"17\" width=\"34\" height=\"34\" transform=\"rotate(45 34 34)\"><\/rect><path d=\"M0 34h10M58 34h10M34 0v10M34 58v10\"><\/path><\/g><\/pattern><\/defs><rect width=\"340\" height=\"300\" fill=\"url(#bp)\"><\/rect><\/svg>\n<span style=\"position:absolute;left:16px;bottom:14px;font-size:11px;letter-spacing:0.18em;color:#A8A296;background:#0E0D12;padding:4px 8px;border-radius:6px\">KHATAM PATTERN · 30–40% OPACITY<\/span>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">ORNAMENTS<\/p>\n<div style=\"display:flex;align-items:center;gap:28px\">\n<svg role=\"img\" aria-label=\"Star divider\" width=\"64\" height=\"20\" viewBox=\"0 0 64 20\"><path d=\"M0 10h22M42 10h22\" stroke=\"#8A7442\" stroke-width=\"1\"><\/path><g fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.2\"><rect x=\"26\" y=\"4\" width=\"12\" height=\"12\"><\/rect><rect x=\"26\" y=\"4\" width=\"12\" height=\"12\" transform=\"rotate(45 32 10)\"><\/rect><\/g><\/svg>\n<svg role=\"img\" aria-label=\"Hemistich separator\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><path d=\"M10 4l6 6-6 6-6-6z\" fill=\"#D4B36A\"><\/path><\/svg>\n<svg role=\"img\" aria-label=\"Verse number medallion\" width=\"32\" height=\"32\" viewBox=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"13\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.2\"><\/circle><text x=\"16\" y=\"21\" text-anchor=\"middle\" font-family=\"Amiri\" font-size=\"14\" fill=\"#D4B36A\">٣<\/text><\/svg>\n<\/div>\n<p style=\"margin:0;font-size:13px;line-height:1.5;color:#A8A296\">Pattern fades in from the top edge and never sits behind verse text.<\/p>\n<\/div>\n<\/div>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">VOICE<\/p>\n\n<div style=\"padding:16px 18px;border-radius:12px;background:#111015;border:1px solid #2A2722\">\n<p style=\"margin:0;font-size:16px;color:#F2EEE6\">The verse speaks first.<\/p>\n<p style=\"margin:6px 0 0;font-size:13px;line-height:1.5;color:#A8A296\">The interface whispers. No badges, counters or alerts on top of a poem.<\/p>\n<\/div>\n\n<div style=\"padding:16px 18px;border-radius:12px;background:#111015;border:1px solid #2A2722\">\n<p style=\"margin:0;font-size:16px;color:#F2EEE6\">Translate the feeling, not only the words.<\/p>\n<p style=\"margin:8px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:#D4B36A\">Yes: “It is not love of the dwellings that took my heart.”<\/p>\n<p style=\"margin:2px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:#A8A296\">No: “Love of houses did not affect my heart.”<\/p>\n<\/div>\n\n<div style=\"padding:16px 18px;border-radius:12px;background:#111015;border:1px solid #2A2722\">\n<p style=\"margin:0;font-size:16px;color:#F2EEE6\">Explain like a friend in the majlis, not a textbook.<\/p>\n<p style=\"margin:8px 0 0;font-size:13px;color:#D4B36A\">Yes: “Majnun takes an old convention and makes it an obsession.”<\/p>\n<p style=\"margin:2px 0 0;font-size:13px;color:#A8A296\">No: “This poem utilizes the atlal motif.”<\/p>\n<\/div>\n\n<div style=\"padding:16px 18px;border-radius:12px;background:#111015;border:1px solid #2A2722\">\n<p style=\"margin:0;font-size:16px;color:#F2EEE6\">Never rush the reader.<\/p>\n<p style=\"margin:8px 0 0;font-size:13px;color:#D4B36A\">Yes: “That's today's seven. More tomorrow.”<\/p>\n<p style=\"margin:2px 0 0;font-size:13px;color:#A8A296\">No: “Don't lose your streak!”<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "GeoLogos.dc.html": {"x": 0, "y": 4508, "w": 1080, "h": 720, "title": "G1 · Geometric logo concepts", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Geometric logo concepts<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1080px;height:720px;box-sizing:border-box;padding:44px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px\">Geometric logo concepts<\/h1><span style=\"font-size:12px;letter-spacing:0.22em;color:#A8A296\">GEOMETRY · 01<\/span><\/div><div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;flex:1\"><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:20px 18px;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;justify-content:center;padding:6px 0\"><svg role=\"img\" aria-label=\"Interlace mark\" width=\"112\" height=\"112\" viewBox=\"0 0 120 120\"><g fill=\"none\" stroke-linejoin=\"miter\"><path d=\"M30.00 30.00 L90.00 30.00 L90.00 90.00 L30.00 90.00 Z\" stroke=\"#D4B36A\" stroke-width=\"9.0\"><\/path><path d=\"M60.00 17.57 L102.43 60.00 L60.00 102.43 L17.57 60.00 Z\" stroke=\"#D4B36A\" stroke-width=\"9.0\"><\/path><path d=\"M30.00 30.00 L90.00 30.00 L90.00 90.00 L30.00 90.00 Z\" stroke=\"#0A0A0D\" stroke-width=\"2.5\"><\/path><path d=\"M60.00 17.57 L102.43 60.00 L60.00 102.43 L17.57 60.00 Z\" stroke=\"#0A0A0D\" stroke-width=\"2.5\"><\/path><\/g><circle cx=\"60\" cy=\"60\" r=\"11\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"2.5\"><\/circle><path d=\"M60.00 55.50 L64.50 60.00 L60.00 64.50 L55.50 60.00 Z\" fill=\"#D4B36A\"><\/path><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">01 · INTERLACE<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">Two squares woven as bands, the khatam drawn the way girih artisans build it.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:20px 18px;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;justify-content:center;padding:6px 0\"><svg role=\"img\" aria-label=\"Rosette mark\" width=\"112\" height=\"112\" viewBox=\"0 0 120 120\"><circle cx=\"60\" cy=\"60\" r=\"52\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.4\"><\/circle><path d=\"M60.00 58.00 L67.00 36.00 L60.00 12.00 L53.00 36.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M61.41 58.59 L81.92 47.98 L93.94 26.06 L72.02 38.08 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\/path><path d=\"M62.00 60.00 L84.00 67.00 L108.00 60.00 L84.00 53.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M61.41 61.41 L72.02 81.92 L93.94 93.94 L81.92 72.02 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\/path><path d=\"M60.00 62.00 L53.00 84.00 L60.00 108.00 L67.00 84.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M58.59 61.41 L38.08 72.02 L26.06 93.94 L47.98 81.92 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\/path><path d=\"M58.00 60.00 L36.00 53.00 L12.00 60.00 L36.00 67.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M58.59 58.59 L47.98 38.08 L26.06 26.06 L38.08 47.98 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">02 · ROSETTE<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">Eight petals, alternating solid and open. Reads as a flower, a compass, and a star.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:20px 18px;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;justify-content:center;padding:6px 0\"><svg role=\"img\" aria-label=\"Vesica mark\" width=\"112\" height=\"112\" viewBox=\"0 0 120 120\"><g fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"3.0\"><circle cx=\"46\" cy=\"60\" r=\"32\"><\/circle><circle cx=\"74\" cy=\"60\" r=\"32\"><\/circle><\/g><path d=\"M60.00 52.00 L68.00 60.00 L60.00 68.00 L52.00 60.00 Z\" fill=\"#D4B36A\"><\/path><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">03 · VESICA<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">The compass's first move: two circles crossing. A calligrapher's dot sits where they meet.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:20px 18px;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;justify-content:center;padding:6px 0\"><svg role=\"img\" aria-label=\"Bayt circle mark\" width=\"112\" height=\"112\" viewBox=\"0 0 120 120\"><g fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"7.0\" stroke-linecap=\"round\"><path d=\"M52.36 103.33 A44 44 0 0 1 52.36 16.67\"><\/path><path d=\"M67.64 16.67 A44 44 0 0 1 67.64 103.33\"><\/path><\/g><path d=\"M60.00 51.00 L69.00 60.00 L60.00 69.00 L51.00 60.00 Z\" fill=\"#D4B36A\"><\/path><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">04 · BAYT CIRCLE<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">One full circle split into two halves, like a line of verse split at its caesura.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:20px 18px;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;justify-content:center;padding:6px 0\"><svg role=\"img\" aria-label=\"Shubbak mark\" width=\"112\" height=\"112\" viewBox=\"0 0 120 120\"><path d=\"M28.00 106.00 V58.00 A54.40 54.40 0 0 1 60.00 8.43 A54.40 54.40 0 0 1 92.00 58.00 V106.00 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"3.0\" stroke-linejoin=\"round\"><\/path><path d=\"M39.00 54.00 L43.00 58.00 L39.00 62.00 L35.00 58.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M53.00 54.00 L57.00 58.00 L53.00 62.00 L49.00 58.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M67.00 54.00 L71.00 58.00 L67.00 62.00 L63.00 58.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M81.00 54.00 L85.00 58.00 L81.00 62.00 L77.00 58.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M39.00 67.00 L43.00 71.00 L39.00 75.00 L35.00 71.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M53.00 67.00 L57.00 71.00 L53.00 75.00 L49.00 71.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M67.00 67.00 L71.00 71.00 L67.00 75.00 L63.00 71.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M81.00 67.00 L85.00 71.00 L81.00 75.00 L77.00 71.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M39.00 80.00 L43.00 84.00 L39.00 88.00 L35.00 84.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M53.00 80.00 L57.00 84.00 L53.00 88.00 L49.00 84.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M67.00 80.00 L71.00 84.00 L67.00 88.00 L63.00 84.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M81.00 80.00 L85.00 84.00 L81.00 88.00 L77.00 84.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M39.00 93.00 L43.00 97.00 L39.00 101.00 L35.00 97.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M53.00 93.00 L57.00 97.00 L53.00 101.00 L49.00 97.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M67.00 93.00 L71.00 97.00 L67.00 101.00 L63.00 97.00 Z\" fill=\"#D ns:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1080px;height:720px;box-sizing:border-box;padding:44px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px\">Construction · one compass, one rule<\/h1><span style=\"font-size:12px;letter-spacing:0.22em;color:#A8A296\">GEOMETRY · 03<\/span><\/div><div style=\"display:grid;grid-template-columns:520px minmax(0,1fr);gap:48px;flex:1;align-items:center\"><div style=\"width:520px;height:520px;border-radius:16px;background:#0E0D12;border:1px solid #2A2722;display:flex;align-items:center;justify-content:center\"><svg role=\"img\" aria-label=\"Rosette mark drawn over its construction lines\" width=\"440\" height=\"440\" viewBox=\"0 0 120 120\"><g fill=\"none\" stroke=\"#3B4466\" stroke-width=\"0.5\"><circle cx=\"60\" cy=\"60\" r=\"52\"><\/circle><circle cx=\"60\" cy=\"60\" r=\"26\"><\/circle><circle cx=\"60\" cy=\"60\" r=\"48\"><\/circle><path d=\"M116.00 60.00 L4.00 60.00\"><\/path><path d=\"M111.92 80.98 L8.08 39.02\"><\/path><path d=\"M100.28 98.90 L19.72 21.10\"><\/path><path d=\"M82.78 111.16 L37.22 8.84\"><\/path><path d=\"M61.95 115.97 L58.05 4.03\"><\/path><path d=\"M40.85 112.62 L79.15 7.38\"><\/path><path d=\"M22.53 101.62 L97.47 18.38\"><\/path><path d=\"M9.67 84.55 L110.33 35.45\"><\/path><path d=\"M4.14 63.91 L115.86 56.09\"><\/path><rect x=\"23\" y=\"23\" width=\"74\" height=\"74\"><\/rect><rect x=\"23\" y=\"23\" width=\"74\" height=\"74\" transform=\"rotate(45 60 60)\"><\/rect><\/g><circle cx=\"60\" cy=\"60\" r=\"52\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.4\"><\/circle><path d=\"M60.00 58.00 L67.00 36.00 L60.00 12.00 L53.00 36.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M61.41 58.59 L81.92 47.98 L93.94 26.06 L72.02 38.08 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\/path><path d=\"M62.00 60.00 L84.00 67.00 L108.00 60.00 L84.00 53.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M61.41 61.41 L72.02 81.92 L93.94 93.94 L81.92 72.02 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\/path><path d=\"M60.00 62.00 L53.00 84.00 L60.00 108.00 L67.00 84.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M58.59 61.41 L38.08 72.02 L26.06 93.94 L47.98 81.92 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\/path><path d=\"M58.00 60.00 L36.00 53.00 L12.00 60.00 L36.00 67.00 Z\" fill=\"#D4B36A\"><\/path><path d=\"M58.59 58.59 L47.98 38.08 L26.06 26.06 L38.08 47.98 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><div style=\"display:flex;flex-direction:column;gap:22px\"><div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:30px;height:30px;border-radius:15px;border:1px solid #D4B36A;color:#D4B36A;display:flex;align-items:center;justify-content:center;font-size:13px\">1<\/span><div><p style=\"margin:0;font-size:16px;color:#F2EEE6\">One circle<\/p><p style=\"margin:4px 0 0;font-size:13px;line-height:1.5;color:#A8A296\">Everything starts from a single compass sweep. Radius = 1 unit.<\/p><\/div><\/div><div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:30px;height:30px;border-radius:15px;border:1px solid #D4B36A;color:#D4B36A;display:flex;align-items:center;justify-content:center;font-size:13px\">2<\/span><div><p style=\"margin:0;font-size:16px;color:#F2EEE6\">Eight divisions<\/p><p style=\"margin:4px 0 0;font-size:13px;line-height:1.5;color:#A8A296\">Bisect twice to get 8 equal angles, the base of the khatam.<\/p><\/div><\/div><div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:30px;height:30px;border-radius:15px;border:1px solid #D4B36A;color:#D4B36A;display:flex;align-items:center;justify-content:center;font-size:13px\">3<\/span><div><p style=\"margin:0;font-size:16px;color:#F2EEE6\">Two squares<\/p><p style=\"margin:4px 0 0;font-size:13px;line-height:1.5;color:#A8A296\">Join every second point. The overlap is the eight-point star.<\/p><\/div><\/div><div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:30px;height:30px;border-radius:15px;border:1px solid #D4B36A;color:#D4B36A;display:flex;align-items:center;justify-content:center;font-size:13px\">4<\/span><div><p style=\"margin:0;font-size:16px;color:#F2EEE6\">Petals<\/p><p style=\"margin:4px 0 0;font-size:13px;line-height:1.5;color:#A8A296\">Each petal is a rhombus whose tips touch the inner and outer circles.<\/p><\/div><\/div><p style=\"margin:8px 0 0;padding:14px 16px;border-radius:12px;background:#111015;border:1px solid #2A2722;font-size:14px;line-height:1.5;color:#BDB6A8\"><span style=\"color:#D4B36A\">Why it matters:<\/span> a mark built from one circle can be redrawn by anyone, at any size, and generates the pattern, ornaments and icon grid from the same unit.<\/p><\/div><\/div><\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "AlhMarks.dc.html": {"x": 0, "y": 5648, "w": 1080, "h": 720, "title": "A1 · Alhambra marks", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Alhambra marks<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1080px;height:720px;box-sizing:border-box;padding:44px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:22px\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px\">Alhambra marks · eight geometries<\/h1><span style=\"font-size:12px;letter-spacing:0.22em;color:#A8A296\">ALHAMBRA · 01<\/span><\/div><div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;flex:1\"><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:18px 18px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:center;padding:4px 0\"><svg role=\"img\" aria-label=\"Pajarita mark\" width=\"112\" height=\"112\" viewBox=\"0 0 120 120\"><path d=\"M60.00 16.00 Q54.28 44.68 82.00 54.00 Q109.72 63.32 104.00 92.00 Q82.00 72.64 60.00 92.00 Q38.00 111.36 16.00 92.00 Q43.72 82.68 38.00 54.00 Q32.28 25.32 60.00 16.00 Z\" fill=\"#D4B36A\"><\/path><circle cx=\"60\" cy=\"40\" r=\"4.0\" fill=\"#0A0A0D\"><\/circle><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">01 · PAJARITA<\/p><p style=\"margin:0;font-size:10px;letter-spacing:0.16em;color:#A8A296\">NASRID TILES<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">A curved triangle the tilers repeated endlessly. Its local name means little bird; Escher studied these tilings.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:18px 18px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:center;padding:4px 0\"><svg role=\"img\" aria-label=\"Hueso nazarí mark\" width=\"112\" height=\"112\" viewBox=\"0 0 120 120\"><path d=\"M60.00 15.45 L71.14 26.59 L85.61 23.25 L96.75 34.39 L93.41 48.86 L104.55 60.00 L93.41 71.14 L78.93 67.80 L67.80 78.93 L71.14 93.41 L60.00 104.55 L48.86 93.41 L34.39 96.75 L23.25 85.61 L26.59 71.14 L15.45 60.00 L26.59 48.86 L41.07 52.20 L52.20 41.07 L48.86 26.59 Z\" fill=\"#D4B36A\"><\/path><path d=\"M60.00 53.00 L67.00 60.00 L60.00 67.00 L53.00 60.00 Z\" fill=\"#0A0A0D\"><\/path><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">02 · HUESO NAZARÍ<\/p><p style=\"margin:0;font-size:10px;letter-spacing:0.16em;color:#A8A296\">NASRID TILES<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">The interlocking Nasrid bone: every bump fits a neighbour's notch, like rhyme answering rhyme.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:18px 18px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:center;padding:4px 0\"><svg role=\"img\" aria-label=\"Lazo of 16 mark\" width=\"112\" height=\"112\" viewBox=\"0 0 120 120\"><path d=\"M60.00 10.00 L106.19 79.13 L24.64 95.36 L40.87 13.81 L110.00 60.00 L40.87 106.19 L24.64 24.64 L106.19 40.87 L60.00 110.00 L13.81 40.87 L95.36 24.64 L79.13 106.19 L10.00 60.00 L79.13 13.81 L95.36 95.36 L13.81 79.13 Z\" fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"5.0\" stroke-linejoin=\"miter\"><\/path><path d=\"M60.00 10.00 L106.19 79.13 L24.64 95.36 L40.87 13.81 L110.00 60.00 L40.87 106.19 L24.64 24.64 L106.19 40.87 L60.00 110.00 L13.81 40.87 L95.36 24.64 L79.13 106.19 L10.00 60.00 L79.13 13.81 L95.36 95.36 L13.81 79.13 Z\" fill=\"none\" stroke=\"#0A0A0D\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"><\/path><circle cx=\"60\" cy=\"60\" r=\"10\" fill=\"#D4B36A\"><\/circle><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">03 · LAZO OF 16<\/p><p style=\"margin:0;font-size:10px;letter-spacing:0.16em;color:#A8A296\">PALACE DADOS<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">A 16-point interlaced strapwork star, one of the wheels that turn through the tile dados.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:18px 18px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:center;padding:4px 0\"><svg role=\"img\" aria-label=\"Sebka mark\" width=\"1  and print.<\/p><\/div><span><\/span><\/div><\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "Fused.dc.html": {"x": 0, "y": 7928, "w": 1440, "h": 900, "title": "F1 · One name, two languages", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Fused bilingual names<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Reem+Kufi:wght@500;700&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1440px;height:900px;box-sizing:border-box;padding:48px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:26px\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:42px\">One name, two languages<\/h1><span style=\"font-size:12px;letter-spacing:0.22em;color:#A8A296\">BILINGUAL · 01<\/span><\/div><div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;flex:1\"><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:96px;color:#F2EEE6;line-height:1\">Shi<span lang=\"ar\" style=\"font-family:Amiri,serif;font-weight:700;color:#D4B36A;font-size:92px\">ع<\/span>r<\/span><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">01 · EMBEDDED LETTER<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">One word, two scripts. The Arabic letter ʿayn stands in for the sound English cannot spell.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> English readers may not know how to say it at first. Pair with a tagline.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:88px;letter-spacing:0.04em;color:#F2EEE6;line-height:1\">sh<span style=\"color:#D4B36A\">3<\/span>r<\/span><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">02 · ARABIZI<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">How Arabs type Arabic in Latin letters on phones: 3 stands for ع. Instantly native to young bilinguals.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Reads as casual texting. Fights the classical tone.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><div style=\"display:flex;align-items:baseline;gap:18px\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:86px;color:#F2EEE6;line-height:1\">bayt<\/span><span lang=\"ar\" style=\"font-family:Amiri,serif;font-weight:700;font-size:80px;color:#D4B36A;line-height:1\">بيت<\/span><\/div><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">03 · ONE WORD, TWO MEANINGS<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">In Arabic, bayt means both a house and a line of verse. Brand story: a home for Arabic poetry.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Bayt.com is a large Middle East job site. Name clash risk.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><div style=\"display:flex;align-items:baseline;gap:18px\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:84px;color:#F2EEE6;line-height:1\">Dīwān<\/span><span lang=\"ar\" style=\"font-family:Amiri,serif;font-weight:700;font-size:74px;color:#D4B36A;line-height:1\">ديوان<\/span><\/div><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">04 · SHARED WORD<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">Already lives in both languages: a poet's collected works, and Goethe's West-Eastern Divan.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Widely used by restaurants and cafés. Hard to own.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span lang=\"ar\" style=\"font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:70px;color:#D4B36A;line-height:1.1\">شعر<\/span><span style=\"width:150px;height:2px;background:#8A7442\"><\/span><span style=\"font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:44px;letter-spacing:0.18em;color:#F2EEE6;line-height:1\">SHIʿR<\/span><\/div><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">05 · ONE TYPE SYSTEM<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">Arabic and Latin drawn in the same geometric Kufi, same width, same weight. Reads as one wordmark.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Needs custom lettering to get the shared strokes right.<\/p><\/div><\/div><div style=\"border:1px solid #2A2722;border-radius:16px;background:#111015;display:flex;flex-direction:column\"><div style=\"height:210px;display:flex;align-items:center;justify-content:center\"><div style=\"display:flex;align-items:center;gap:20px\"><span style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:58px;color:#F2EEE6;line-height:1\">verse<\/span><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M10 2l8 8-8 8-8-8z\" fill=\"#D4B36A\"><\/path><\/svg><span lang=\"ar\" style=\"font-family:Amiri,serif;font-weight:700;font-size:58px;color:#D4B36A;line-height:1\">شعر<\/span><\/div><\/div><div style=\"padding:16px 20px 18px;border-top:1px solid #2A2722;display:flex;flex-direction:column;gap:8px\"><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">06 · VERSE AS LOGO<\/p><p style=\"margin:0;font-size:14px;line-height:1.45;color:#E4DED2\">The name is set like a single line of classical poetry: two halves, one caesura, two languages.<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#A8A296\"><span style=\"color:#D4B36A\">Risk:<\/span> Closest to two words side by side. Works better as a tagline style.<\/p><\/div><\/div><\/div><\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}, "FusedApplied.dc.html": {"x": 1520, "y": 7928, "w": 1080, "h": 900, "title": "F2 · Shiعr applied", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n m.dc.html": {"x": 0, "y": 9248, "w": 1080, "h": 720, "title": "K1 · Khatam directions", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Khatam directions<\/title>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Reem+Kufi:wght@500;700&family=Josefin+Sans:wght@400;600&display=swap\">\n<style>body{margin:0;background:#0A0A0D}a{color:#D4B36A}a:hover{color:#E8CC8A}<\/style>\n<\/helmet>\n<div style=\"width:1080px;height:720px;box-sizing:border-box;padding:44px 56px;background:#0A0A0D;color:#F2EEE6;font-family:'Josefin Sans',sans-serif;display:flex;flex-direction:column;gap:22px\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px\">Khatam · eight directions from B1 A<\/h1><span style=\"font-size:12px;letter-spacing:0.22em;color:#A8A296\">KHATAM · 01<\/span><\/div><div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;flex:1\"><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:18px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:center;padding:4px 0\"><svg role=\"img\" aria-label=\"Khatam Refined mark\" width=\"118\" height=\"118\" viewBox=\"0 0 120 120\"><g fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"2.6\" stroke-linejoin=\"round\"><rect x=\"27.0\" y=\"27.0\" width=\"66\" height=\"66\" rx=\"0\"><\/rect><rect x=\"27.0\" y=\"27.0\" width=\"66\" height=\"66\" rx=\"0\" transform=\"rotate(45 60 60)\"><\/rect><\/g><text x=\"60\" y=\"56\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Aref Ruqaa\" font-weight=\"700\" font-size=\"46\" fill=\"#D4B36A\">ش<\/text><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">A1 · REFINED<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">The original, rebalanced: thinner star, ش sized to sit in the star's optical center.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:18px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:center;padding:4px 0\"><svg role=\"img\" aria-label=\"Khatam ʿAyn mark\" width=\"118\" height=\"118\" viewBox=\"0 0 120 120\"><g fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"2.6\" stroke-linejoin=\"round\"><rect x=\"27.0\" y=\"27.0\" width=\"66\" height=\"66\" rx=\"0\"><\/rect><rect x=\"27.0\" y=\"27.0\" width=\"66\" height=\"66\" rx=\"0\" transform=\"rotate(45 60 60)\"><\/rect><\/g><text x=\"60\" y=\"54\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Aref Ruqaa\" font-weight=\"700\" font-size=\"48\" fill=\"#D4B36A\">ع<\/text><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">A2 · ʿAYN<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">The same star around ع, tying the mark to the Shiعr name.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:18px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:center;padding:4px 0\"><svg role=\"img\" aria-label=\"Khatam Seal mark\" width=\"118\" height=\"118\" viewBox=\"0 0 120 120\"><g fill=\"#D4B36A\"><rect x=\"25.0\" y=\"25.0\" width=\"70\" height=\"70\" rx=\"0\"><\/rect><rect x=\"25.0\" y=\"25.0\" width=\"70\" height=\"70\" rx=\"0\" transform=\"rotate(45 60 60)\"><\/rect><\/g><text x=\"60\" y=\"56\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Aref Ruqaa\" font-weight=\"700\" font-size=\"50\" fill=\"#0A0A0D\">ش<\/text><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">A3 · SEAL<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">Khatam literally means seal or signet ring. A solid star with ش cut out, like a stamp.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:18px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:center;padding:4px 0\"><svg role=\"img\" aria-label=\"Khatam Softened mark\" width=\"118\" height=\"118\" viewBox=\"0 0 120 120\"><g fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"3.0\"><rect x=\"27.0\" y=\"27.0\" width=\"66\" height=\"66\" rx=\"12\"><\/rect><rect x=\"27.0\" y=\"27.0\" width=\"66\" height=\"66\" rx=\"12\" transform=\"rotate(45 60 60)\"><\/rect><\/g><text x=\"60\" y=\"56\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Aref Ruqaa\" font-weight=\"700\" font-size=\"44\" fill=\"#D4B36A\">ش<\/text><\/svg><\/div><p style=\"margin:0;font-size:11px;letter-spacing:0.2em;color:#D4B36A\">A4 · SOFTENED<\/p><p style=\"margin:0;font-size:13px;line-height:1.45;color:#BDB6A8\">Rounded corners make it friendlier and less like a formal emblem.<\/p><\/div><div style=\"border:1px solid #2A2722;border-radius:14px;background:#111015;padding:18px;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;justify-content:center;padding:4px 0\"><svg role=\"img\" aria-label=\"Khatam Woven mark\" width=\"118\" height=\"118\" viewBox=\"0 0 120 120\"><g fill=\"none\" stroke=\"#D4B36A\" stroke-width=\"9.0\"><rect x=\"26.0\" y=\"26.0\" width=\"68\" height=\"68\" rx=\"0\"><\/rect><rect x=\"26.0\" y=\"26.0\" width=\"68\" height=\"68\" rx=\"0\" transform=\"rotate(45 60 60)\"><\/rect><\/g><g fill=\"none\" stroke=\"#0A0A0D\" stroke-width=\"2.4\"><rect x=\"26.0\" y=\"26.0\" width=\"68\" height=\"68\" rx=\"0\"><\/rect><rect x=\"26.0\" y=\"26.0\" width=\"68\" height=\"68\" rx=\"0\" transform=\"rotate(45 60 60)\"><\/rect><\/g><text x=\"60\" y=\"56\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Aref Ruqaa\" font-weight=\"700\" font-size=\"40\" fill=\"#D4B36A\">ش<\/text -size:14px;line-height:1.5;color:#BDB6A8\">Qāf for qāfiya, the rhyme that binds a poem. The octagon is the tile under every khatam.<\/p><div style=\"display:flex;gap:10px;align-items:center;margin-top:4px\"><div style=\"width:40px;height:40px;border-radius:9px;background:#B8862F;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"32\" height=\"32\" viewBox=\"0 0 120 120\"><path d=\"M104.35 78.37 L78.37 104.35 L41.63 104.35 L15.65 78.37 L15.65 41.63 L41.63 15.65 L78.37 15.65 L104.35 41.63 Z\" fill=\"none\" stroke=\"#1E150A\" stroke-width=\"5.2\" stroke-linejoin=\"round\"><\/path><text x=\"60\" y=\"56\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Aref Ruqaa\" font-weight=\"700\" font-size=\"41.8\" fill=\"#1E150A\">ق<\/text><\/svg><\/div><span style=\"font-size:11px;color:#A8A296\">at 40px<\/span><\/div><\/div><\/div><\/div><\/div>\n<\/x-dc>\n\n<\/body>\n<\/html>\n", "page": "main"}}, "notes": {"row1": {"x": 0, "y": -300, "text": "Reading & listening", "kind": "title1", "maxW": 2270, "page": "main"}, "row2": {"x": 0, "y": 964, "text": "Discovery, sharing & practice", "kind": "title1", "maxW": 2270, "page": "main"}, "row3": {"x": 0, "y": 2228, "text": "Brand identity", "kind": "title1", "maxW": 3400, "page": "main"}, "row4": {"x": 0, "y": 4208, "text": "Geometric explorations", "kind": "title1", "maxW": 3400, "page": "main"}, "row5": {"x": 0, "y": 5348, "text": "Alhambra geometries", "kind": "title1", "maxW": 3400, "page": "main"}, "row6": {"x": 0, "y": 6488, "text": "Refinements: 07 rounded, Arabic & bilingual lockups", "kind": "title1", "maxW": 3400, "page": "main"}, "row7": {"x": 0, "y": 7628, "text": "Fused bilingual names", "kind": "title1", "maxW": 2600, "page": "main"}, "row8": {"x": 0, "y": 8948, "text": "Khatam explorations", "kind": "title1", "maxW": 2240, "page": "main"}, "row9": {"x": 0, "y": 10088, "text": "Letters × geometries", "kind": "title1", "maxW": 2600, "page": "main"}}};
const vp=document.getElementById('vp'),world=document.getElementById('world');
let page=(location.hash.slice(1)||DATA.pages[0].id),z=0.25,list=[];
const tabs=document.getElementById('tabs');
DATA.pages.forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.dataset.id=p.id;b.onclick=()=>{location.hash=p.id;show(p.id)};tabs.appendChild(b)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const f=e.target.querySelector('iframe');if(!f.srcdoc){f.srcdoc=DATA.boards[e.target.dataset.k].html}}}),{root:vp,rootMargin:'600px'});
function show(id){
  page=id;[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  world.innerHTML='';io.disconnect();
  const bs=Object.entries(DATA.boards).filter(([k,b])=>b.page===id);
  const ns=Object.entries(DATA.notes).filter(([k,n])=>n.page===id);
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  const ext=(x,y,w,h)=>{minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x+w);maxy=Math.max(maxy,y+h)};
  bs.forEach(([k,b])=>ext(b.x,b.y-40,b.w,b.h+40));ns.forEach(([k,n])=>ext(n.x,n.y,n.w||n.maxW||600,n.kind==='title1'?60:200));
  const ox=-minx+120,oy=-miny+120;world.style.width=(maxx-minx+240)+'px';world.style.height=(maxy-miny+240)+'px';
  list=bs.sort((a,b)=>a[1].y-b[1].y||a[1].x-b[1].x).map(([k])=>k);
  bs.forEach(([k,b])=>{
    const d=document.createElement('div');d.className='board';d.dataset.k=k;
    Object.assign(d.style,{left:b.x+ox+'px',top:b.y+oy+'px',width:b.w+'px',height:b.h+'px',borderRadius:(b.radius||0)+'px'});
    const f=document.createElement('iframe');f.title=b.title||k;f.style.width=b.w+'px';f.style.height=b.h+'px';d.appendChild(f);
    d.onclick=()=>open(k);world.appendChild(d);io.observe(d);
    const l=document.createElement('div');l.className='blabel';Object.assign(l.style,{left:b.x+ox+'px',top:b.y+oy-30+'px',width:b.w+'px'});l.textContent=b.title||k;world.appendChild(l);
  });
  ns.forEach(([k,n])=>{const d=document.createElement('div');
    if(n.kind==='title1'){d.className='title1';d.style.maxWidth=(n.maxW||2000)+'px'}else{d.className='sticky';d.style.width=(n.w||390)+'px'}
    Object.assign(d.style,{left:n.x+ox+'px',top:n.y+oy+'px'});d.textContent=n.text||'';world.appendChild(d)});
  fit();
}
function setZ(v){z=Math.max(0.05,Math.min(1.5,v));world.style.transform=`scale(${z})`;world.style.marginRight=world.style.marginBottom='0';
  document.getElementById('zl').textContent=Math.round(z*100)+'%';
  const w=parseFloat(world.style.width),h=parseFloat(world.style.height);
  world.parentElement.style.setProperty('--w',w*z);world.style.height=h+'px';
  world.style.marginBottom=(h*z-h)+'px';world.style.marginRight=(w*z-w)+'px'}
function fit(){const w=parseFloat(world.style.width);setZ(Math.min(0.6,vp.clientWidth/w));vp.scrollTo(0,0)}
document.getElementById('zi').onclick=()=>setZ(z*1.25);document.getElementById('zo').onclick=()=>setZ(z/1.25);document.getElementById('zf').onclick=fit;
vp.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZ(z*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
let dr=null;vp.addEventListener('mousedown',e=>{dr={x:e.clientX,y:e.clientY,sl:vp.scrollLeft,st:vp.scrollTop,m:false};vp.classList.add('drag')});
window.addEventListener('mousemove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(Math.abs(dx)+Math.abs(dy)>4)dr.m=true;vp.scrollLeft=dr.sl-dx;vp.scrollTop=dr.st-dy});
window.addEventListener('mouseup',()=>{vp.classList.remove('drag');setTimeout(()=>dr=null,0)});
world.addEventListener('click',e=>{if(dr&&dr.m)e.stopPropagation()},true);
const ov=document.getElementById('ov'),of=document.getElementById('of');let cur=null;
function open(k){cur=k;const b=DATA.boards[k];const s=Math.min(1,(innerWidth-140)/b.w,(innerHeight-90)/b.h);
  of.style.width=b.w+'px';of.style.height=b.h+'px';of.style.transform=`scale(${s})`;of.style.margin=`${(b.h*s-b.h)/2}px ${(b.w*s-b.w)/2}px`;
  of.srcdoc=b.html;document.getElementById('ot').textContent=b.title||k;ov.classList.add('on')}
function step(d){const i=list.indexOf(cur);if(i<0)return;open(list[(i+d+list.length)%list.length])}
document.getElementById('ox').onclick=()=>ov.classList.remove('on');document.getElementById('op').onclick=()=>step(-1);document.getElementById('on').onclick=()=>step(1);
window.addEventListener('keydown',e=>{if(!ov.classList.contains('on'))return;if(e.key==='Escape')ov.classList.remove('on');if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
show(DATA.pages.some(p=>p.id===page)?page:DATA.pages[0].id);
</script>
